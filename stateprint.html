d var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.02)}.group-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.group-size{font-weight:850;font-size:20px}.signature{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.sig-pill{font-size:10px;border:1px solid #2a3859;background:#0c142a;border-radius:999px;padding:3px 7px;color:#cbd5ef}.game-layout{display:grid;grid-template-columns:minmax(390px,470px) minmax(0,1fr);gap:18px}.game-side{padding:18px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}.target-card{padding:14px;border:1px solid #5e5526;background:rgba(252,211,77,.07);border-radius:14px;margin-bottom:12px}.target-card .target-name{font-size:30px;font-weight:900;letter-spacing:-.025em}.game-status{padding:13px;border-radius:13px;border:1px solid var(--line);margin-bottom:12px}.game-status.good{border-color:#2d7c56;background:rgba(134,239,172,.06)}.game-status.bad{border-color:#8d4251;background:rgba(253,164,175,.07)}.game-main{padding:18px}.victory{padding:15px;border:1px solid #2d7c56;background:rgba(134,239,172,.07);border-radius:14px;margin-bottom:14px}.source-list{display:grid;gap:12px}.source-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.02)}.source-title{display:flex;justify-content:space-between;gap:12px}.source-title h3{margin:0;font-size:16px}.confidence{font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:3px 7px;height:max-content;border:1px solid var(--line);color:var(--muted)}.confidence.caution{border-color:#826f2a;color:var(--warn)}.confidence.medium{border-color:#3f6686;color:#bfe5ff}.source-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.source-links a{color:var(--accent);text-decoration:none;border-bottom:1px dotted #4b91ad}.source-note{margin-top:8px;color:var(--muted);font-size:12px}.distribution{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.notice{border:1px solid #6c5b20 <body>
<div class="shell">
  <div class="topbar">
    <div class="brand-row">
      <a class="home-btn" href="https://thomaslab.me/" aria-label="Thomas Lab home">← Home</a>
      <h1 class="title">Stateprint</h1>
      <span class="meta">23 policies · 50 states</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="explore">Explore</button>
      <button class="tab" data-view="game">Game</button>
      <button class="tab" data-view="sources">Sources</button>
    </div>
  </div>

  <section class="view active" id="view-explore">
    <div class="explore-grid">
      <aside class="panel panel-pad sticky-panel">
        <div class="section-head"><h2>Policies</h2><span class="mini-badge" id="selectedBadge">0 selected</span></div>
        <input class="search" id="policySearch" placeholder="Search policies…">
        <div class="btn-row" style="margin-top:9px"><button class="btn" id="clearAll">Clear all</button></div>
        <div class="policy-list" id="policyList"></div>
      </aside>
      <main>
        <div class="stats" id="stats"></div>
        <div class="panel display-toolbar">
          <div class="btn-row" id="displayModes">
            <button class="btn active" data-mode="matchesMap">Match map</button>
            <button class="btn" data-mode="groupsMap">Group map</button>
            <button class="btn" data-mode="matchesList">Matches</button>
            <button class="btn" data-mode="groupsList">Groups</button>
          </div>
        </div>
        <div class="panel display-area" id="displayArea"></div>
      </main>
    </div>
  </section>

  <section class="view" id="view-game">
    <div class="game-layout">
      <aside class="panel game-side">
        <div class="section-head"><h2>Find the state</h2></div>
        <div class="target-card"><div class="target-name" id="gameTargetName">—</div></div>
        <div class="btn-row"><button class="btn primary" id="newRandomGame">New target</button><button class="btn" id="resetGame">Reset</button></div>
        <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:12px" id="gameStats"></div>
        <div id="gameStatus"></div>
        <input class="search" id="gamePolicySearch" placeholder="Search policies…">
        <div class="policy-list" id="gamePolicyList"></div>
      </aside>
      <main class="panel game-main">
        <div id="gameVictory"></div>
        <div id="gameMap"></div>
      </main>
    </div>
  </section>

  <section class="view" id="view-sources">
    <div class="notice">Simplified statewide classifications. Check the source for exceptions.</div>
    <div class="panel panel-pad">
      <div class="section-head"><h2>Sources</h2></div>
      <div class="source-list" id="sourceList"></div>
    </div>
  </section>
  <div class="footer">Stateprint · Sep 2026</div>
</div>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const byId=Object.fromEntries(DATA.policies.map(p=>[p.id,p]));
const ABBR={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};
const POS={
"Alaska":[1,7],"Hawaii":[2,7],"Washington":[1,2],"Oregon":[1,3],"California":[1,4],"Idaho":[2,3],"Nevada":[2,4],"Arizona":[2,5],"Montana":[3,2],"Wyoming":[3,3],"Utah":[3,4],"New Mexico":[3,5],"North Dakota":[4,2],"South Dakota":[4,3],"Colorado":[4,4],"Texas":[4,6],"Minnesota":[5,2],"Nebraska":[5,3],"Kansas":[5,4],"Oklahoma":[5,5],"Wisconsin":[6,2],"Iowa":[6,3],"Missouri":[6,4],"Arkansas":[6,5],"Louisiana":[6,6],"Michigan":[7,2],"Illinois":[7,3],"Mississippi":[7,6],"Indiana":[8,3],"Kentucky":[8,4],"Tennessee":[8,5],"Alabama":[8,6],"Ohio":[9,3],"West Virginia":[9,4],"Georgia":[9,6],"Florida":[9,7],"Pennsylvania":[10,3],"North Carolina":[10,5],"South Carolina":[10,6],"New York":[11,2],"Virginia":[11,4],"New Jersey":[11,3],"Vermont":[12,1],"Massachusetts":[12,2],"Connecticut":[12,3],"Delaware":[12,5],"New Hampshire":[13,1],"Rhode Island":[13,3],"Maryland":[13,4],"Maine":[14,1]};
let exploreFilters={};
let exploreMode='matchesMap';
let game={started:false,target:null,filters:{}};

function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function activeIds(filters){return DATA.policies.map(p=>p.id).filter(id=>Object.prototype.hasOwnProperty.call(filters,id));}
function signature(state,ids){return ids.map(id=>byId[id].values[state]);}
function signatureKey(state,ids){return JSON.stringify(signature(state,ids));}
function matchesFor(filters){const ids=activeIds(filters);return DATA.states.filter(s=>ids.every(id=>byId[id].values[s]===filters[id]));}
function groupsForFilters(filters){const ids=activeIds(filters), map=new Map();for(const s of DATA.states){const k=signatureKey(s,ids);if(!map.has(k))map.set(k,[]);map.get(k).push(s)}return [...map.entries()].map(([k,states])=>({sig:JSON.parse(k),states})).sort((a,b)=>b.states.length-a.states.length||a.states[0].localeCompare(b.states[0]));}
function groupColor(i){const hue=(i*137.508+18)%360;return `hsl(${hue.toFixed(1)} 68% 58%)`;}
function textOnColor(){return '#07111a';}
function policyValues(p){return Object.keys(p.counts);}
function toggleFilter(filters,id,value){if(filters[id]===value)delete filters[id];else filters[id]=value;}

function policyListHTML(filters,query=''){
  const q=query.trim().toLowerCase();
  return DATA.policies.filter(p=>!q||p.name.toLowerCase().includes(q)||p.definition.toLowerCase().includes(q)||policyValues(p).some(v=>v.toLowerCase().includes(q))).map(p=>{
    const active=Object.prototype.hasOwnProperty.call(filters,p.id);
    return `<div class="policy-row ${active?'active':''}" data-policy-row="${p.id}"><div class="policy-name" title="${esc(p.definition)}">${esc(p.name)}</div><div class="value-buttons">${policyValues(p).map(v=>`<button class="value-btn ${filters[p.id]===v?'active':''}" data-policy="${p.id}" data-value="${esc(v)}">${esc(v)} <span class="n">${p.counts[v]}</span></button>`).join('')}</div></div>`;
  }).join('');
}
function wirePolicyButtons(container,filters,onChange){container.querySelectorAll('.value-btn').forEach(b=>b.addEventListener('click',()=>{toggleFilter(filters,b.dataset.policy,b.dataset.value);onChange();}));}

function renderExplorePolicyList(){const el=$('#policyList');el.innerHTML=policyListHTML(exploreFilters,$('#policySearch').value);wirePolicyButtons(el,exploreFilters,renderExplore);}
function renderExplore(){
  renderExplorePolicyList();
  const ids=activeIds(exploreFilters), matches=matchesFor(exploreFilters), groups=groupsForFilters(exploreFilters);
  $('#selectedBadge').textContent=`${ids.length} selected`;
  $('#stats').innerHTML=`<div class="stat"><div class="num">${matches.length}</div><div class="lab">Matches</div></div><div class="stat"><div class="num">${ids.length}</div><div class="lab">Policies</div></div><div class="stat"><div class="num">${groups.length}</div><div class="lab">Groups</div></div><div class="stat"><div class="num">${Math.max(...groups.map(g=>g.states.length))}</div><div class="lab">Largest</div></div>`;
  $$('#displayModes .btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===exploreMode));
  renderExploreDisplay(matches,groups,ids);
}
function tileMapHTML({matches=null,groups=null,target=null,title,subtitle}){
  const matchSet=matches?new Set(matches):null;
  const groupInfo=new Map();
  if(groups){groups.forEach((g,i)=>g.states.forEach(s=>groupInfo.set(s,{i,size:g.states.length,color:groupColor(i)})));}
  const tiles=DATA.states.map(s=>{
    const [c,r]=POS[s];
    const isMatch=matchSet?matchSet.has(s):true;
    const gi=groupInfo.get(s);
    let cls='state-tile',style=`grid-column:${c};grid-row:${r};`;
    if(matches){cls+=isMatch?' match':' dim';}
    if(gi){style+=`background:${gi.color};color:${textOnColor()};`;}
    if(target===s)cls+=' target';
    const extra=gi?` · group of ${gi.size}`:(matches?(isMatch?' · matches':' · excluded'):'');
    return `<div class="${cls}" style="${style}">${ABBR[s]}<span class="tip">${esc(s)}${extra}</span></div>`;
  }).join('');
  let legend='';
  if(matches)legend=`<div class="legend"><div class="legend-item"><span class="swatch" style="background:var(--accent-strong)"></span>Matches</div><div class="legend-item"><span class="swatch" style="background:#283047"></span>Does not match</div>${target?`<div class="legend-item"><span class="swatch" style="background:transparent;border:2px solid var(--warn)"></span>Target</div>`:''}</div>`;
  else if(groups)legend=`<div class="legend"><div class="legend-item">Each exact fingerprint group gets its own color. ${groups.length} ${groups.length===1?'group':'groups'} shown.</div></div>`;
  return `<div class="map-caption"><div><h2>${esc(title)}</h2><div class="muted small">${esc(subtitle)}</div></div></div><div class="tile-map-wrap"><div class="tile-map">${tiles}</div></div>${legend}`;
}
function renderExploreDisplay(matches,groups,ids){
  const area=$('#displayArea');
  if(exploreMode==='matchesMap'){
    area.innerHTML=tileMapHTML({matches,groups:null,title:`${matches.length} matching ${matches.length===1?'state':'states'}`,subtitle:ids.length?'':'Select a policy to begin.'});
  }else if(exploreMode==='groupsMap'){
    area.innerHTML=tileMapHTML({matches:null,groups,title:`${groups.length} fingerprint ${groups.length===1?'group':'groups'}`,subtitle:ids.length?'Same color = same selected-policy fingerprint.':'Select a policy to begin.'});
  }else if(exploreMode==='matchesList'){
    area.innerHTML=`<div class="map-caption"><div><h2>${matches.length} matching ${matches.length===1?'state':'states'}</h2></div></div>${matches.length?`<div class="state-list">${matches.map(s=>`<span class="state-chip">${esc(s)}</span>`).join('')}</div>`:'<div class="empty">No states match this combination.</div>'}`;
  }else{
    area.innerHTML=`<div class="map-caption"><div><h2>All ${groups.length} fingerprint ${groups.length===1?'group':'groups'}</h2></div></div><div class="groups">${groups.map((g,i)=>`<div class="group-card"><div class="group-top"><div><span class="swatch" style="display:inline-block;background:${groupColor(i)};vertical-align:-2px;margin-right:7px"></span><span class="group-size">${g.states.length}</span> ${g.states.length===1?'state':'states'}</div></div><div class="state-list" style="margin-top:9px">${g.states.map(s=>`<span class="state-chip">${esc(s)}</span>`).join('')}</div>${ids.length?`<div class="signature">${ids.map((id,j)=>`<span class="sig-pill">${esc(byId[id].name)}: <b>${esc(g.sig[j])}</b></span>`).join('')}</div>`:''}</div>`).join('')}</div>`;
  }
}

function randomState(){return DATA.states[Math.floor(Math.random()*DATA.states.length)];}
function startRandomGame(){game.started=true;game.target=randomState();game.filters={};renderGame();}
function renderGamePolicyList(){const el=$('#gamePolicyList');el.innerHTML=policyListHTML(game.filters,$('#gamePolicySearch').value);wirePolicyButtons(el,game.filters,renderGame);}
function renderGame(){
  if(!game.started){startRandomGame();return;}
  renderGamePolicyList();
  const ids=activeIds(game.filters), matches=matchesFor(game.filters), targetIn=matches.includes(game.target), won=targetIn&&matches.length===1;
  $('#gameTargetName').textContent=game.target;
  $('#gameStats').innerHTML=`<div class="stat"><div class="num">${ids.length}</div><div class="lab">Policies used</div></div><div class="stat"><div class="num">${matches.length}</div><div class="lab">States remaining</div></div>`;
  const status=$('#gameStatus');
  if(won)status.innerHTML='';
  else if(!targetIn)status.innerHTML=`<div class="game-status bad"><b>${esc(game.target)} eliminated.</b><div class="small">One or more choices are wrong.</div></div>`;
  else status.innerHTML=`<div class="game-status good"><b>${matches.length} states remain.</b></div>`;
  $('#gameVictory').innerHTML=won?`<div class="victory"><b>✓ ${esc(game.target)}</b> in ${ids.length} ${ids.length===1?'policy':'policies'}. <button class="btn good" id="victoryNext" style="margin-left:8px">Next</button></div>`:'';
  if(won)$('#victoryNext').addEventListener('click',startRandomGame);
  $('#gameMap').innerHTML=tileMapHTML({matches,groups:null,target:game.target,title:won?`${game.target} isolated`:`${matches.length} states remaining`,subtitle:won?'':targetIn?'Yellow outline = target.':'Target is excluded.'});
}

function renderSources(){$('#sourceList').innerHTML=DATA.policies.map((p,i)=>`<div class="source-card"><div class="source-title"><h3>${i+1}. ${esc(p.name)}</h3><span class="confidence ${p.confidence}">${p.confidence==='high'?'high confidence':p.confidence==='medium'?'definition-sensitive':'classification-sensitive'}</span></div><div class="muted small" style="margin-top:6px">${esc(p.definition)}</div><div class="distribution">${Object.entries(p.counts).map(([k,v])=>`<span class="mini-badge">${esc(k)}: ${v}</span>`).join('')}</div>${p.note?`<div class="source-note">${esc(p.note)}</div>`:''}<div class="source-links">${p.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join('')}</div></div>`).join('');}
function init(){
  $('#policySearch').addEventListener('input',renderExplorePolicyList);
  $('#clearAll').addEventListener('click',()=>{exploreFilters={};renderExplore();});
  $$('#displayModes .btn').forEach(b=>b.addEventListener('click',()=>{exploreMode=b.dataset.mode;renderExplore();}));
  $('#gamePolicySearch').addEventListener('input',renderGamePolicyList);
  $('#newRandomGame').addEventListener('click',startRandomGame);
  $('#resetGame').addEventListener('click',()=>{game.filters={};renderGame();});
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.view').forEach(v=>v.classList.remove('active'));$('#view-'+t.dataset.view).classList.add('active');if(t.dataset.view==='game'&&!game.started)startRandomGame();}));
  const allIds=DATA.policies.map(p=>p.id), allGroups=new Set(DATA.states.map(s=>signatureKey(s,allIds)));
  
  renderExplore();renderSources();
}
init();
</script>
