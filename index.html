<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive projects, games, maps, rankings, and other things Thomas made.">
  <meta name="theme-color" content="#fff8ed">
  <title>Thomas Made This</title>
  <style>
    :root {
      --bg: #fff8ed;
      --ink: #171717;
      --muted: #68645f;
      --paper: #fffdf8;
      --line: #171717;
      --shadow: 5px 5px 0 var(--line);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 2%, #ffe08a 0 0, transparent 22rem),
        radial-gradient(circle at 96% 30%, #b8e0ff 0 0, transparent 24rem),
        var(--bg);
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(1180px, calc(100% - 34px));
      margin: 0 auto;
    }

    .hero {
      min-height: 330px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 34px;
      align-items: center;
      padding: 42px 0 16px;
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .hero-copy { max-width: 850px; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 9.4vw, 116px);
      line-height: .87;
      letter-spacing: -.065em;
      font-weight: 900;
      text-wrap: balance;
    }

    .underline {
      position: relative;
      display: inline-block;
      z-index: 0;
    }

    .underline::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 2%;
      right: -1%;
      bottom: -.02em;
      height: .14em;
      border-radius: 999px;
      background: #7ed9a1;
      transform: rotate(-1.3deg);
    }

    .intro {
      max-width: 700px;
      margin: 24px 0 0;
      color: #4a4742;
      font-size: clamp(20px, 2vw, 24px);
      line-height: 1.35;
      font-weight: 800;
    }

    .project-count {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .traffic-fine {
      width: fit-content;
      margin: 10px 0 0;
      padding: 6px 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #ffd76a;
      box-shadow: 2px 2px 0 var(--line);
      font-size: 12px;
      line-height: 1;
      font-weight: 850;
    }
    .traffic-fine[hidden] { display: none; }
    .traffic-fine strong { font-weight: 950; }

    .button {
      min-height: 49px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--line);
      text-decoration: none;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .button.primary { background: var(--ink); color: white; box-shadow: 4px 4px 0 #ff9f91; }

    .hero-side .button {
      width: 150px;
      min-height: 46px;
      padding-inline: 14px;
      font-size: 14px;
    }
    .button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }
    .button.primary:hover { box-shadow: 6px 6px 0 #ff9f91; }
    .button:active { transform: translate(1px, 1px); }

    .hero-doodle {
      width: 160px;
      height: 160px;
      position: relative;
      border: 3px solid var(--line);
      border-radius: 34px;
      background: #ff887c;
      box-shadow: 8px 8px 0 var(--line);
      transform: rotate(6deg);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .hero-doodle:hover { transform: rotate(-3deg) scale(1.04); }
    .hero-doodle.bounce { animation: bounce .62s cubic-bezier(.2,.85,.2,1); }

    .hero-doodle .eye {
      position: absolute;
      width: 18px;
      height: 24px;
      top: 52px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: white;
    }
    .hero-doodle .eye::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 8px;
      top: 7px;
      left: 5px;
      border-radius: 50%;
      background: var(--ink);
      transform: translate(var(--eye-x, 0px), var(--eye-y, 0px));
      transition: transform .08s linear;
    }
    .hero-doodle .eye.one { left: 45px; }
    .hero-doodle .eye.two { right: 45px; }
    .hero-doodle .mouth {
      position: absolute;
      width: 55px;
      height: 25px;
      left: 50%;
      bottom: 37px;
      border: 3px solid var(--line);
      border-top: 0;
      border-radius: 0 0 50px 50px;
      transform: translateX(-50%);
    }

    @keyframes bounce {
      0% { transform: rotate(6deg) translateY(0); }
      35% { transform: rotate(-10deg) translateY(-28px) scale(1.08); }
      72% { transform: rotate(11deg) translateY(3px) scale(.97); }
      100% { transform: rotate(6deg) translateY(0); }
    }

    .projects {
      position: relative;
      padding: 0;
    }

    .projects::before {
      content: "✦";
      position: absolute;
      left: -20px;
      top: 18px;
      font-size: 24px;
      transform: rotate(-14deg);
      opacity: .65;
      pointer-events: none;
    }

    .visual-doodles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .visual-doodle {
      position: absolute;
      display: grid;
      place-items: center;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform .18s ease;
    }

    .visual-doodle:hover { transform: rotate(12deg) scale(1.16); }

    .spark-star {
      width: 34px;
      height: 34px;
      left: -9px;
      top: 47%;
      font-size: 28px;
      line-height: 1;
      color: #e5a900;
      transform: rotate(-10deg);
    }

    .party-hat {
      position: absolute;
      width: 0;
      height: 0;
      left: 50%;
      top: -36px;
      z-index: 3;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-bottom: 70px solid #ffd76a;
      transform: translateX(-50%) rotate(-4deg) scale(.8);
      transform-origin: bottom center;
      opacity: 0;
      pointer-events: none;
    }

    .party-hat::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: -8px;
      top: 55px;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: #addcff;
    }

    .hero-doodle.party .party-hat {
      opacity: 1;
      animation: hatpop .48s cubic-bezier(.2,.9,.25,1.2);
    }

    @keyframes hatpop {
      0% { transform: translateX(-50%) rotate(-10deg) scale(.2); }
      70% { transform: translateX(-50%) rotate(5deg) scale(1.08); }
      100% { transform: translateX(-50%) rotate(-4deg) scale(.8); }
    }

    .face-spark {
      position: fixed;
      z-index: 120;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      animation: facespark .7s ease-out forwards;
    }

    @keyframes facespark {
      to {
        opacity: 0;
        transform: translate(var(--sx), var(--sy)) scale(.2);
      }
    }

    .about {
      padding: 0 0 64px;
    }

    .about-head {
      margin: 20px 0 11px;
    }

    .about-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .row-label {
      margin: 20px 0 11px;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .grid + .grid { margin-top: 18px; }

    .card {
      --c: #d9eaff;
      --r: 0deg;
      grid-column: span 4;
      height: 286px;
      min-height: 286px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 24px;
      border: 3px solid var(--line);
      border-radius: var(--radius);
      background: var(--c);
      color: var(--ink);
      box-shadow: var(--shadow);
      text-decoration: none;
      transform: rotate(var(--r));
      transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease;
      isolation: isolate;
    }

    .card.feature {
      grid-column: span 6;
      height: 286px;
      min-height: 286px;
      --r: 0deg;
    }


    .card:nth-child(4n + 1) { --r: -.25deg; }
    .card:nth-child(4n + 3) { --r: .25deg; }
    .card.feature { --r: 0deg; }
    .card:hover {
      z-index: 4;
      transform: translate(-4px, -5px) rotate(0deg);
      box-shadow: 9px 10px 0 var(--line);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 3px solid rgba(23,23,23,.82);
      opacity: .14;
      pointer-events: none;
    }

    .card::before {
      width: 160px;
      height: 160px;
      right: -65px;
      top: -68px;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .card::after {
      width: 75px;
      height: 75px;
      right: 45px;
      bottom: -43px;
      transform: rotate(24deg);
      background: rgba(255,255,255,.5);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .icon {
      width: 67px;
      height: 67px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.76);
      box-shadow: 3px 3px 0 rgba(23,23,23,.18);
      font-size: 32px;
      transform: rotate(-3deg);
      transition: transform .2s ease;
    }

    .card:hover .icon { transform: rotate(5deg) scale(1.05); }

    .animated-icon {
      position: relative;
      cursor: pointer;
      overflow: visible;
    }

    .animated-icon:focus-visible {
      outline: 3px solid var(--line);
      outline-offset: 4px;
    }

    .icon-glyph {
      display: inline-block;
      transform-origin: center;
    }

    .train-icon .train-glyph {
      display: inline-block;
    }

    .card:hover .train-icon .train-glyph {
      animation: trainRock 2.0s ease-in-out infinite alternate;
    }

    .steam {
      position: absolute;
      width: 10px;
      height: 10px;
      left: 15px;
      top: 8px;
      border: 2px solid rgba(23,23,23,.5);
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      opacity: 0;
      pointer-events: none;
    }

    .card:hover .train-icon .steam { animation: steamPuff 3.0s ease-out infinite; }
    .card:hover .train-icon .steam-two { animation-delay: 1.0s; }
    .card:hover .train-icon .steam-three { animation-delay: 2.0s; }

    @keyframes trainRock {
      from { transform: translateY(1px) rotate(-2deg); }
      to { transform: translateY(-1px) rotate(2deg); }
    }

    @keyframes steamPuff {
      0%, 20% { opacity: 0; transform: translate(0, 8px) scale(.45); }
      35% { opacity: .9; }
      100% { opacity: 0; transform: translate(-13px, -22px) scale(1.45); }
    }

    .card:hover .train-icon.active .train-glyph { animation: trainDash 1.05s ease; }
    .card:hover .train-icon.active .steam { animation: steamPuff 1.15s ease-out 1; }

    @keyframes trainDash {
      0% { transform: translateX(0) rotate(0); }
      45% { transform: translateX(10px) rotate(3deg); }
      100% { transform: translateX(0) rotate(0); }
    }

    .traffic-case {
      width: 29px;
      height: 51px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 4px 0;
      border: 3px solid var(--line);
      border-radius: 9px;
      background: #2b2b2b;
      box-shadow: 2px 2px 0 rgba(23,23,23,.18);
    }

    .traffic-case::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 11px;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      background: var(--line);
      border-radius: 0 0 4px 4px;
    }

    .light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      transition: background .12s linear, box-shadow .12s linear;
    }

    .traffic-icon[data-signal="red"] .red {
      background: #ff5d57;
      box-shadow: 0 0 9px #ff5d57;
    }
    .traffic-icon[data-signal="amber"] .amber {
      background: #ffd166;
      box-shadow: 0 0 9px #ffd166;
    }
    .traffic-icon[data-signal="green"] .green {
      background: #65d17a;
      box-shadow: 0 0 9px #65d17a;
    }

    .card:hover .traffic-icon.active .traffic-case { animation: trafficBounce 1.2s ease; }
    @keyframes trafficBounce { 50% { transform: translateY(-7px) rotate(4deg); } }

    .compass-face {
      width: 48px;
      height: 48px;
      position: relative;
      display: grid;
      place-items: center;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: #fffdf8;
    }

    .compass-face b {
      position: absolute;
      top: 2px;
      font-size: 9px;
      line-height: 1;
    }

    .compass-needle {
      width: 4px;
      height: 30px;
      position: absolute;
      border-radius: 999px;
      background: linear-gradient(to bottom, #ff6961 0 50%, var(--line) 50% 100%);
      transform-origin: center;

    }

    .compass-needle::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 50%;
      top: 50%;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: white;
      transform: translate(-50%,-50%);
    }

    @keyframes compassWander {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(82deg); }
      50% { transform: rotate(197deg); }
      75% { transform: rotate(305deg); }
    }

    .card:hover .compass-icon .compass-needle { animation: compassWander 12s ease-in-out infinite; }
    .card:hover .compass-icon.active .compass-needle { animation: compassSpin 1.5s cubic-bezier(.2,.8,.2,1); }
    @keyframes compassSpin { to { transform: rotate(720deg); } }

    .dice-face {
      display: inline-block;
      font-size: 38px;
      line-height: 1;
      transform-origin: center;
    }
    .dice-icon.rolling .dice-face,
    .card:hover .dice-icon.active .dice-face {
      animation: diceRoll 1.05s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      35% { transform: rotate(145deg) scale(1.24); }
      70% { transform: rotate(285deg) scale(.92); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .bike-icon { overflow: hidden; }
    .bike-pack {
      position: relative;
      display: inline-flex;
      align-items: center;
      transform: translateX(0);
    }
    .bike-rider {
      display: inline-block;
      font-size: 34px;
      line-height: 1;
      transform: scaleX(-1);
      transform-origin: center;
    }
    .bike-dust {
      position: absolute;
      left: -15px;
      top: 19px;
      font-size: 17px;
      line-height: 1;
      opacity: 0;
      transform: scaleX(-1);
    }
    .card:hover .bike-icon .bike-pack { animation: bikeRide 5.8s ease-in-out infinite; }
    .card:hover .bike-icon .bike-dust { animation: bikeDust 5.8s linear infinite; }
    .card:hover .bike-icon.active .bike-pack { animation: bikeRide 2.5s ease-in-out 1; }
    .card:hover .bike-icon.active .bike-dust { animation: bikeDust 2.5s linear 1; }
    @keyframes bikeRide {
      0%, 20% { transform: translateX(0); }
      46% { transform: translateX(64px); }
      46.1% { transform: translateX(-64px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes bikeDust {
      0%, 19%, 73%, 100% { opacity: 0; transform: translateX(0) scaleX(-1) scale(.75); }
      24%, 42%, 51%, 67% { opacity: .82; transform: translateX(-4px) scaleX(-1) scale(1); }
      46%, 46.1% { opacity: 0; }
    }

    .map-stage {
      width: 58px;
      height: 48px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .us-score-map {
      width: 59px;
      height: 40px;
      overflow: visible;
      filter: drop-shadow(.7px .7px 0 rgba(23,23,23,.12));
    }
    .state-cell {
      fill: #e8e3d8;
      stroke: rgba(23,23,23,.22);
      stroke-width: .38;
      vector-effect: non-scaling-stroke;
      transition: fill .28s ease, transform .22s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .state-cell.good { fill: #73d596; }
    .state-cell.bad { fill: #ff8e86; }
    .state-cell.just-flipped { transform: scale(.84); }
    .map-icon.active .us-score-map { animation: mapScorePop .55s ease; }
    @keyframes mapScorePop {
      45% { transform: scale(1.08) rotate(-2deg); }
    }

    .house-icon {
      background: rgba(255,255,255,.76);
      overflow: hidden;
    }
    .house-stage {
      width: 58px;
      height: 54px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .house-art {
      width: 50px;
      height: 45px;
      position: relative;
      margin-top: 2px;
    }
    .house-chimney {
      width: 8px;
      height: 16px;
      position: absolute;
      right: 5px;
      top: 0;
      border: 2px solid var(--line);
      border-radius: 2px 2px 0 0;
      background: #8b6651;
      z-index: 0;
      opacity: 0;
    }
    .house-roof {
      width: 31px;
      height: 31px;
      position: absolute;
      left: 9px;
      top: 1px;
      border: 3px solid var(--line);
      border-radius: 4px;
      background: #d8785a;
      transform: rotate(45deg);
      z-index: 1;
    }
    .house-body {
      width: 40px;
      height: 28px;
      position: absolute;
      left: 5px;
      bottom: 1px;
      z-index: 2;
      border: 3px solid var(--line);
      border-radius: 3px;
      background: #f5d37b;
      overflow: hidden;
    }
    .house-door {
      width: 9px;
      height: 16px;
      position: absolute;
      left: 14px;
      bottom: -2px;
      border: 2px solid var(--line);
      border-radius: 2px 2px 0 0;
      background: #39556f;
    }
    .house-door::before {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 3px;
      height: 5px;
      border: 1px solid rgba(23,23,23,.42);
      border-radius: 1px;
    }
    .house-door::after {
      content: "";
      width: 2px;
      height: 2px;
      position: absolute;
      right: 1px;
      top: 8px;
      border-radius: 50%;
      background: #ffd76a;
      box-shadow: 0 0 0 .5px var(--line);
    }
    .house-window {
      width: 7px;
      height: 7px;
      position: absolute;
      top: 6px;
      border: 2px solid var(--line);
      background: #b8e0ff;
    }
    .house-window.left { left: 3px; }
    .house-window.right { right: 3px; }
    .house-window-box {
      width: 10px;
      height: 4px;
      position: absolute;
      top: 14px;
      z-index: 4;
      border: 1.5px solid var(--line);
      border-radius: 1px 1px 3px 3px;
      background: linear-gradient(to bottom, #64a65f 0 43%, #94633f 43% 100%);
      opacity: 0;
    }
    .house-window-box.left { left: 1px; }
    .house-window-box.right { right: 1px; }
    .house-hedge {
      width: 15px;
      height: 8px;
      position: absolute;
      bottom: -1px;
      z-index: 3;
      border: 2px solid var(--line);
      border-radius: 8px 8px 3px 3px;
      background: #65a765;
      opacity: 0;
    }
    .house-hedge.left { left: -3px; }
    .house-hedge.right { right: -3px; }
    .house-dormer {
      width: 12px;
      height: 10px;
      position: absolute;
      left: 19px;
      top: 4px;
      z-index: 5;
      border: 2px solid var(--line);
      border-radius: 2px 2px 1px 1px;
      background: #fffdf8;
      opacity: 0;
    }
    .house-dormer::before {
      content: "";
      width: 9px;
      height: 9px;
      position: absolute;
      left: 0;

    .card:hover .visited-icon.active .visited-car { animation: visitRoute 1.4s ease-in-out .54s 1; }
    @keyframes visitStamp {
      0%,10% { opacity:0; transform:scale(1.7) rotate(-18deg); }
      17%,76% { opacity:1; transform:scale(1) rotate(-8deg); }
      90%,100% { opacity:0; transform:scale(.85) rotate(-8deg); }
    }
    @keyframes visitRoute {
      0%,8% { offset-distance:0%; opacity:0; }
      14% { opacity:1; }
      76% { offset-distance:100%; opacity:1; }
      88%,100% { offset-distance:100%; opacity:0; }
    }

    .copy {
      margin-top: 34px;
      padding-right: 42px;
    }

    .copy h3 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(27px, 2.35vw, 34px);
      line-height: .98;
      letter-spacing: -.04em;
    }

    .copy p {
      max-width: 100%;
      margin: 12px 0 0;
      color: rgba(23,23,23,.72);
      font-size: 15px;
      line-height: 1.42;
      font-weight: 600;
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 18px;
      font-size: 30px;
      font-weight: 900;
      transition: transform .18s ease;
    }

    .card:hover .arrow { transform: translateX(5px); }

    .external .arrow { transform: rotate(-45deg); }
    .external:hover .arrow { transform: translate(4px,-4px) rotate(-45deg); }

    .coming { cursor: pointer; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 100;
      padding: 12px 16px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: white;
      box-shadow: 4px 4px 0 var(--line);
      font-weight: 800;
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; min-height: auto; padding: 52px 0 30px; }
      .hero-doodle { display: none; }
      .card, .card.feature { grid-column: span 6; height: 286px; min-height: 286px; }
      #gamesGrid .card, #aboutGrid .card { grid-column: span 6; }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1180px); }
      .hero { padding-top: 40px; padding-bottom: 24px; }
      h1 { font-size: clamp(55px, 18vw, 82px); }
      .intro { margin-top: 20px; }
      .grid { gap: 15px; }
      .grid + .grid { margin-top: 15px; }
      .card, .card.feature { grid-column: 1 / -1; height: 260px; min-height: 260px; padding: 21px; }
      #gamesGrid .card, #aboutGrid .card { grid-column: 1 / -1; }
      .copy { margin-top: 31px; }
      .copy h3 { font-size: 33px; }
      .spark-star { left: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /*

    const projects = [

    const featureGrid = document.getElementById("featureGrid");

    const aboutGrid = document.getElementById("aboutGrid");

    const trafficFine = document.getElementById("trafficFine");

    const escapeHTML = value => String(value).replace(/[&<>'"]/g, ch => ({

    function iconMarkup(p) {

      }
      if (action === "scissors") {

      }
      if (action === "medals") {
        const starterAnimals = ["🐶","🐱","🦊","🐼","🐸","🐧","🐵","🐯","🐰"];
        return `<div class="icon animated-icon medals-icon" data-action="medals" aria-label="Randomize tier list" role="button" tabindex="0">

        </div>`;
      }
      if (action === "challenge") {
        return `<div class="icon animated-icon challenge-icon" data-action="challenge" aria-label="Animate challenge" role="button" tabindex="0">
          <span class="challenge-stage" aria-hidden="true">
            <i class="challenge-scene one scene-one"><b class="throw-ball"></b><b class="throw-cup"></b></i>
            <i class="challenge-scene two scene-two"><b class="stack-cup a"></b><b class="stack-cup b"></b><b class="stack-cup c"></b></i>

      if (action === "recipe") {
        return `<div class="icon animated-icon recipe-icon" data-action="recipe" aria-label="Flip recipe book" role="button" tabindex="0">
          <span class="recipe-book" aria-hidden="true">

            <i class="recipe-page left"><b class="recipe-heading"></b><span class="recipe-lines"></span></i>
            <i class="recipe-page right"><span class="recipe-photo"><b class="recipe-dish one current">🍝</b><b class="recipe-dish two">🥞</b><b class="recipe-dish three">🍪</b></span><span class="recipe-caption-lines"></span></i>
            <i class="recipe-spine"></i><i class="recipe-turning-page"></i>
          </span>
        </div>`;
      }
      if (action === "visited") {
        return `<div class="icon animated-icon visited-icon" data-action="visited" aria-label="Animate visited places" role="button" tabindex="0">
          <span class="visited-stage" aria-hidden="true"><b class="visited-map">🗺️</b><i class="visited-stamp one">✓</i><i class="visited-stamp two">✓</i><i class="visited-stamp three">✓</i><b class="visited-vehicle visited-plane">✈</b><b class="visited-vehicle visited-bike">🚴</b><b class="visited-vehicle visited-train">🚂</b><b class="visited-vehicle visited-car">🚗</b></span>
        </div>`;
      }
      if (action === "map") {
        return `<div class="icon animated-icon map-icon" data-action="map" aria-label="Animate place scores" role="button" tabindex="0">
          <span class="map-stage" aria-hidden="true">
            <svg class="us-score-map" viewBox="0 0 64 38" role="presentation">
              <rect class="state-cell" x="19" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="24" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="29" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="34" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="39" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="44" y="5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="13" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="18" y="9.5" width="4.5" height="4" rx=".65"/>
              <rect class="state-cell" x="23" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="28" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="33" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="38" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="43" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="48" y="9.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="8" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="13" y="14" width="4.5" height="4" rx=".65"/>
              <rect class="state-cell" x="18" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="23" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="28" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="33" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="38" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="43" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="48" y="14" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="53" y="14" width="4.5" height="4" rx=".65"/>
              <rect class="state-cell" x="5.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="10.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="15.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="20.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="25.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="30.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="35.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="40.5" y="18.5" width="4.5" height="4" rx=".65"/>
              <rect class="state-cell" x="45.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="50.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="55.5" y="18.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="9" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="14" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="19" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="24" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="29" y="23" width="4.5" height="4" rx=".65"/>
              <rect class="state-cell" x="34" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="39" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="44" y="23" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="20" y="27.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="25" y="27.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="30" y="27.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="42.5" y="27.5" width="4.5" height="4" rx=".65"/> <rect class="state-cell" x="47" y="31" width="4.5" height="4" rx=".65"/>
            </svg>
          </span>
        </div>`;
      }
      if (action === "house") {
        return `<div class="icon animated-icon house-icon" data-action="house" aria-label="Rate house" role="button" tabindex="0">
          <span class="house-stage" aria-hidden="true"><span class="house-art"><i class="house-chimney"></i><i class="house-roof"></i><i class="house-body"><b class="house-window left"></b><b class="house-window right"></b><b class="house-window-box left"></b><b class="house-window-box right"></b><b class="house-door"></b></i><i class="house-dormer"></i><i class="house-hedge left"></i><i class="house-hedge right"></i></span><i class="house-mark check">✓</i><i class="house-mark cross">×</i></span>
        </div>`;
      }
      if (action === "train") {
        return `<div class="icon animated-icon train-icon" data-action="train" aria-label="Animate train" role="button" tabindex="0">
          <span class="train-glyph" aria-hidden="true">🚂</span>
          <i class="steam steam-one"></i><i class="steam steam-two"></i><i class="steam steam-three"></i>
        </div>`;
      }
      if (action === "traffic") {
        return `<div class="icon animated-icon traffic-icon" data-action="traffic" data-signal="red" aria-label="Cycle traffic light" role="button" tabindex="0">

        </div>`;
      }
      if (action === "compass") {
        return `<div class="icon animated-icon compass-icon" data-action="compass" aria-label="Spin compass" role="button" tabindex="0">

      }
      return `<div class="icon animated-icon ${escapeHTML(action)}-icon" data-action="${escapeHTML(action)}" aria-label="Animate ${escapeHTML(p.title)} icon" role="button" tabindex="0"><span class="icon-glyph" aria-hidden="true">${escapeHTML(p.icon)}</span></div>`;
    }

    function cardMarkup(p, i, sizeClass = "") {
      const inactive = !p.href || p.href === "#" || p.comingSoon;
      const classes = ["card", sizeClass, p.external ? "external" : "", inactive ? "coming" : ""]
        .filter(Boolean).join(" ");
      return `
        <a class="${classes}" style="--c:${escapeHTML(p.color)}" href="${escapeHTML(p.href || '#')}"
           data-index="${i}" ${p.external && !inactive ? 'target="_blank" rel="noopener"' : ''}>
          <div class="card-top">
            ${iconMarkup(p)}
          </div>
          <div class="copy">
            <h3>${escapeHTML(p.title)}</h3>
            <p>${escapeHTML(p.description)}</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>`;
    }

    function render() {
      const byGroup = group => projects
        .map((p, i) => ({ p, i }))
        .filter(({ p }) => p.group === group);

      featureGrid.innerHTML = byGroup("feature").map(({p, i}) => cardMarkup(p, i, "feature")).join("");
      mainGrid.innerHTML = byGroup("main").map(({p, i}) => cardMarkup(p, i)).join("");
      const thirdOrder = ["Rank Things", "Favorite Routes (coming soon)", "Challenges (coming soon)"];
      thirdGrid.innerHTML = byGroup("third")
        .sort((a, b) => thirdOrder.indexOf(a.p.title) - thirdOrder.indexOf(b.p.title))
        .map(({p, i}) => cardMarkup(p, i)).join("");
      gamesGrid.innerHTML = byGroup("games").map(({p, i}) => cardMarkup(p, i)).join("");
      aboutGrid.innerHTML = byGroup("about").map(({p, i}) => cardMarkup(p, i)).join("");

      document.querySelectorAll(".card.coming").forEach(card => {
        card.addEventListener("click", event => {
          event.preventDefault();
          showToast(`${projects[Number(card.dataset.index)].title} isn't live yet 👨‍🍳`);
        });
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    surprise.addEventListener("click", () => {
      const live = projects.map((p, i) => ({...p, i})).filter(p => p.href && p.href !== "#" && !p.comingSoon);
      if (live.length) {
        const pick = live[Math.floor(Math.random() * live.length)];
        if (pick.external) window.open(pick.href, "_blank", "noopener");
        else window.location.href = pick.href;
        return;
      }

      const cards = [...document.querySelectorAll(".card")];
      const pick = cards[Math.floor(Math.random() * cards.length)];
      pick.scrollIntoView({ behavior: "smooth", block: "center" });
      pick.animate([
        { transform: "scale(1) rotate(0deg)" },
        { transform: "scale(1.045) rotate(-1deg)" },
        { transform: "scale(1) rotate(0deg)" }
      ], { duration: 560, easing: "cubic-bezier(.2,.8,.2,1)" });
      showToast("surprise! now you have to finish that one");
    });

    let facePokes = 0;
    doodle.addEventListener("click", () => {
      facePokes += 1;
      doodle.classList.remove("bounce");
      void doodle.offsetWidth;
      doodle.classList.add("bounce");
      tone(330 + (facePokes % 4) * 55, .065, "sine", .018);

      if (facePokes % 5 === 0) {
        doodle.classList.add("party");
        const rect = doodle.getBoundingClientRect();
        const colors = ["#ff887c", "#ffd76a", "#7ed9a1", "#addcff", "#cfc4ff", "#ffc4d5"];
        for (let i = 0; i < 12; i++) {
          const spark = document.createElement("i");
          spark.className = "face-spark";
          spark.style.left = `${rect.left + rect.width / 2}px`;
          spark.style.top = `${rect.top + 16}px`;
          spark.style.background = colors[i % colors.length];
          const angle = (Math.PI * 2 * i) / 12;
          const distance = 42 + (i % 3) * 14;
          spark.style.setProperty("--sx", `${Math.cos(angle) * distance}px`);
          spark.style.setProperty("--sy", `${Math.sin(angle) * distance}px`);
          document.body.appendChild(spark);
          spark.addEventListener("animationend", () => spark.remove());
        }
        setTimeout(() => doodle.classList.remove("party"), 1800);
      }
    });

    sparkStar.addEventListener("click", () => {
      tone(740, .07, "sine", .018);
      tone(1040, .10, "sine", .014, .06);
      sparkStar.animate([
        { transform: "rotate(-10deg) scale(1)" },
        { transform: "rotate(170deg) scale(1.5)" },
        { transform: "rotate(350deg) scale(1)" }
      ], { duration: 560, easing: "cubic-bezier(.2,.8,.2,1)" });
    });

    let audioContext;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function tone(frequency, duration = .08, type = "sine", volume = .035, delay = 0) {
      const ctx = getAudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = ctx.currentTime + delay;
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + .012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + .02);
    }

    function playIconSound(action) {
      if (action === "train") {
        tone(392, .16, "triangle", .035);
        tone(523, .22, "triangle", .03, .10);
      } else if (action === "traffic") {
        tone(620, .065, "square", .018);
        tone(780, .065, "square", .016, .10);
      } else if (action === "bike") {
        tone(1080, .08, "sine", .018);
        tone(1420, .12, "sine", .012, .055);
      } else if (action === "medals") {
        tone(523, .12, "triangle", .018);
        tone(659, .12, "triangle", .016, .08);
        tone(784, .16, "triangle", .014, .16);
      } else if (action === "challenge") {
        tone(440, .05, "square", .012);
        tone(880, .09, "sine", .018, .13);
      } else if (action === "recipe") {
        tone(620, .06, "triangle", .014);
        tone(760, .08, "triangle", .011, .07);
      } else if (action === "visited") {
        tone(740, .05, "sine", .012);
        tone(980, .08, "sine", .010, .08);
      } else if (action === "compass") {
        tone(520, .09, "sine", .025);
        tone(700, .10, "sine", .018, .08);
      } else if (action === "dice") {
        tone(180, .045, "square", .014);
        tone(240, .045, "square", .012, .055);
        tone(320, .045, "square", .011, .11);
      } else if (action === "scissors") {
        tone(1150, .04, "square", .012);
        tone(850, .04, "square", .010, .08);
      } else if (action === "pirate") {
        tone(196, .10, "sawtooth", .018);
        tone(247, .12, "sawtooth", .014, .08);
      } else if (action === "pan") {
        tone(880, .055, "triangle", .018);
        tone(1040, .055, "triangle", .014, .07);
      } else {
        tone(520, .055, "sine", .018);
      }
    }

    const dieFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDie(icon, withSound = false) {
      if (!icon) return;
      const current = Number(icon.dataset.face || 1);
      let next = current;
      while (next === current) next = 1 + Math.floor(Math.random() * 6);
      icon.classList.remove("rolling");
      void icon.offsetWidth;
      icon.classList.add("rolling");
      if (withSound) playIconSound("dice");
      clearTimeout(icon.rollFaceTimer);
      clearTimeout(icon.rollClassTimer);
      icon.rollFaceTimer = setTimeout(() => {
        const face = icon.querySelector(".dice-face");
        if (face) face.textContent = dieFaces[next - 1];
        icon.dataset.face = String(next);
      }, 560);
      icon.rollClassTimer = setTimeout(() => icon.classList.remove("rolling"), 1080);
    }

    const tierSets = {
      animals: ["🐶","🐱","🦊","🐼","🐸","🐧","🐵","🐯","🐰"],
      foods: ["🍕","🍔","🍣","🌮","🍩","🍓","🍜","🥨","🧁"]
    };

    function shuffleTierThings(things) {
      const copy = [...things];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function clearTierTimer(icon) {
      if (!icon) return;
      clearTimeout(icon.tierTimer);
      icon.tierTimer = null;
    }

    function runTierSet(icon, setName) {
      if (!icon || icon.dataset.tierCycling !== "1") return;
      clearTierTimer(icon);
      const items = [...icon.querySelectorAll(".tier-item")];
      const rankedThings = shuffleTierThings(tierSets[setName]);
      const ys = [3, 20, 37];
      const rowOrder = shuffleTierThings([0,0,0,1,1,1,2,2,2]);
      const rowSlots = [0,0,0];

      items.forEach((item, index) => {
        const row = rowOrder[index];
        const slot = rowSlots[row]++;
        item.classList.remove("placed");
        item.textContent = rankedThings[index];
        item.style.setProperty("--tx", `${10 + slot * 17}px`);
        item.style.setProperty("--ty", `${ys[row]}px`);
        item.style.setProperty("--rot", `${(-5 + Math.random() * 10).toFixed(1)}deg`);
      });

      let step = 0;
      const placeNext = () => {
        if (icon.dataset.tierCycling !== "1") return;
        if (step < items.length) {
          items[step].classList.add("placed");
          step += 1;
          icon.tierTimer = setTimeout(placeNext, 500);
          return;
        }
        const nextSet = setName === "animals" ? "foods" : "animals";
        icon.dataset.nextTierSet = nextSet;
        icon.tierTimer = setTimeout(() => runTierSet(icon, nextSet), 1100);
      };

      icon.tierTimer = setTimeout(placeNext, 120);
    }

    function setRecipeDish(icon, index) {
      if (!icon) return;
      const dishes = [...icon.querySelectorAll(".recipe-dish")];
      dishes.forEach((dish, i) => dish.classList.toggle("current", i === index));
      icon.dataset.recipeIndex = String(index);
    }

    function flipRecipePage(icon, withSound = false) {
      if (!icon || icon.dataset.recipeFlipping === "1") return;
      const page = icon.querySelector(".recipe-turning-page");
      const dishes = [...icon.querySelectorAll(".recipe-dish")];
      if (!page || !dishes.length) return;
      icon.dataset.recipeFlipping = "1";
      const current = Number(icon.dataset.recipeIndex || 0);
      const next = (current + 1) % dishes.length;
      page.classList.remove("flipping");
      void page.offsetWidth;
      page.classList.add("flipping");
      if (withSound) playIconSound("recipe");
      setTimeout(() => setRecipeDish(icon, next), 285);
      setTimeout(() => {
        page.classList.remove("flipping");
        icon.dataset.recipeFlipping = "0";
      }, 800);
    }

    function startTierCycle(icon, withSound = false) {
      if (!icon) return;
      clearTierTimer(icon);
      icon.dataset.tierCycling = "1";
      const startSet = icon.dataset.nextTierSet || "animals";
      runTierSet(icon, startSet);
      if (withSound) playIconSound("medals");
    }

    function stopTierCycle(icon) {
      if (!icon) return;
      icon.dataset.tierCycling = "0";
      clearTierTimer(icon);
      icon.querySelectorAll(".tier-item").forEach(item => item.classList.remove("placed"));
    }

    function localDayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function readTrafficFine() {
      try {
        const today = localDayKey();
        const savedDay = localStorage.getItem("thomasTrafficFineDay");
        if (savedDay !== today) {
          localStorage.setItem("thomasTrafficFineDay", today);
          localStorage.removeItem("thomasTrafficFineAmount");
          return 0;
        }
        return Number(localStorage.getItem("thomasTrafficFineAmount") || 0);
      } catch {
        return Number(document.body.dataset.trafficFine || 0);
      }
    }

    function writeTrafficFine(amount) {
      try {
        localStorage.setItem("thomasTrafficFineDay", localDayKey());
        localStorage.setItem("thomasTrafficFineAmount", String(amount));
      } catch {
        document.body.dataset.trafficFine = String(amount);
      }
      updateTrafficFineDisplay(amount);
    }

    function updateTrafficFineDisplay(amount = readTrafficFine()) {
      if (!trafficFine) return;
      if (amount <= 0) {
        trafficFine.hidden = true;
        return;
      }
      trafficFine.hidden = false;
      trafficFine.innerHTML = `Traffic fines today <strong>$${amount}</strong> 🚦`;
    }

    function addTrafficFine() {
      const amount = readTrafficFine() + 100;
      writeTrafficFine(amount);
      return amount;
    }

    function wireThemedCards() {
      document.querySelectorAll(".card").forEach(card => {
        const index = Number(card.dataset.index);
        const project = projects[index];
        if (!project) return;

        if (project.action === "dice") {
          const die = card.querySelector(".dice-icon");
          let dieTimer;
          card.addEventListener("pointerenter", () => {
            rollDie(die, false);
            clearInterval(dieTimer);
            dieTimer = setInterval(() => {
              if (card.matches(":hover")) rollDie(die, false);
            }, 2850);
          });
          card.addEventListener("pointerleave", () => {
            clearInterval(dieTimer);
            dieTimer = null;
          });
        }

        if (project.action === "map") {
          const mapIcon = card.querySelector(".map-icon");
          let mapTimer;
          const randomizeStates = (burst = false) => {
            if (!mapIcon) return;
            const cells = [...mapIcon.querySelectorAll(".state-cell")];
            const count = burst ? cells.length : 4;
            const picks = burst ? cells : shuffleTierThings(cells).slice(0, count);
            picks.forEach((cell, index) => {
              if (burst || !cell.classList.contains("good") && !cell.classList.contains("bad")) {
                cell.classList.toggle("good", Math.random() >= .5);
                cell.classList.toggle("bad", !cell.classList.contains("good"));
              } else {
                cell.classList.toggle("good");
                cell.classList.toggle("bad");
              }
              cell.classList.add("just-flipped");
              setTimeout(() => cell.classList.remove("just-flipped"), 170 + index * 10);
            });
          };
          card.addEventListener("pointerenter", () => {
            randomizeStates(true);
            clearInterval(mapTimer);
            mapTimer = setInterval(() => {
              if (card.matches(":hover")) randomizeStates(false);
            }, 520);
          });
          card.addEventListener("pointerleave", () => {
            clearInterval(mapTimer);
            mapTimer = null;
          });
        }

        if (project.action === "recipe") {
          const recipeIcon = card.querySelector(".recipe-icon");
          let recipeTimer = null;
          if (recipeIcon) setRecipeDish(recipeIcon, Number(recipeIcon.dataset.recipeIndex || 0));
          card.addEventListener("pointerenter", () => {
            clearInterval(recipeTimer);
            recipeTimer = setInterval(() => {
              if (card.matches(":hover")) flipRecipePage(recipeIcon, false);
            }, 3200);
          });
          card.addEventListener("pointerleave", () => {
            clearInterval(recipeTimer);
            recipeTimer = null;
          });
        }

        if (project.action === "medals") {
          const tierIcon = card.querySelector(".medals-icon");
          card.addEventListener("pointerenter", () => startTierCycle(tierIcon, false));
          card.addEventListener("pointerleave", () => stopTierCycle(tierIcon));
        }

        if (project.action === "traffic") {
          const trafficIcon = card.querySelector(".traffic-icon");
          let signalTimer = null;
          let signalIndex = 0;
          let trafficHovering = false;
          const signals = [
            { name: "red", ms: 2200 },
            { name: "green", ms: 3000 },
            { name: "amber", ms: 1200 }
          ];
          const runSignal = () => {
            clearTimeout(signalTimer);
            if (!trafficIcon || !trafficHovering) return;
            const signal = signals[signalIndex];
            trafficIcon.dataset.signal = signal.name;
            signalTimer = setTimeout(() => {
              if (!trafficHovering) return;
              signalIndex = (signalIndex + 1) % signals.length;
              runSignal();
            }, signal.ms);
          };
          card.addEventListener("pointerenter", () => {
            trafficHovering = true;
            signalIndex = 0;
            runSignal();
          });
          card.addEventListener("pointerleave", () => {
            trafficHovering = false;
            clearTimeout(signalTimer);
            signalTimer = null;
            signalIndex = 0;
            if (trafficIcon) trafficIcon.dataset.signal = "red";
          });
          card.addEventListener("click", event => {
            if (event.defaultPrevented || event.target.closest(".animated-icon")) return;
            if (!trafficIcon || trafficIcon.dataset.signal !== "red") return;
            event.preventDefault();
            addTrafficFine();
            showToast("Red means stop. That will be $100. 🚦");
            tone(165, .16, "square", .018);
            const href = card.getAttribute("href");
            setTimeout(() => { window.location.href = href; }, 1050);
          });
        }

        if (project.action === "pirate") {
          let raidTimer = null;
          let raidCleanup = null;
          let raider = card.querySelector(".pirate-raider");
          if (!raider) {
            raider = document.createElement("span");
            raider.className = "pirate-raider";
            raider.setAttribute("aria-hidden", "true");
            raider.innerHTML = `<b class="pirate-ship-emoji">⛵</b><i class="loot-arrow">→</i>`;
            card.appendChild(raider);
          }
          card.addEventListener("pointerenter", () => {
            clearTimeout(raidTimer);
            clearTimeout(raidCleanup);
            card.classList.remove("pirate-raid");
            raidTimer = setTimeout(() => {
              if (!card.matches(":hover")) return;
              card.classList.remove("pirate-raid");
              void card.offsetWidth;
              card.classList.add("pirate-raid");
              playIconSound("pirate");
              raidCleanup = setTimeout(() => card.classList.remove("pirate-raid"), 1900);
            }, 5000);
          });
          card.addEventListener("pointerleave", () => {
            clearTimeout(raidTimer);
            clearTimeout(raidCleanup);
            raidTimer = null;
            raidCleanup = null;
            card.classList.remove("pirate-raid");
          });
        }
      });
    }

    function activateIcon(icon) {
      const action = icon.dataset.action || "plain";
      if (action === "dice") {
        rollDie(icon, true);
        return;
      }
      if (action === "medals") {
        startTierCycle(icon, true);
        return;
      }
      if (action === "recipe") {
        flipRecipePage(icon, true);
        return;
      }
      icon.classList.remove("active");
      void icon.offsetWidth;
      icon.classList.add("active");
      playIconSound(action);
      setTimeout(() => icon.classList.remove("active"), 1800);
    }

    document.addEventListener("click", event => {
      const icon = event.target.closest(".animated-icon");
      if (!icon) return;
      event.preventDefault();
      event.stopPropagation();
      activateIcon(icon);
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const icon = event.target.closest(".animated-icon");
      if (!icon) return;
      event.preventDefault();
      activateIcon(icon);
    });

    document.addEventListener("pointermove", event => {
      const rect = doodle.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = event.clientX - centerX;
      const dy = event.clientY - centerY;
      const distance = Math.hypot(dx, dy) || 1;
      const maxShift = 4;
      const strength = Math.min(1, distance / 140);
      const x = (dx / distance) * maxShift * strength;
      const y = (dy / distance) * maxShift * strength;
      doodle.style.setProperty("--eye-x", `${x.toFixed(2)}px`);
      doodle.style.setProperty("--eye-y", `${y.toFixed(2)}px`);
    });

    document.addEventListener("pointerleave", () => {
      doodle.style.setProperty("--eye-x", "0px");
      doodle.style.setProperty("--eye-y", "0px");
    });



    projectCount.textContent = `${projects.length} incomplete projects & counting`;

    updateTrafficFineDisplay();
    setInterval(() => updateTrafficFineDisplay(), 60000);
    render();
    wireThemedCards();
  </script>
</body>
</html>
