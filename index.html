<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive projects, games, maps, rankings, and other things Thomas made.">
  <meta name="theme-color" content="#fff8ed">
  <title>Thomas Made This</title>
  <!-- v27 -->
  <style>
    :root {
      --bg: #fff8ed;
      --ink: #171717;
      --muted: #68645f;
      --paper: #fffdf8;
      --line: #171717;
      --shadow: 5px 5px 0 var(--line);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 2%, #ffe08a 0 0, transparent 22rem),
        radial-gradient(circle at 96% 30%, #b8e0ff 0 0, transparent 24rem),
        var(--bg);
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(1180px, calc(100% - 34px));
      margin: 0 auto;
    }

    .hero {
      min-height: 330px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 34px;
      align-items: center;
      padding: 42px 0 16px;
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .hero-copy { max-width: 850px; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 9.4vw, 116px);
      line-height: .87;
      letter-spacing: -.065em;
      font-weight: 900;
      text-wrap: balance;
    }

    .underline {
      position: relative;
      display: inline-block;
      z-index: 0;
    }

    .underline::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 2%;
      right: -1%;
      bottom: -.02em;
      height: .14em;
      border-radius: 999px;
      background: #7ed9a1;
      transform: rotate(-1.3deg);
    }

    .intro {
      max-width: 700px;
      margin: 24px 0 0;
      color: #4a4742;
      font-size: clamp(20px, 2vw, 24px);
      line-height: 1.35;
      font-weight: 800;
    }

    .project-count {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .traffic-fine {
      width: fit-content;
      margin: 10px 0 0;
      padding: 6px 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #ffd76a;
      box-shadow: 2px 2px 0 var(--line);
      font-size: 12px;
      line-height: 1;
      font-weight: 850;
    }
    .traffic-fine[hidden] { display: none; }
    .traffic-fine strong { font-weight: 950; }

    .button {
      min-height: 49px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--line);
      text-decoration: none;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .button.primary { background: var(--ink); color: white; box-shadow: 4px 4px 0 #ff9f91; }

    .hero-side .button {
      width: 150px;
      min-height: 46px;
      padding-inline: 14px;
      font-size: 14px;
    }
    .button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--line); }
    .button.primary:hover { box-shadow: 6px 6px 0 #ff9f91; }
    .button:active { transform: translate(1px, 1px); }

    .hero-doodle {
      width: 160px;
      height: 160px;
      position: relative;
      border: 3px solid var(--line);
      border-radius: 34px;
      background: #ff887c;
      box-shadow: 8px 8px 0 var(--line);
      transform: rotate(6deg);
      cursor: pointer;
      translate: var(--mascot-x, 0px) var(--mascot-y, 0px);
      transition: transform .2s ease, translate .12s ease-out;
    }

    .hero-doodle:hover { transform: rotate(-3deg) scale(1.04); }
    .hero-doodle.avoiding { transition: transform .16s ease, translate .1s ease-out; }
    .hero-doodle.bounce { animation: bounce .62s cubic-bezier(.2,.85,.2,1); }

    .hero-doodle .eye {
      position: absolute;
      width: 18px;
      height: 24px;
      top: 52px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: white;
    }
    .hero-doodle .eye::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 8px;
      top: 7px;
      left: 5px;
      border-radius: 50%;
      background: var(--ink);
      transform: translate(var(--eye-x, 0px), var(--eye-y, 0px));
      transition: transform .08s linear;
    }
    .hero-doodle .eye.one { left: 45px; }
    .hero-doodle .eye.two { right: 45px; }
    .hero-doodle .mouth {
      position: absolute;
      width: 55px;
      height: 25px;
      left: 50%;
      bottom: 37px;
      border: 3px solid var(--line);
      border-top: 0;
      border-radius: 0 0 50px 50px;
      transform: translateX(-50%);
    }

    @keyframes bounce {
      0% { transform: rotate(6deg) translateY(0); }
      35% { transform: rotate(-10deg) translateY(-28px) scale(1.08); }
      72% { transform: rotate(11deg) translateY(3px) scale(.97); }
      100% { transform: rotate(6deg) translateY(0); }
    }

    .projects {
      position: relative;
      padding: 0;
    }

    .projects::before {
      content: "✦";
      position: absolute;
      left: -20px;
      top: 18px;
      font-size: 24px;
      transform: rotate(-14deg);
      opacity: .65;
      pointer-events: none;
    }

    .visual-doodles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .visual-doodle {
      position: absolute;
      display: grid;
      place-items: center;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform .18s ease;
    }

    .visual-doodle:hover { transform: rotate(12deg) scale(1.16); }

    .spark-star {
      width: 34px;
      height: 34px;
      left: -9px;
      top: 47%;
      font-size: 28px;
      line-height: 1;
      color: #e5a900;
      transform: rotate(-10deg);
    }

    .about {
      padding: 0 0 64px;
    }

    .about-head {
      margin: 20px 0 11px;
    }

    .about-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .row-label {
      margin: 20px 0 11px;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .grid + .grid { margin-top: 18px; }

    .card {
      --c: #d9eaff;
      --r: 0deg;
      grid-column: span 4;
      height: 286px;
      min-height: 286px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 24px;
      border: 3px solid var(--line);
      border-radius: var(--radius);
      background: var(--c);
      color: var(--ink);
      box-shadow: var(--shadow);
      text-decoration: none;
      transform: rotate(var(--r));
      transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease;
      isolation: isolate;
    }

    .card.feature {
      grid-column: span 6;
      height: 286px;
      min-height: 286px;
      --r: 0deg;
    }


    .card:nth-child(4n + 1) { --r: -.25deg; }
    .card:nth-child(4n + 3) { --r: .25deg; }
    .card.feature { --r: 0deg; }
    .card:hover {
      z-index: 4;
      transform: translate(-4px, -5px) rotate(0deg);
      box-shadow: 9px 10px 0 var(--line);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 3px solid rgba(23,23,23,.82);
      opacity: .14;
      pointer-events: none;
    }

    .card::before {
      width: 160px;
      height: 160px;
      right: -65px;
      top: -68px;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .card::after {
      width: 75px;
      height: 75px;
      right: 45px;
      bottom: -43px;
      transform: rotate(24deg);
      background: rgba(255,255,255,.5);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .icon {
      width: 67px;
      height: 67px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.76);
      box-shadow: 3px 3px 0 rgba(23,23,23,.18);
      font-size: 32px;
      transform: rotate(-3deg);
      transition: transform .2s ease;
    }

    .card:hover .icon { transform: rotate(5deg) scale(1.05); }

    .animated-icon {
      position: relative;
      cursor: pointer;
      overflow: visible;
    }

    .animated-icon:focus-visible {
      outline: 3px solid var(--line);
      outline-offset: 4px;
    }

    .icon-glyph {
      display: inline-block;
      transform-origin: center;
    }

    .train-icon .train-glyph {
      display: inline-block;
    }

    .card:hover .train-icon .train-glyph {
      animation: trainRock 2.0s ease-in-out infinite alternate;
    }

    .steam {
      position: absolute;
      width: 10px;
      height: 10px;
      left: 15px;
      top: 8px;
      border: 2px solid rgba(23,23,23,.5);
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      opacity: 0;
      pointer-events: none;
    }

    .card:hover .train-icon .steam { animation: steamPuff 3.0s ease-out infinite; }
    .card:hover .train-icon .steam-two { animation-delay: 1.0s; }
    .card:hover .train-icon .steam-three { animation-delay: 2.0s; }

    @keyframes trainRock {
      from { transform: translateY(1px) rotate(-2deg); }
      to { transform: translateY(-1px) rotate(2deg); }
    }

    @keyframes steamPuff {
      0%, 20% { opacity: 0; transform: translate(0, 8px) scale(.45); }
      35% { opacity: .9; }
      100% { opacity: 0; transform: translate(-13px, -22px) scale(1.45); }
    }

    .card:hover .train-icon.active .train-glyph { animation: trainDash 1.05s ease; }
    .card:hover .train-icon.active .steam { animation: steamPuff 1.15s ease-out 1; }

    @keyframes trainDash {
      0% { transform: translateX(0) rotate(0); }
      45% { transform: translateX(10px) rotate(3deg); }
      100% { transform: translateX(0) rotate(0); }
    }

    .train-icon.active .train-glyph { animation: trainDash .68s ease 1; }
    .steam.extra-steam {
      opacity: 0;
      animation: extraSteam var(--dur, .8s) ease-out forwards !important;
    }
    @keyframes extraSteam {
      0% { opacity: 0; transform: translate(0, 6px) scale(.35); }
      18% { opacity: .95; }
      100% { opacity: 0; transform: translate(var(--sx, -12px), var(--sy, -30px)) scale(1.65); }
    }

    .traffic-case {
      width: 29px;
      height: 51px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 4px 0;
      border: 3px solid var(--line);
      border-radius: 9px;
      background: #2b2b2b;
      box-shadow: 2px 2px 0 rgba(23,23,23,.18);
    }

    .traffic-case::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 11px;
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
      background: var(--line);
      border-radius: 0 0 4px 4px;
    }

    .light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      transition: background .12s linear, box-shadow .12s linear;
    }

    .traffic-icon[data-signal="red"] .red {
      background: #ff5d57;
      box-shadow: 0 0 9px #ff5d57;
    }
    .traffic-icon[data-signal="amber"] .amber {
      background: #ffd166;
      box-shadow: 0 0 9px #ffd166;
    }
    .traffic-icon[data-signal="green"] .green {
      background: #65d17a;
      box-shadow: 0 0 9px #65d17a;
    }

    .card:hover .traffic-icon.active .traffic-case { animation: trafficBounce 1.2s ease; }
    @keyframes trafficBounce { 50% { transform: translateY(-7px) rotate(4deg); } }

    .compass-face {
      width: 48px;
      height: 48px;
      position: relative;
      display: grid;
      place-items: center;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: #fffdf8;
    }

    .compass-face b {
      position: absolute;
      top: 2px;
      font-size: 9px;
      line-height: 1;
    }

    .compass-needle {
      width: 4px;
      height: 30px;
      position: absolute;
      border-radius: 999px;
      background: linear-gradient(to bottom, #ff6961 0 50%, var(--line) 50% 100%);
      transform-origin: center;

    }

    .compass-needle::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 50%;
      top: 50%;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: white;
      transform: translate(-50%,-50%);
    }

    @keyframes compassWander {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(82deg); }
      50% { transform: rotate(197deg); }
      75% { transform: rotate(305deg); }
    }

    .card:hover .compass-icon .compass-needle { animation: compassWander 12s ease-in-out infinite; }
    .card:hover .compass-icon.active .compass-needle, .compass-icon.active .compass-needle { animation: compassSpin 1.5s cubic-bezier(.2,.8,.2,1); }
    @keyframes compassSpin { to { transform: rotate(720deg); } }

    .dice-face {
      display: inline-block;
      font-size: 38px;
      line-height: 1;
      transform-origin: center;
    }
    .dice-icon.rolling .dice-face,
    .card:hover .dice-icon.active .dice-face {
      animation: diceRoll 1.05s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      35% { transform: rotate(145deg) scale(1.24); }
      70% { transform: rotate(285deg) scale(.92); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .bike-icon { overflow: hidden; }
    .bike-pack {
      position: relative;
      display: inline-flex;
      align-items: center;
      transform: translateX(0);
    }
    .bike-rider {
      display: inline-block;
      font-size: 34px;
      line-height: 1;
      transform: scaleX(-1);
      transform-origin: center;
    }
    .bike-dust {
      position: absolute;
      left: -15px;
      top: 19px;
      font-size: 17px;
      line-height: 1;
      opacity: 0;
      transform: scaleX(-1);
    }
    .card:hover .bike-icon .bike-pack { animation: bikeRide 5.8s ease-in-out infinite; }
    .card:hover .bike-icon .bike-dust { animation: bikeDust 5.8s linear infinite; }
    .card:hover .bike-icon.active .bike-pack { animation: bikeRide 2.5s ease-in-out 1; }
    .card:hover .bike-icon.active .bike-dust { animation: bikeDust 2.5s linear 1; }
    @keyframes bikeRide {
      0%, 20% { transform: translateX(0); }
      46% { transform: translateX(64px); }
      46.1% { transform: translateX(-64px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes bikeDust {
      0%, 19%, 73%, 100% { opacity: 0; transform: translateX(0) scaleX(-1) scale(.75); }
      24%, 42%, 51%, 67% { opacity: .82; transform: translateX(-4px) scaleX(-1) scale(1); }
      46%, 46.1% { opacity: 0; }
    }
    .bike-icon.active .bike-pack { animation: bikeRide 2.5s ease-in-out 1; }
    .bike-icon.active .bike-dust { animation: bikeDust 2.5s linear 1; }
    .bike-icon.boost .bike-pack { animation: bikeRide 1.15s ease-in-out 1; }
    .bike-icon.boost .bike-dust { animation: bikeDust 1.15s linear 1; }
    .card:hover .bike-icon.boost .bike-pack { animation: bikeRide 1.15s ease-in-out 1; }
    .card:hover .bike-icon.boost .bike-dust { animation: bikeDust 1.15s linear 1; }


    .map-stage {
      width: 58px;
      height: 48px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .us-score-map {
      width: 59px;
      height: 40px;
      overflow: visible;
      filter: drop-shadow(.7px .7px 0 rgba(23,23,23,.12));
    }
    .state-cell {
      fill: #e8e3d8;
      stroke: rgba(23,23,23,.22);
      stroke-width: .38;
      vector-effect: non-scaling-stroke;
      transition: fill .28s ease, transform .22s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .us-backdrop {
      fill: #f5f1e7;
      stroke: rgba(23,23,23,.34);
      stroke-width: .72;
      vector-effect: non-scaling-stroke;
    }
    .us-outline {
      fill: none;
      stroke: rgba(23,23,23,.42);
      stroke-width: .72;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .map-water {
      fill: #d8efff;
      stroke: rgba(23,23,23,.18);
      stroke-width: .32;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .state-cell.good { fill: #73d596; }
    .state-cell.mid { fill: #ffd166; }
    .state-cell.bad { fill: #ff8e86; }
    .state-cell.just-flipped { transform: scale(.84); }
    .map-icon.active .us-score-map { animation: mapScorePop .55s ease; }
    @keyframes mapScorePop {
      45% { transform: scale(1.08) rotate(-2deg); }
    }

    .house-icon {
      background: rgba(255,255,255,.76);
      overflow: hidden;
    }
    .house-icon.manual .house-body,
    .house-icon.manual .house-roof,
    .house-icon.manual .house-door,
    .house-icon.manual .house-mark,
    .house-icon.manual .house-chimney,
    .house-icon.manual .house-hedge,
    .house-icon.manual .house-window-box,
    .house-icon.manual .house-dormer,
    .house-icon.manual .house-dormer::before { animation: none !important; }
    .house-icon.house-pop .house-stage { animation: housePop .42s cubic-bezier(.2,.9,.2,1); }
    @keyframes housePop { 45% { transform: scale(1.1) rotate(-3deg); } }

    .house-stage {
      width: 58px;
      height: 54px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .house-art {
      width: 50px;
      height: 45px;
      position: relative;
      margin-top: 2px;
    }
    .house-chimney {
      width: 8px;
      height: 16px;
      position: absolute;
      right: 5px;
      top: 0;
      border: 2px solid var(--line);
      border-radius: 2px 2px 0 0;
      background: #8b6651;
      z-index: 0;
      opacity: 0;
    }
    .house-roof {
      width: 31px;
      height: 31px;
      position: absolute;
      left: 9px;
      top: 1px;
      border: 3px solid var(--line);
      border-radius: 4px;
      background: #d8785a;
      transform: rotate(45deg);
      z-index: 1;
    }
    .house-body {
      width: 40px;
      height: 28px;
      position: absolute;
      left: 5px;
      bottom: 1px;
      z-index: 2;
      border: 3px solid var(--line);
      border-radius: 3px;
      background: #f5d37b;
      overflow: hidden;
    }
    .house-door {
      width: 9px;
      height: 16px;
      position: absolute;
      left: 14px;
      bottom: -2px;
      border: 2px solid var(--line);
      border-radius: 2px 2px 0 0;
      background: #39556f;
    }
    .house-door::before {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 3px;
      height: 5px;
      border: 1px solid rgba(23,23,23,.42);
      border-radius: 1px;
    }
    .house-door::after {
      content: "";
      width: 2px;
      height: 2px;
      position: absolute;
      right: 1px;
      top: 8px;
      border-radius: 50%;
      background: #ffd76a;
      box-shadow: 0 0 0 .5px var(--line);
    }
    .house-window {
      width: 7px;
      height: 7px;
      position: absolute;
      top: 6px;
      border: 2px solid var(--line);
      background: #b8e0ff;
    }
    .house-window.left { left: 3px; }
    .house-window.right { right: 3px; }
    .house-window-box {
      width: 10px;
      height: 4px;
      position: absolute;
      top: 14px;
      z-index: 4;
      border: 1.5px solid var(--line);

    let audioContext;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function tone(frequency, duration = .08, type = "sine", volume = .035, delay = 0) {
      const ctx = getAudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = ctx.currentTime + delay;
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + .012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + .02);
    }

    function playIconSound(action) {

      } else if (action === "visited") {

      } else if (action === "compass") {

      } else if (action === "dice") {

      } else if (action === "pan") {

    const dieFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDie(icon, withSound = false) {
      if (!icon) return;
      const current = Number(icon.dataset.face || 1);
      let next = current;
      while (next === current) next = 1 + Math.floor(Math.random() * 6);
      icon.classList.remove("rolling");
      void icon.offsetWidth;
      icon.classList.add("rolling");
      if (withSound) playIconSound("dice");
      clearTimeout(icon.rollFaceTimer);
      clearTimeout(icon.rollClassTimer);
      icon.rollFaceTimer = setTimeout(() => {
        const face = icon.querySelector(".dice-face");
        if (face) face.textContent = dieFaces[next - 1];
        icon.dataset.face = String(next);
      }, 560);
      icon.rollClassTimer = setTimeout(() => icon.classList.remove("rolling"), 1080);
    }

    const tierSets = {
      animals: ["🐶","🐱","🦊","🐼","🐸","🐧","🐵","🐯","🐰"],
      foods: ["🍕","🍔","🍣","🌮","🍩","🍓","🍜","🥨","🧁"],
      places: ["🏖️","🏔️","🏙️","🏕️","🏰","🏝️","🌋","🏟️","🎡"],
      rides: ["🚗","🚲","🚂","✈️","🚀","⛵","🚌","🚁","🛵"]
    };
    const tierSetOrder = ["animals", "foods", "places", "rides"];
    const tierXs = [14, 28, 42];
    const tierYs = [4, 21, 38];

    function shuffleTierThings(things) {
      const copy = [...things];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function clearTierTimer(icon) {
      if (!icon) return;
      clearTimeout(icon.tierTimer);
      icon.tierTimer = null;
    }

    function scheduleNextTierPlacement(icon, callback, baseDelay = 1450) {
      if (!icon || typeof callback !== "function") return;
      clearTierTimer(icon);
      icon.nextTierPlacementAt = performance.now() + baseDelay;
      icon.tierTimer = setTimeout(callback, baseDelay);
    }

    function extendTierPlacementGrace(icon, extraMs = 500) {
      if (!icon || typeof icon.resumeTierPlacement !== "function" || icon.dataset.tierCycling !== "1") return;
      const now = performance.now();
      const currentDeadline = Number(icon.nextTierPlacementAt || now);
      icon.nextTierPlacementAt = Math.max(currentDeadline, now) + extraMs;
      clearTierTimer(icon);
      icon.tierTimer = setTimeout(icon.resumeTierPlacement, Math.max(0, icon.nextTierPlacementAt - performance.now()));
    }

    function setTierItemPosition(item, row, slot, reranked = false) {
      item.dataset.row = String(row);
      item.dataset.slot = String(slot);
      item.style.setProperty("--tx", `${tierXs[slot]}px`);
      item.style.setProperty("--ty", `${tierYs[row]}px`);
      item.style.setProperty("--rot", `${(-4 + Math.random() * 8).toFixed(1)}deg`);
      if (reranked) {
        item.classList.remove("reranked");
        void item.offsetWidth;
        item.classList.add("reranked");
        setTimeout(() => item.classList.remove("reranked"), 390);
      }
    }

    function placedTierItems(icon) {
      return [...icon.querySelectorAll(".tier-item.placed")];
    }

    function tierRowItems(icon, row, except = null) {
      return placedTierItems(icon).filter(item => item !== except && Number(item.dataset.row) === row);
    }

    function repackTierRow(icon, row) {
      if (!icon) return;
      // Keep every occupied tier compact: left slot first, then middle, then right.
      // Preserve the items' existing left-to-right order when closing a gap.
      const rowItems = tierRowItems(icon, row)
        .sort((a, b) => Number(a.dataset.slot) - Number(b.dataset.slot));
      rowItems.forEach((rowItem, slot) => {
        if (Number(rowItem.dataset.slot) !== slot) {
          setTierItemPosition(rowItem, row, slot, false);
        }
      });
    }

    function placeTierItemInOpenSlot(icon, item, preferredRow = null, reranked = false) {
      if (!icon || !item) return false;
      const currentRow = Number(item.dataset.row);
      let choices = [0,1,2].filter(row => tierRowItems(icon, row, item).length < 3);
      if (preferredRow !== null) choices = choices.filter(row => row === preferredRow);
      if (reranked) choices = choices.filter(row => row !== currentRow);
      if (!choices.length) return false;

      const row = choices[Math.floor(Math.random() * choices.length)];

      // First close any old gaps, then append the new/reranked emoji immediately
      // after the current items. This guarantees the leftmost possible position.
      repackTierRow(icon, row);
      const slot = tierRowItems(icon, row, item).length;
      if (slot >= 3) return false;
      setTierItemPosition(item, row, slot, reranked);

      // Moving an existing emoji can leave a hole behind, so close that too.
      if (reranked && Number.isFinite(currentRow) && currentRow >= 0 && currentRow <= 2 && currentRow !== row) {
        repackTierRow(icon, currentRow);
      }
      return true;
    }

    function runTierSet(icon, setName) {
      if (!icon || icon.dataset.tierCycling !== "1") return;
      clearTierTimer(icon);
      const items = [...icon.querySelectorAll(".tier-item")];
      const rankedThings = shuffleTierThings(tierSets[setName]);
      const placementOrder = shuffleTierThings([...Array(items.length).keys()]);

      items.forEach((item, index) => {
        item.classList.remove("placed", "reranked");
        item.textContent = rankedThings[index];
        item.dataset.row = "";
        item.dataset.slot = "";
      });
      icon.dataset.lastRated = "";
      icon.lastRatedItem = null;

      let step = 0;
      const placeNext = () => {
        if (icon.dataset.tierCycling !== "1") return;
        if (step < placementOrder.length) {
          const itemIndex = placementOrder[step];
          const item = items[itemIndex];
          // Choose the tier only when the item is actually rated, so user reranks
          // cannot collide with slots reserved for future items.
          if (!placeTierItemInOpenSlot(icon, item)) return;
          item.classList.add("placed");
          icon.dataset.lastRated = String(itemIndex);
          icon.lastRatedItem = item;
          step += 1;
          // Leave a real reaction window after each rating so the user can move it.
          // Repeated rerank clicks extend this deadline by another 0.5s each.
          scheduleNextTierPlacement(icon, placeNext, 1450);
          return;
        }
        const currentSetIndex = tierSetOrder.indexOf(setName);
        const nextSet = tierSetOrder[(currentSetIndex + 1) % tierSetOrder.length];
        icon.dataset.nextTierSet = nextSet;
        icon.lastRatedItem = null;
        icon.nextTierPlacementAt = 0;
        icon.tierTimer = setTimeout(() => runTierSet(icon, nextSet), 1100);
      };

      icon.resumeTierPlacement = placeNext;
      scheduleNextTierPlacement(icon, placeNext, 120);
    }

    function rerankLastTierItem(icon) {
      if (!icon) return false;
      // Keep a direct reference to the exact emoji that most recently appeared.
      // This avoids accidentally acting on another item as the animation advances.
      let item = icon.lastRatedItem;
      if (!item || !item.isConnected || !item.classList.contains("placed")) {
        const index = Number(icon.dataset.lastRated);
        const items = [...icon.querySelectorAll(".tier-item")];
        item = items[index];
      }
      if (!item || !item.classList.contains("placed")) return false;

      const sourceRow = Number(item.dataset.row);
      const choices = [0,1,2].filter(row => row !== sourceRow && tierRowItems(icon, row, item).length < 3);
      if (!choices.length) return false;
      const row = choices[Math.floor(Math.random() * choices.length)];
      if (!placeTierItemInOpenSlot(icon, item, row, true)) return false;

      // Every click grants another half-second to move THIS SAME emoji again.
      // Crucially this extends the existing deadline instead of shortening it to 0.5s.
      icon.lastRatedItem = item;
      extendTierPlacementGrace(icon, 500);
      return true;
    }

    function setRecipeDish(icon, index) {
      if (!icon) return;
      const dishes = [...icon.querySelectorAll(".recipe-dish")];
      dishes.forEach((dish, i) => dish.classList.toggle("current", i === index));
      icon.dataset.recipeIndex = String(index);
    }

    function flipRecipePage(icon, withSound = false) {
      if (!icon || icon.dataset.recipeFlipping === "1") return;
      const page = icon.querySelector(".recipe-turning-page");
      const dishes = [...icon.querySelectorAll(".recipe-dish")];
      if (!page || !dishes.length) return;
      icon.dataset.recipeFlipping = "1";
      const current = Number(icon.dataset.recipeIndex || 0);
      const next = (current + 1) % dishes.length;
      page.classList.remove("flipping");
      void page.offsetWidth;
      page.classList.add("flipping");
      if (withSound) playIconSound("recipe");
      setTimeout(() => setRecipeDish(icon, next), 28);
      setTimeout(() => {
        page.classList.remove("flipping");
        icon.dataset.recipeFlipping = "0";
      }, 570);
    }

    function startTierCycle(icon, withSound = false) {
      if (!icon) return;
      clearTierTimer(icon);
      icon.dataset.tierCycling = "1";
      const startSet = icon.dataset.nextTierSet || "animals";
      runTierSet(icon, startSet);
      if (withSound) playIconSound("medals");
    }

    function stopTierCycle(icon) {
      if (!icon) return;
      icon.dataset.tierCycling = "0";
      clearTierTimer(icon);
      icon.nextTierPlacementAt = 0;
      icon.querySelectorAll(".tier-item").forEach(item => item.classList.remove("placed", "reranked"));
    }

    function localDayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function readTrafficFine() {
      try {
        const today = localDayKey();
        const savedDay = localStorage.getItem("thomasTrafficFineDay");
        if (savedDay !== today) {
          localStorage.setItem("thomasTrafficFineDay", today);
          localStorage.removeItem("thomasTrafficFineAmount");
          return 0;
        }
        return Number(localStorage.getItem("thomasTrafficFineAmount") || 0);
      } catch {
        return Number(document.body.dataset.trafficFine || 0);
      }
    }

    function writeTrafficFine(amount) {
      try {
        localStorage.setItem("thomasTrafficFineDay", localDayKey());
        localStorage.setItem("thomasTrafficFineAmount", String(amount));
      } catch {
        document.body.dataset.trafficFine = String(amount);
      }
      updateTrafficFineDisplay(amount);
    }

    function updateTrafficFineDisplay(amount = readTrafficFine()) {
      if (!trafficFine) return;
      if (amount <= 0) {
        trafficFine.hidden = true;
        return;
      }
      trafficFine.hidden = false;
      trafficFine.innerHTML = `Money lost today <strong>$${amount}</strong> 💸`;
    }

    function addMoneyLost(dollars) {
      const amount = readTrafficFine() + dollars;
      writeTrafficFine(amount);
      return amount;
    }

    function addTrafficFine() {
      return addMoneyLost(100);
    }

    let recentIconPresses = [];
    let iconSpamCooldownUntil = 0;
    function registerIconPress() {
      const now = performance.now();
      recentIconPresses = recentIconPresses.filter(time => now - time <= 5000);
      recentIconPresses.push(now);
      if (recentIconPresses.length < 10 || now < iconSpamCooldownUntil) return false;

      recentIconPresses = [];
      iconSpamCooldownUntil = now + 5000;
      addMoneyLost(25);
      showToast("Icon spam fine — $25. 🚨");
      tone(190, .14, "square", .015);
      return true;
    }

    function randomizeHouse(icon, withSound = true) {
      if (!icon) return;
      const variants = [
        { body:"#a9dfb7", roof:"#d8785a", door:"#315b78", check:1, cross:0, chimney:1, lh:1, rh:0, lb:1, rb:0, dormer:0 },
        { body:"#ffb9b0", roof:"#6f7279", door:"#8c3546", check:0, cross:1, chimney:0, lh:0, rh:0, lb:0, rb:1, dormer:1 },
        { body:"#a9d6ff", roof:"#48576b", door:"#f1c75b", check:1, cross:0, chimney:1, lh:0, rh:1, lb:1, rb:1, dormer:1 },
        { body:"#f5d37b", roof:"#9a694d", door:"#3f8c82", check:0, cross:1, chimney:0, lh:1, rh:1, lb:0, rb:0, dormer:0 }
      ];
      const current = Number(icon.dataset.houseVariant || -1);
      let next = current;
      while (next === current) next = Math.floor(Math.random() * variants.length);
      const v = variants[next];
      const q = sel => icon.querySelector(sel);
      q(".house-body").style.background = v.body;
      q(".house-roof").style.background = v.roof;
      q(".house-door").style.background = v.door;
      q(".house-mark.check").style.opacity = v.check;
      q(".house-mark.cross").style.opacity = v.cross;
      q(".house-chimney").style.opacity = v.chimney;
      q(".house-hedge.left").style.opacity = v.lh;
      q(".house-hedge.right").style.opacity = v.rh;
      q(".house-window-box.left").style.opacity = v.lb;
      q(".house-window-box.right").style.opacity = v.rb;
      q(".house-dormer").style.opacity = v.dormer;
      icon.dataset.houseVariant = String(next);
      icon.classList.add("manual");
      icon.classList.remove("house-pop");
      void icon.offsetWidth;
      icon.classList.add("house-pop");
      clearTimeout(icon.houseManualTimer);
      icon.houseManualTimer = setTimeout(() => icon.classList.remove("manual", "house-pop"), 1200);
      if (withSound) playIconSound("pan");
    }

    function failCurrentChallenge(icon) {
      if (!icon || icon.classList.contains("failing")) return;
      const stage = icon.querySelector(".challenge-stage");
      const scenes = [...icon.querySelectorAll(".challenge-scene:not(.challenge-fail-copy)")];
      if (!stage || !scenes.length) return;

      // Fail whichever scene is actually on screen at the instant of the click.
      let currentIndex = 0;
      let bestOpacity = -1;
      scenes.forEach((scene, index) => {
        const opacity = Number.parseFloat(getComputedStyle(scene).opacity) || 0;
        if (opacity > bestOpacity) {
          bestOpacity = opacity;
          currentIndex = index;
        }
      });

      const copy = scenes[currentIndex].cloneNode(true);
      copy.className = `challenge-scene challenge-fail-copy fail-${["one","two","three"][currentIndex]}`;
      stage.appendChild(copy);
      icon.classList.add("failing");
      void copy.offsetWidth;
      copy.classList.add("run");
      playIconSound("challenge");

      clearTimeout(icon.challengeFailTimer);
      icon.challengeFailTimer = setTimeout(() => {
        copy.remove();
        icon.classList.remove("failing");
      }, 900);
    }

    function boostTrain(icon) {
      if (!icon) return;
      icon.classList.remove("active");
      void icon.offsetWidth;
      icon.classList.add("active");
      clearTimeout(icon.trainActiveTimer);
      icon.trainActiveTimer = setTimeout(() => icon.classList.remove("active"), 720);
      for (let i = 0; i < 7; i += 1) {
        const puff = document.createElement("i");
        puff.className = "steam extra-steam";
        puff.style.left = `${12 + Math.random() * 8}px`;
        puff.style.top = `${5 + Math.random() * 7}px`;
        puff.style.setProperty("--sx", `${-8 - Math.random() * 20}px`);
        puff.style.setProperty("--sy", `${-22 - Math.random() * 24}px`);
        puff.style.setProperty("--dur", `${(.55 + Math.random() * .45).toFixed(2)}s`);
        puff.style.animationDelay = `${(i * .045).toFixed(2)}s`;
        icon.appendChild(puff);
        setTimeout(() => puff.remove(), 1250);
      }
      playIconSound("trainWhistle");
    }

    function woofDog(icon) {
      if (!icon) return;
      icon.classList.remove("woof");
      void icon.offsetWidth;
      icon.classList.add("woof");
      clearTimeout(icon.woofTimer);
      icon.woofTimer = setTimeout(() => icon.classList.remove("woof"), 500);
      playIconSound("dog");
    }

    function runBikeClick(icon) {
      if (!icon) return;
      const alreadyMoving = icon.classList.contains("active") || icon.classList.contains("boost");
      icon.classList.remove("active", "boost");
      void icon.offsetWidth;
      icon.classList.add(alreadyMoving ? "boost" : "active");
      clearTimeout(icon.bikeClickTimer);
      icon.bikeClickTimer = setTimeout(() => icon.classList.remove("active", "boost"), alreadyMoving ? 1200 : 2550);
      playIconSound("bike");
    }

    function wireThemedCards() {
      document.querySelectorAll(".card").forEach(card => {
        const index = Number(card.dataset.index);
        const project = projects[index];
        if (!project) return;

        if (project.action === "dice") {
          const die = card.querySelector(".dice-icon");
          let dieTimer;
          card.addEventListener("pointerenter", () => {
            if (!hoverCapable) return;
            rollDie(die, false);
            clearInterval(dieTimer);
            dieTimer = setInterval(() => {
              if (card.matches(":hover")) rollDie(die, false);
            }, 2850);
          });
          card.addEventListener("pointerleave", () => {
            clearInterval(dieTimer);
            dieTimer = null;
          });
        }

        if (project.action === "map") {
          const mapIcon = card.querySelector(".map-icon");
          let mapTimer;
          const statuses = ["good", "mid", "bad"];
          const setStatus = (cell, status) => {
            statuses.forEach(name => cell.classList.toggle(name, name === status));
          };
          const randomizeStates = (full = false) => {
            if (!mapIcon) return;
            const cells = [...mapIcon.querySelectorAll(".state-cell")];
            if (full) {
              const balanced = shuffleTierThings(cells.map((_, index) => statuses[index % statuses.length]));
              cells.forEach((cell, index) => {
                setStatus(cell, balanced[index]);
                cell.classList.add("just-flipped");
                setTimeout(() => cell.classList.remove("just-flipped"), 140 + (index % 8) * 12);
              });
              return;
            }
            shuffleTierThings(cells).slice(0, 5).forEach((cell, index) => {
              const current = statuses.find(name => cell.classList.contains(name));
              const choices = statuses.filter(name => name !== current);
              setStatus(cell, choices[Math.floor(Math.random() * choices.length)]);
              cell.classList.add("just-flipped");
              setTimeout(() => cell.classList.remove("just-flipped"), 150 + index * 12);
            });
          };
          if (mapIcon) mapIcon.rerollAll = () => randomizeStates(true);
          card.addEventListener("pointerenter", () => {
            if (!hoverCapable) return;
            randomizeStates(true);
            clearInterval(mapTimer);
            mapTimer = setInterval(() => {
              if (card.matches(":hover")) randomizeStates(false);
            }, 520);
          });
          card.addEventListener("pointerleave", () => {
            clearInterval(mapTimer);
            mapTimer = null;
          });
        }

        if (project.action === "recipe") {
          const recipeIcon = card.querySelector(".recipe-icon");
          let recipeTimer = null;
          if (recipeIcon) setRecipeDish(recipeIcon, Number(recipeIcon.dataset.recipeIndex || 0));
          let recipeFirstTimer = null;
          card.addEventListener("pointerenter", () => {
            if (!hoverCapable) return;
            clearTimeout(recipeFirstTimer);
            clearInterval(recipeTimer);
            // Give the hover just enough time to feel intentional, then turn the first page quickly.
            recipeFirstTimer = setTimeout(() => {
              if (!card.matches(":hover")) return;
              flipRecipePage(recipeIcon, false);
              recipeTimer = setInterval(() => {
                if (card.matches(":hover")) flipRecipePage(recipeIcon, false);
              }, 2500);
            }, 520);
          });
          card.addEventListener("pointerleave", () => {
            clearTimeout(recipeFirstTimer);
            clearInterval(recipeTimer);
            recipeFirstTimer = null;
            recipeTimer = null;
          });
        }

        if (project.action === "medals") {
          const tierIcon = card.querySelector(".medals-icon");
          card.addEventListener("pointerenter", () => {
            if (!hoverCapable) return;
            startTierCycle(tierIcon, false);
          });
          card.addEventListener("pointerleave", () => stopTierCycle(tierIcon));
        }

        if (project.action === "traffic") {
          const trafficIcon = card.querySelector(".traffic-icon");
          let signalTimer = null;
          let signalIndex = 0;
          let trafficHovering = false;
          const signals = [
            { name: "red", ms: 2200 },
            { name: "green", ms: 3000 },
            { name: "amber", ms: 1200 }
          ];
          const forceRed = () => {
            clearTimeout(signalTimer);
            signalTimer = null;
            signalIndex = 0;
            if (trafficIcon) trafficIcon.dataset.signal = "red";
          };
          const advanceSignal = () => {
            if (!trafficIcon) return;
            clearTimeout(signalTimer);
            signalTimer = null;
            const currentName = trafficIcon.dataset.signal || "red";
            const currentIndex = signals.findIndex(signal => signal.name === currentName);
            signalIndex = (currentIndex + 1) % signals.length;
            const next = signals[signalIndex];
            trafficIcon.dataset.signal = next.name;
            if (trafficHovering && hoverCapable) {
              signalTimer = setTimeout(() => {
                if (!trafficHovering) return;
                signalIndex = (signalIndex + 1) % signals.length;
                runSignal();
              }, next.ms);
            }
          };
          if (trafficIcon) trafficIcon.advanceSignal = advanceSignal;
          const runSignal = () => {
            clearTimeout(signalTimer);
            if (!trafficIcon || !trafficHovering || !hoverCapable) return;
            const signal = signals[signalIndex];
            trafficIcon.dataset.signal = signal.name;
            signalTimer = setTimeout(() => {
              if (!trafficHovering) return;
              signalIndex = (signalIndex + 1) % signals.length;
              runSignal();
            }, signal.ms);
          };
          card.addEventListener("pointerenter", () => {
            if (!hoverCapable) return;
            trafficHovering = true;
            signalIndex = 0;
            runSignal();
          });
          card.addEventListener("pointerleave", () => {
            trafficHovering = false;
            forceRed();
          });
          card.addEventListener("pointerdown", event => {
            // Tapping the card itself still springs the red-light trap; tapping the icon advances the light normally.
            if (event.target.closest(".animated-icon")) return;
            forceRed();
          });
          card.addEventListener("click", event => {
            if (event.defaultPrevented || event.target.closest(".animated-icon")) return;
            if (!trafficIcon) return;
            event.preventDefault();
            forceRed();
            addTrafficFine();
            showToast("Red means stop. That will be $100. 🚦");
            tone(165, .16, "square", .018);
            const href = card.getAttribute("href");
            setTimeout(() => { window.location.href = href; }, 900);
          });
        }

        if (project.action === "pirate") {
          let raidTimer = null;
          let raidCleanup = null;
          let raider = card.querySelector(".pirate-raider");
          if (!raider) {
            raider = document.createElement("span");
            raider.className = "pirate-raider";
            raider.setAttribute("aria-hidden", "true");
            raider.innerHTML = `<b class="pirate-ship-emoji">⛵</b><i class="loot-arrow">→</i>`;
            card.appendChild(raider);
          }
          let bribe = card.querySelector(".pirate-bribe-label");
          if (!bribe) {
            bribe = document.createElement("span");
            bribe.className = "pirate-bribe-label";
            bribe.textContent = "Pay $200 bribe";
            card.appendChild(bribe);
          }

          const lockPirateCard = () => {
            card.classList.add("pirate-locked");
            card.setAttribute("aria-label", "Pirate Legacy is locked. Click to pay a $200 bribe.");
          };

          const triggerPirateRaid = () => {
            if (card.classList.contains("pirate-locked")) return;
            clearTimeout(raidCleanup);
            card.classList.remove("pirate-raid");
            void card.offsetWidth;
            card.classList.add("pirate-raid");
            playIconSound("pirate");
            raidCleanup = setTimeout(() => {
              card.classList.remove("pirate-raid");
              lockPirateCard();
              showToast("The pirate stole your button. Ransom terms have been posted. 🏴‍☠️");
            }, 1850);
          };

          card.addEventListener("pointerenter", () => {
            if (!hoverCapable || card.classList.contains("pirate-locked")) return;
            clearTimeout(raidTimer);
            clearTimeout(raidCleanup);
            card.classList.remove("pirate-raid");
            raidTimer = setTimeout(() => {
              if (!card.matches(":hover")) return;
              triggerPirateRaid();
            }, 5000);
          });
          card.addEventListener("pointerleave", () => {
            clearTimeout(raidTimer);
            raidTimer = null;
          });
          card.addEventListener("click", event => {
            if (!card.classList.contains("pirate-locked")) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            card.classList.remove("pirate-locked");
            card.removeAttribute("aria-label");
            addMoneyLost(200);
            showToast("Bribe accepted. No receipt. $200 gone. 🏴‍☠️");
            tone(245, .12, "triangle", .016);
          }, true);
        }
      });
    }

    function activateIcon(icon) {
      const action = icon.dataset.action || "plain";
      // Rank Things is intentionally click-heavy: reranking during its grace window
      // should never count toward the general animation-icon spam fine.
      if (action !== "medals") registerIconPress();
      if (action === "dice") {
        rollDie(icon, true);
        return;
      }
      if (action === "bike") {
        runBikeClick(icon);
        return;
      }
      if (action === "map") {
        if (typeof icon.rerollAll === "function") icon.rerollAll();
        icon.classList.remove("active");
        void icon.offsetWidth;
        icon.classList.add("active");
        setTimeout(() => icon.classList.remove("active"), 620);
        playIconSound("map");
        return;
      }
      if (action === "house") {
        randomizeHouse(icon);
        return;
      }
      if (action === "medals") {
        if (icon.dataset.tierCycling === "1" && rerankLastTierItem(icon)) {
          playIconSound("medals");
        } else {
          startTierCycle(icon, true);
        }
        return;
      }
      if (action === "challenge") {
        failCurrentChallenge(icon);
        return;
      }
      if (action === "train") {
        boostTrain(icon);
        return;
      }
      if (action === "traffic") {
        if (typeof icon.advanceSignal === "function") icon.advanceSignal();
        else {
          const order = ["red", "green", "amber"];
          const current = order.indexOf(icon.dataset.signal || "red");
          icon.dataset.signal = order[(current + 1) % order.length];
        }
        playIconSound("traffic");
        return;
      }
      if (action === "dog") {
        woofDog(icon);
        return;
      }
      if (action === "recipe") {
        flipRecipePage(icon, true);
        return;
      }
      if (action === "visited") {
        icon.classList.remove("active");
        void icon.offsetWidth;
        icon.classList.add("active");
        playIconSound("visited");
        clearTimeout(icon.visitedTimer);
        icon.visitedTimer = setTimeout(() => icon.classList.remove("active"), 2050);
        return;
      }
      icon.classList.remove("active");
      void icon.offsetWidth;
      icon.classList.add("active");
      playIconSound(action);
      setTimeout(() => icon.classList.remove("active"), 1800);
    }

    document.addEventListener("click", event => {
      const icon = event.target.closest(".animated-icon");
      if (!icon) return;
      event.preventDefault();
      event.stopPropagation();
      activateIcon(icon);
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const icon = event.target.closest(".animated-icon");
      if (!icon) return;
      event.preventDefault();
      activateIcon(icon);
    });

    document.addEventListener("pointermove", event => {
      if (!hoverCapable || !doodle) return;

      if (mascotAvoiding && mascotHomeRect) {
        const homeX = mascotHomeRect.left + mascotHomeRect.width / 2;
        const homeY = mascotHomeRect.top + mascotHomeRect.height / 2;
        const distanceFromHome = Math.hypot(event.clientX - homeX, event.clientY - homeY);

        if (distanceFromHome < 320) {
          const candidates = [
            [0, 0], [-105, -28], [105, -28], [-88, 50], [88, 50], [0, 62]
          ];
          const minX = 10 - mascotHomeRect.left;
          const maxX = window.innerWidth - 10 - mascotHomeRect.right;
          let best = [0, 0];
          let bestScore = -Infinity;

          for (const [rawX, rawY] of candidates) {
            const x = Math.max(minX, Math.min(maxX, rawX));
            const y = rawY;
            const cx = homeX + x;
            const cy = homeY + y;
            const mouseDistance = Math.hypot(event.clientX - cx, event.clientY - cy);
            const travelPenalty = Math.hypot(x, y) * 0.08;
            const score = mouseDistance - travelPenalty;
            if (score > bestScore) {
              bestScore = score;
              best = [x, y];
            }
          }

          doodle.style.setProperty("--mascot-x", `${best[0]}px`);
          doodle.style.setProperty("--mascot-y", `${best[1]}px`);
        } else {
          doodle.style.setProperty("--mascot-x", "0px");
          doodle.style.setProperty("--mascot-y", "0px");
        }
      }

      const rect = doodle.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = event.clientX - centerX;
      const dy = event.clientY - centerY;
      const distance = Math.hypot(dx, dy) || 1;
      const maxShift = 4;
      const strength = Math.min(1, distance / 140);
      const x = (dx / distance) * maxShift * strength;
      const y = (dy / distance) * maxShift * strength;
      doodle.style.setProperty("--eye-x", `${x.toFixed(2)}px`);
      doodle.style.setProperty("--eye-y", `${y.toFixed(2)}px`);
    });

    document.addEventListener("pointerleave", () => {
      if (!doodle) return;
      doodle.style.setProperty("--eye-x", "0px");
      doodle.style.setProperty("--eye-y", "0px");
      if (mascotAvoiding) {
        doodle.style.setProperty("--mascot-x", "0px");
        doodle.style.setProperty("--mascot-y", "0px");
      }
    });



    projectCount.textContent = `${projects.length} incomplete projects & counting`;

    updateTrafficFineDisplay();
    setInterval(() => updateTrafficFineDisplay(), 60000);
    render();
    wireThemedCards();
    document.querySelectorAll(".map-icon").forEach(icon => {
      if (typeof icon.rerollAll === "function") icon.rerollAll();
    });
    document.querySelectorAll(".house-icon").forEach(icon => randomizeHouse(icon, false));
  </script>
</body>
