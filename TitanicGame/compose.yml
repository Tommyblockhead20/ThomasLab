services:
  game:
    build:
      context: ..
      dockerfile: TitanicGame/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
      - "40000-40100:40000-40100/udp"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
