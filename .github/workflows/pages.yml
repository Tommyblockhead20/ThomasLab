name: Build and publish ThomasLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress publication finish before publishing a newer revision.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the complete site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            ReelAscent/package-lock.json
            TitanicGame/package-lock.json

      - name: Install Bass Camp build dependencies
        working-directory: ReelAscent
        run: npm ci

      - name: Build Bass Camp from its source
        working-directory: ReelAscent
        run: npm run build

      - name: Install Titanic build dependencies
        working-directory: TitanicGame
        run: npm ci

      - name: Test Titanic multiplayer, simulation, and WebRTC relay
        working-directory: TitanicGame
        run: npm test

      - name: Build Titanic from its source
        working-directory: TitanicGame
        env:
          VITE_GAME_SERVER_URL: ${{ vars.TITANIC_SERVER_URL }}
        run: npm run build

      - name: Prepare and validate the complete website
        run: node scripts/stage-pages.mjs

      - name: Upload the website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Publish to thomaslab.me
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish the validated website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
