<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tides Campaign · Core V10</title>
  <style>
    :root {
      --bg: #071018;
      --panel: rgba(8, 18, 27, 0.94);
      --panel-2: rgba(12, 26, 38, 0.94);
      --line: rgba(199, 153, 82, 0.28);
      --line-strong: rgba(218, 174, 99, 0.58);
      --gold: #d7a65b;
      --text: #ede6d8;
      --muted: #9aa8b1;
      --blue: #3c98c9;
      --green: #739c58;
      --red: #b35343;
      --shadow: 0 18px 55px rgba(0,0,0,.38);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -20%, rgba(43, 83, 107, .27), transparent 42%),
        linear-gradient(180deg, #08131d, #050b11 72%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app-shell { min-height: 100vh; }

    .topbar {
      height: 66px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      padding: 0 22px;
      background: rgba(4, 11, 17, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .nav-tabs { grid-column: 2; display: flex; align-items: stretch; gap: 14px; }
    .nav-tab {
      min-width: 105px;
      padding: 0 14px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #bda786;
      cursor: pointer;
      transition: .18s ease;
      letter-spacing: .01em;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      color: #f0d39d;
      border-bottom-color: var(--gold);
      background: linear-gradient(180deg, transparent, rgba(215,166,91,.07));
    }

    .player-switcher {
      grid-column: 3;
      justify-self: end;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }
    .player-switcher select, select, input, textarea {
      color: var(--text);
      background: #0c1721;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      outline: none;
    }
    .player-switcher select { min-width: 150px; }
    textarea { width: 100%; resize: vertical; min-height: 110px; }

    .utility-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(14, 27, 38, .9);
      cursor: pointer;
    }
    .utility-btn:hover { border-color: var(--line-strong); }

    main { padding: 14px; }
    .screen { display: none; }
    .screen.active { display: block; animation: fade .18s ease; }
    @keyframes fade { from { opacity: .4; transform: translateY(3px); } }

    .panel {
      background: linear-gradient(180deg, rgba(11, 24, 35, .95), rgba(7, 16, 24, .95));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel-title {
      margin: 0 0 14px;
      color: #e1bd7e;
      font-family: Georgia, serif;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .eyebrow { color: var(--gold); text-transform: uppercase; font-size: .75rem; letter-spacing: .12em; }
    .muted { color: var(--muted); }

    /* OVERVIEW */
    .overview-grid {
      display: grid;
      grid-template-columns: minmax(245px, 290px) minmax(520px, 1fr) minmax(255px, 320px);
      gap: 14px;
      min-height: calc(100vh - 94px);
    }
    .overview-left, .overview-right { padding: 18px; }
    .overview-center { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
    .progress-track {
      height: 9px;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      margin-top: 12px;
    }
    .progress-segment { background: rgba(255,255,255,.08); border-radius: 3px; }
    .progress-segment.done { background: var(--blue); }

    .ship-summary { padding: 17px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .ship-summary:first-of-type { margin-top: 20px; }
    .ship-name { margin-bottom: 3px; font-family: Georgia, serif; font-size: 1.2rem; }
    .ship-name.blue { color: #7fc1e4; }
    .ship-name.red { color: #dd7565; }
    .captain-line { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }

    .stat-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 5px 0;
      color: #d3d8dc;
      font-size: .9rem;
    }
    .meter { display: flex; gap: 4px; }
    .meter.compact { gap: 2px; }
    .meter.compact .pip { width: 10px; }
    .pip { width: 18px; height: 8px; border-radius: 2px; background: rgba(255,255,255,.08); }
    .pip.on.blue { background: var(--blue); }
    .pip.on.red { background: var(--red); }
    .pip.on.gold { background: var(--gold); }

    .session-banner {
      min-height: 205px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(6,14,21,.96), rgba(6,14,21,.46)),
        radial-gradient(circle at 78% 40%, rgba(56,93,115,.38), transparent 35%),
        linear-gradient(145deg, #14283a, #0b1721 56%, #182a34);
      position: relative;
      overflow: hidden;
    }
    .session-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(167deg, transparent 52%, rgba(0,0,0,.32) 53%),
        repeating-linear-gradient(90deg, transparent 0 110px, rgba(255,255,255,.015) 111px 112px);
      pointer-events: none;
    }
    .session-banner > * { position: relative; z-index: 1; }
    .session-title { margin: 7px 0 4px; font: 2rem Georgia, serif; }
    .session-subtitle { color: #cfbeaa; }
    .session-narrative { max-width: 820px; color: #d4d0c8; line-height: 1.55; margin: 13px 0 0; }
    .vote-type-badge {
      align-self: flex-start;
      margin-top: 13px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #e6c58c;
      background: rgba(5,12,18,.55);
      font-size: .78rem;
    }
    .outcome-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-left: 3px solid var(--gold);
      background: rgba(4, 12, 18, .62);
      line-height: 1.5;
    }
    .outcome-box strong { color: #f0d39d; }
    .resolution-panel { display: grid; gap: 16px; }
    .outcome-result {
      padding: 20px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(38,55,64,.48), rgba(7,16,24,.7));
    }
    .outcome-result h3 { margin: 4px 0 8px; color: #f0d39d; font: 1.45rem Georgia, serif; }
    .outcome-result p { margin: 0; color: #d0ccc3; line-height: 1.55; }
    .ship-outcome-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .ship-outcome-card { padding: 17px; border: 1px solid rgba(255,255,255,.09); border-radius: 10px; background: rgba(255,255,255,.025); }
    .ship-outcome-card.blue { border-top: 3px solid var(--blue); }
    .ship-outcome-card.red { border-top: 3px solid var(--red); }
    .ship-outcome-card h3 { margin: 0 0 5px; font: 1.2rem Georgia, serif; }
    .ship-outcome-card h4 { margin: 8px 0; color: #e7c58c; font: 1.05rem Georgia, serif; }
    .ship-outcome-card p { margin: 0; color: #cbc7bf; line-height: 1.5; }
    .consequence-box { border: 1px solid rgba(255,255,255,.09); border-radius: 11px; overflow: hidden; }
    .consequence-heading { padding: 11px 14px; background: rgba(215,166,91,.08); color: #e5c187; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; }
    .consequence-row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 11px 14px; border-top: 1px solid rgba(255,255,255,.06); }
    .consequence-kind { color: var(--muted); font-size: .8rem; }
    .consequence-change { color: #d7d4cd; }
    .outcome-actions { display: flex; justify-content: center; margin-top: 2px; }

    .decision-panel { padding: 26px; }
    .decision-question { text-align: center; margin: 0; font: 1.65rem Georgia, serif; }
    .decision-intro { text-align: center; color: #baaf9f; margin: 8px 0 22px; }
    .choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .choice-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(5,12,18,.7);
      cursor: pointer;
      transition: .16s ease;
      text-align: left;
      padding: 0;
    }
    .choice-card:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--line-strong); }
    .choice-card.selected { border-color: #69b3df; box-shadow: 0 0 0 2px rgba(60,152,201,.22); }
    .choice-card.winner { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(215,166,91,.2); }
    .choice-card:disabled { cursor: default; opacity: .83; }
    .choice-art {
      height: 145px;
      background:
        linear-gradient(180deg, transparent 45%, rgba(3,8,12,.9)),
        radial-gradient(circle at 50% 45%, rgba(190,135,64,.25), transparent 30%),
        linear-gradient(135deg, #1b3141, #09131c);
      position: relative;
    }
    .choice-art::before {
      content: "";
      position: absolute;
      left: 14%; right: 14%; bottom: 19%; height: 42%;
      border-radius: 50% 50% 18% 18%;
      background: rgba(0,0,0,.48);
      box-shadow: 40px 10px 0 -10px rgba(0,0,0,.44), -42px 14px 0 -14px rgba(0,0,0,.4);
    }
    .choice-body { padding: 16px; min-height: 122px; }
    .choice-title { margin: 0 0 8px; color: #f0cf96; font: 1.14rem Georgia, serif; }
    .choice-flavor { margin: 0; color: #c8c3ba; line-height: 1.45; }
    .vote-row { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .influence-input { width: 72px; }

    .primary-btn, .secondary-btn { border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    .primary-btn { background: #15364a; border: 1px solid #357ba2; }
    .secondary-btn { background: #0c1720; border: 1px solid var(--line); }
    .primary-btn:hover, .secondary-btn:hover { filter: brightness(1.13); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .vote-status { padding: 18px 22px; }
    .vote-status-grid { display: flex; flex-wrap: wrap; gap: 9px; }
    .vote-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      color: #c9c7c0;
      font-size: .85rem;
    }
    .vote-chip.done { color: #9bbf8c; border-color: rgba(115,156,88,.35); }
    .vote-chip.waiting { color: #e5ba70; border-color: rgba(215,166,91,.32); }

    .roster-group + .roster-group { margin-top: 23px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); }
    .roster-heading { font: 1.08rem Georgia, serif; margin: 0 0 12px; }
    .roster-heading.blue { color: #7fc1e4; }
    .roster-heading.red { color: #dd7565; }
    .player-row {
      display: grid;
      grid-template-columns: 42px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.045);
    }
    .portrait {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #253746, #111b23);
      border: 1px solid var(--line-strong);
      color: #e0c08a;
      font-family: Georgia, serif;
      font-size: 1.1rem;
    }
    .player-name { font-family: Georgia, serif; }
    .player-role { color: #88b7d2; font-size: .8rem; margin-top: 2px; }
    .roster-group.red .player-role { color: #d9897d; }
    .resource { color: #c1cbd1; font-size: .86rem; white-space: nowrap; }
    .resource.gold { color: #e5b969; }

    /* MAP */
    .map-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; min-height: calc(100vh - 94px); }
    .map-panel { position: relative; overflow: hidden; min-height: 820px; }
    #hexMap { width: 100%; height: 100%; min-height: 820px; display: block; cursor: grab; touch-action: none; }
    #hexMap.dragging { cursor: grabbing; }
    .map-side { padding: 20px; }
    .map-toolbar { position: absolute; left: 16px; top: 16px; z-index: 3; display: flex; gap: 8px; }
    .map-tag {
      position: absolute; right: 16px; top: 16px; z-index: 3;
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px;
      background: rgba(6,14,21,.85); color: var(--muted); font-size: .85rem;
    }
    .ship-map-label { font: 700 11px Inter, sans-serif; paint-order:stroke; stroke:#061019; stroke-width:3px; stroke-linejoin:round; }

    /* DETAILS */
    .details-shell { min-height: calc(100vh - 94px); }
    .subtabs { display: flex; gap: 8px; padding: 12px; margin-bottom: 14px; }
    .subtab {
      border: 1px solid var(--line); background: transparent; color: #bda786;
      border-radius: 8px; padding: 10px 16px; cursor: pointer;
    }
    .subtab.active { color: var(--text); background: rgba(215,166,91,.1); border-color: var(--line-strong); }
    .details-grid { display: grid; grid-template-columns: 290px 1fr 340px; gap: 14px; }
    .details-panel { padding: 18px; min-height: 620px; }
    .hold-grid {
      --hold-cell: 42px;
      --hold-gap: 3px;
      display: grid;
      gap: var(--hold-gap);
      align-content: start;
      width: max-content;
      max-width: 100%;
      overflow: auto;
      padding: 10px;
      background: rgba(2,8,12,.55);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
    }
    .hold-grid.editable { outline: 1px solid rgba(60,152,201,.22); }
    .hold-cell { width: var(--hold-cell); height: var(--hold-cell); border: 1px solid rgba(191,153,92,.22); background: rgba(255,255,255,.025); position: relative; }
    .hold-cell.drop-hover { background: rgba(60,152,201,.16); border-color: rgba(96,181,229,.7); }
    .damage-cell {
      z-index: 4;
      min-height: var(--hold-cell);
      border: 1px solid rgba(225,91,72,.82);
      border-radius: 4px;
      background:
        repeating-linear-gradient(135deg, rgba(159,41,31,.75) 0 6px, rgba(87,20,18,.86) 6px 12px);
      display: grid;
      place-items: center;
      color: #ffd2c9;
      font-weight: 800;
      font-size: 1.1rem;
      pointer-events: none;
    }
    .hold-fill { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:8px 0 14px; }
    .hold-fill-segment { height:8px; border-radius:3px; overflow:hidden; background:rgba(255,255,255,.07); }
    .hold-fill-segment > span { display:block; height:100%; background:var(--gold); }
    .cargo-item {
      border: 1px solid rgba(207,166,92,.7);
      background: linear-gradient(145deg, rgba(117,84,42,.95), rgba(69,45,24,.95));
      display: grid; place-items: center;
      color: #f0d39d;
      font-size: .72rem;
      overflow: hidden;
      border-radius: 5px;
      z-index: 2;
      min-height: var(--hold-cell, 42px);
      text-align: center;
      padding: 3px;
    }
    .cargo-item[draggable="true"] { cursor: grab; user-select:none; }
    .cargo-item.dragging { opacity:.55; cursor:grabbing; }
    .cargo-item.rum { background: linear-gradient(145deg, rgba(105,69,35,.95), rgba(54,31,17,.95)); }
    .player-select-card {
      display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center;
      padding: 10px; border: 1px solid transparent; border-radius: 9px; cursor: pointer;
    }
    .player-select-card:hover, .player-select-card.active { border-color: var(--line); background: rgba(255,255,255,.035); }
    .inventory-list { display: grid; gap: 8px; }
    .inventory-item { padding: 10px 12px; border: 1px solid rgba(255,255,255,.07); border-radius: 8px; display: flex; justify-content: space-between; gap: 12px; }

    /* V5 INTERACTION / VISUALS */
    .influence-stepper {
      display:inline-grid; grid-template-columns:38px 58px 38px; align-items:center;
      border:1px solid var(--line); border-radius:999px; overflow:hidden;
      background:rgba(4,12,18,.72); box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
    }
    .influence-stepper button { height:38px; border:0; background:transparent; color:#e6c58c; cursor:pointer; font-size:1.15rem; }
    .influence-stepper button:hover:not(:disabled) { background:rgba(215,166,91,.1); }
    .influence-stepper button:disabled { opacity:.28; cursor:default; }
    .influence-value { text-align:center; font-weight:800; color:#f0d39d; font-variant-numeric:tabular-nums; }
    .vote-summary { min-width:230px; color:#bfc8ce; font-size:.87rem; }
    .vote-summary strong { color:#f0d39d; }

    .ship-hold-cutaway {
      position:relative; width:max-content; max-width:100%; padding:22px 34px 24px;
      margin-top:8px; border:1px solid rgba(183,132,66,.42); border-radius:48% 48% 18px 18px / 18px 18px 32px 32px;
      background:
        linear-gradient(90deg,rgba(63,39,20,.52),rgba(104,69,35,.32) 12%,rgba(24,18,13,.7) 50%,rgba(104,69,35,.32) 88%,rgba(63,39,20,.52)),
        repeating-linear-gradient(0deg,rgba(231,190,120,.035) 0 2px,transparent 2px 18px),
        #120e0b;
      box-shadow: inset 0 -18px 40px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.26);
      overflow:auto;
    }
    .ship-hold-cutaway::before, .ship-hold-cutaway::after {
      content:""; position:absolute; top:18px; bottom:18px; width:18px;
      border:1px solid rgba(205,157,83,.38); background:linear-gradient(90deg,rgba(113,73,33,.72),rgba(47,31,18,.7));
    }
    .ship-hold-cutaway::before { left:8px; border-radius:100% 0 0 100%; }
    .ship-hold-cutaway::after { right:8px; transform:scaleX(-1); border-radius:100% 0 0 100%; }
    .hold-deck-label { text-align:center; margin:-9px 0 10px; color:#8f826f; font-size:.68rem; letter-spacing:.13em; text-transform:uppercase; }
    .hold-grid { background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
        repeating-linear-gradient(90deg,rgba(169,119,60,.055) 0 1px,transparent 1px 45px),
        rgba(4,10,13,.76); }
    .hold-cell { background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.035),rgba(255,255,255,.012)); }
    .hold-cell.drop-valid { background:rgba(60,152,201,.27); border-color:rgba(115,200,244,.95); box-shadow:inset 0 0 12px rgba(60,152,201,.2); }
    .hold-cell.drop-invalid { background:rgba(179,83,67,.26); border-color:rgba(226,112,91,.9); box-shadow:inset 0 0 12px rgba(179,83,67,.18); }
    .cargo-item {
      background:linear-gradient(145deg,rgba(125,89,45,.96),rgba(58,39,22,.98));
      box-shadow:inset 0 0 0 1px rgba(255,225,170,.06), 0 2px 5px rgba(0,0,0,.28);
      border-radius:4px; margin:1px; min-height:0; padding:0; position:relative;
    }
    .cargo-item.material { background:linear-gradient(145deg,rgba(86,94,88,.96),rgba(43,51,49,.98)); }
    .cargo-item.supply { background:linear-gradient(145deg,rgba(72,96,78,.96),rgba(34,53,40,.98)); }
    .cargo-item.valuable { background:linear-gradient(145deg,rgba(116,78,111,.96),rgba(58,38,62,.98)); }
    .cargo-item.crafted { background:linear-gradient(145deg,rgba(73,92,116,.96),rgba(32,47,63,.98)); }
    .cargo-cell-icon { font-size:1rem; opacity:.96; line-height:1; }
    .cargo-cell-label { position:absolute; left:3px; right:3px; bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.56rem; color:#f1dcc0; text-shadow:0 1px 2px #000; }
    .damage-cell { background:
      linear-gradient(25deg,transparent 46%,rgba(255,178,137,.22) 47% 51%,transparent 52%),
      repeating-linear-gradient(135deg,rgba(130,37,29,.8) 0 6px,rgba(55,20,18,.92) 6px 12px); }

    .upgrade-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .upgrade-card { min-height:88px; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:11px; background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015)); }
    .upgrade-slot { color:#8aa4b3; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; }
    .upgrade-name { margin-top:4px; color:#e8c98f; font-family:Georgia,serif; }
    .upgrade-icon { float:right; font-size:1.5rem; color:#d7a65b; margin-left:8px; }
    .reputation-row { display:grid; grid-template-columns:1fr auto; gap:10px; padding:5px 0; color:#bcc5ca; }

    .job-chip-row { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px; }
    .job-chip { padding:5px 8px; border:1px solid rgba(60,152,201,.3); border-radius:999px; color:#9dc7df; background:rgba(60,152,201,.06); font-size:.72rem; }
    .config-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:10px; }
    .config-card { border:1px solid rgba(255,255,255,.09); border-radius:10px; padding:11px; background:rgba(255,255,255,.025); }
    .config-card.active { border-color:var(--line-strong); background:rgba(215,166,91,.06); }
    .config-assignment { color:#aeb9bf; font-size:.76rem; line-height:1.5; margin-top:7px; }

    .recipe-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .recipe-card { border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:11px; background:rgba(255,255,255,.022); }
    .recipe-card h4 { margin:0 0 5px; color:#e6c58c; font:1rem Georgia,serif; }
    .recipe-cost { color:#9da9af; font-size:.78rem; min-height:34px; }
    .recipe-output { color:#b8cbd6; font-size:.76rem; margin:6px 0 9px; }

    .map-region-label { font:italic 24px Georgia,serif; fill:rgba(194,217,224,.18); letter-spacing:.08em; pointer-events:none; }
    .map-coast-mark { pointer-events:none; opacity:.9; }
    .map-event-marker { filter:drop-shadow(0 3px 3px rgba(0,0,0,.6)); pointer-events:none; }

    /* ROLE */
    .role-grid { display:grid; grid-template-columns:210px minmax(690px,1fr) 300px; gap:12px; min-height:calc(100vh - 94px); align-items:start; }
    .role-card, .role-main, .role-side { padding:14px; }
    .role-main .job-card, .role-main .ability-card { padding:10px; margin-bottom:7px; }
    .role-action-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; align-items:start; }
    .role-main .recipe-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .role-main .recipe-card { padding:9px; }
    .role-main .panel-title { margin-bottom:9px; }
    .role-side textarea { min-height:76px; }
    .role-card { position: sticky; top: 80px; }
    .role-badge {
      width: 78px; height: 78px; border-radius: 50%; margin-bottom: 13px;
      display: grid; place-items: center;
      border: 1px solid var(--line-strong);
      background: radial-gradient(circle, rgba(215,166,91,.16), rgba(0,0,0,.1));
      font: 2rem Georgia, serif;
    }
    .role-resource-row { display: flex; gap: 14px; margin-top: 16px; color: #c7cdd0; }
    .ability-card, .secret-card, .job-card, .note-card {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 9px;
      background: rgba(255,255,255,.025);
    }
    .secret-card { border-color: rgba(179,83,67,.38); background: rgba(85,24,21,.14); }
    .job-card { border-color: rgba(60,152,201,.28); }
    .role-action-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .role-action-row select { min-width: 145px; }
    .move-pad { display: grid; grid-template-columns: repeat(3, 36px); gap: 5px; }
    .move-pad button { width: 36px; height: 32px; padding: 0; }
    .note-card .note-meta { color: var(--muted); font-size: .78rem; margin-bottom: 6px; }
    .role-side textarea { min-height: 82px; }
    .notes-list { max-height: 210px; overflow: auto; padding-right: 3px; }

    /* JOURNAL */
    .journal-layout { display: grid; grid-template-columns: 260px 1fr; gap: 14px; min-height: calc(100vh - 94px); }
    .journal-nav, .journal-main { padding: 20px; }
    .journal-filter {
      width: 100%; text-align: left; color: #c7b79c; background: transparent;
      border: 0; border-radius: 8px; padding: 10px; cursor: pointer;
    }
    .journal-filter.active, .journal-filter:hover { background: rgba(255,255,255,.045); color: var(--text); }
    .journal-entry { padding: 18px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .journal-entry:first-of-type { border-top: 0; }
    .journal-entry h3 { margin: 0 0 6px; font: 1.25rem Georgia, serif; color: #e6c58c; }
    .journal-meta { color: #7f8c95; font-size: .82rem; margin-bottom: 10px; }
    .journal-entry p { color: #c9c7c0; line-height: 1.6; max-width: 850px; }

    .empty-note { color: var(--muted); font-style: italic; }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 80;
      padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 9px;
      background: #0d1b26; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px);
      pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1180px) {
      .overview-grid { grid-template-columns: 245px 1fr; }
      .overview-right { grid-column: 1 / -1; }
      .overview-right .rosters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
      .roster-group + .roster-group { margin: 0; padding: 0; border: 0; }
      .details-grid { grid-template-columns: 250px 1fr; }
      .details-grid > :last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 820px) {
      .topbar { grid-template-columns: 1fr; height: auto; padding: 0; }
      .nav-tabs { grid-column: 1; overflow-x: auto; gap: 0; }
      .nav-tab { min-width: 90px; padding: 14px 10px; }
      .player-switcher { display: none; }
      main { padding: 8px; }
      .overview-grid, .map-layout, .details-grid, .role-grid, .journal-layout { grid-template-columns: 1fr; }
      .ship-outcome-grid { grid-template-columns: 1fr; }
      .role-card { position: static; }
      .overview-left { order: 2; }
      .overview-center { order: 1; }
      .overview-right { order: 3; }
      .choice-grid { grid-template-columns: 1fr; }
      .map-side { display: none; }
      .subtabs, .role-subtabs { overflow-x: auto; }
      .hold-cell { width: 34px; height: 34px; }
      .upgrade-grid, .recipe-grid, .config-grid { grid-template-columns:1fr; }
    }
/* ===== V6 POLISH / SYSTEM UI ===== */
:root{
  --ink:#f1eadc; --parchment:#d8c49d; --brass:#c8954e; --brass2:#e0b66d;
  --sea:#0b2b3a; --sea2:#123f50; --wood:#5d3d25; --wood2:#2d1d14;
  --teal:#4ba7a7; --danger:#b95b4a; --good:#7eaa69;
}
body{background:
  radial-gradient(circle at 18% -10%,rgba(40,91,108,.28),transparent 35%),
  radial-gradient(circle at 82% 10%,rgba(115,75,33,.11),transparent 25%),
  linear-gradient(180deg,#07121a,#03080d 78%);}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:
  repeating-linear-gradient(91deg,transparent 0 77px,rgba(255,255,255,.018) 78px 79px),
  repeating-linear-gradient(5deg,transparent 0 41px,rgba(255,255,255,.012) 42px 43px);mix-blend-mode:screen;}
.topbar{height:58px;background:linear-gradient(180deg,rgba(8,16,20,.98),rgba(4,10,14,.95));box-shadow:0 8px 28px rgba(0,0,0,.27);}
.nav-tab{min-width:98px;font-family:Georgia,serif;letter-spacing:.025em;color:#b9a584;}
.nav-tab.active{color:#f0d39d;background:linear-gradient(180deg,rgba(200,149,78,.035),rgba(200,149,78,.09));}
.panel{border-color:rgba(200,149,78,.24);background:
  linear-gradient(180deg,rgba(13,27,36,.94),rgba(6,15,22,.96)),
  repeating-linear-gradient(0deg,rgba(255,255,255,.01) 0 1px,transparent 1px 19px);}
.panel-title{font-size:.82rem;letter-spacing:.11em;color:#d8b378;}
.primary-btn,.secondary-btn,.utility-btn,.nav-tab,.subtab,.journal-filter{transition:transform .14s ease,filter .14s ease,border-color .14s ease,background .14s ease,color .14s ease;}
.primary-btn:active,.secondary-btn:active,.utility-btn:active{transform:translateY(1px);}
.primary-btn{background:linear-gradient(180deg,#1b5361,#123844);border-color:#3d7e88;box-shadow:inset 0 1px rgba(255,255,255,.07);}
.secondary-btn{background:linear-gradient(180deg,#101d24,#0b141a);}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #e0b66d;outline-offset:2px;}

/* opening mark */
.opening-mark{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:
 radial-gradient(circle at 50% 45%,rgba(40,78,89,.32),transparent 28%),linear-gradient(#061018,#020609);animation:openingFade 1.15s ease forwards;pointer-events:none;}
.opening-mark .crest{width:220px;text-align:center;color:#e1c28a;font:small-caps 2rem Georgia,serif;letter-spacing:.12em;text-shadow:0 3px 18px #000;}
.opening-mark .crest:before{content:"";display:block;width:72px;height:72px;margin:0 auto 14px;border:1px solid rgba(224,182,109,.7);border-radius:50%;box-shadow:inset 0 0 30px rgba(75,167,167,.12);background:radial-gradient(circle at 50% 55%,#d1af72 0 3px,transparent 4px),conic-gradient(from 12deg,transparent 0 10%,rgba(211,175,114,.6) 11% 12%,transparent 13% 23%,rgba(211,175,114,.5) 24% 25%,transparent 26% 100%);}
@keyframes openingFade{0%,63%{opacity:1}100%{opacity:0;visibility:hidden}}

/* V6 overview */
.overview-grid{grid-template-columns:minmax(245px,285px) minmax(500px,1fr) minmax(250px,310px);gap:12px;}
.overview-left,.overview-right{padding:16px;}
.session-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid rgba(200,149,78,.18);border-radius:10px;background:rgba(4,12,17,.62);}
.session-people{display:flex;flex-wrap:wrap;gap:6px;}
.attendance-chip{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.025);font-size:.73rem;cursor:pointer;}
.attendance-chip.present:before{content:"";width:7px;height:7px;border-radius:50%;background:#7fab6c;box-shadow:0 0 8px rgba(127,171,108,.35);}
.attendance-chip.absent{opacity:.55}.attendance-chip.absent:before{content:"";width:7px;height:7px;border-radius:50%;background:#8c7771;}
.session-recap{margin-top:8px;padding:9px 11px;border-left:2px solid rgba(75,167,167,.55);background:rgba(75,167,167,.055);font-size:.78rem;color:#aebdc4;line-height:1.45;}
.ship-summary{padding:14px 0}.ship-summary .hold-caption{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:#a7b1b5;margin-top:8px;}
.session-banner{min-height:230px;border-radius:14px;background:linear-gradient(90deg,rgba(5,12,17,.97),rgba(5,12,17,.44)),radial-gradient(circle at 72% 34%,rgba(84,128,137,.28),transparent 28%),linear-gradient(150deg,#19384a,#0a1821 54%,#21382f);}
.event-art-wrap{position:absolute;right:0;top:0;width:46%;height:100%;opacity:.78;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 25%);}
.event-art-wrap img,.event-art-wrap svg{width:100%;height:100%;object-fit:cover;}
.session-banner .session-narrative{max-width:67%;}
.choice-card{box-shadow:0 8px 24px rgba(0,0,0,.18);}
.choice-art{height:132px;display:grid;place-items:center;overflow:hidden;}
.choice-art svg,.choice-art img{width:100%;height:100%;object-fit:cover;}
.choice-body{min-height:108px}.choice-title{font-size:1.08rem}.choice-flavor{font-size:.86rem;}
.vote-row{margin-top:16px}.influence-stepper{grid-template-columns:36px 50px 36px}.influence-stepper button{height:36px;}
.vote-summary{min-width:210px;}
.outcome-result{position:relative;overflow:hidden}.outcome-result:after{content:"";position:absolute;inset:auto -20% -60% 35%;height:150px;background:radial-gradient(ellipse,rgba(224,182,109,.12),transparent 65%);pointer-events:none;}
.waiting-line{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;color:#aeb8bc;font-size:.76rem;}

/* art cards / portraits */
.portrait{overflow:hidden;position:relative;background:linear-gradient(145deg,#2a3b45,#111a20);}
.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover;}
.art-frame{overflow:hidden;border:1px solid rgba(200,149,78,.28);background:#08131a;box-shadow:inset 0 0 30px rgba(0,0,0,.35);}
.art-frame img,.art-frame svg{width:100%;height:100%;object-fit:cover;display:block;}

/* detail ship presentation */
.details-shell{padding-bottom:18px}.subtabs{justify-content:center;background:rgba(4,10,15,.5);border:1px solid rgba(200,149,78,.18);border-radius:11px;}
.details-grid{grid-template-columns:270px minmax(470px,1fr) 320px;align-items:start;}
.ship-portrait{height:230px;border-radius:16px 16px 9px 9px;position:relative;overflow:hidden;background:linear-gradient(#193345 0 56%,#0d3340 57% 100%);border:1px solid rgba(200,149,78,.26);}
.ship-portrait svg,.ship-portrait img{width:100%;height:100%;object-fit:cover;}
.ship-portrait:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-4px;height:34px;background:repeating-radial-gradient(ellipse at 20px 0,rgba(171,216,221,.16) 0 2px,transparent 3px 13px);animation:seaDrift 7s linear infinite;}
@keyframes seaDrift{to{transform:translateX(80px)}}
.ship-title-block{text-align:center;margin:12px 0 16px}.ship-title-block h1{font:1.7rem Georgia,serif;margin:0;color:#f0d39d}.ship-title-block .captain-line{margin:4px 0 0;}
.hold-stage{padding:16px;border:1px solid rgba(200,149,78,.2);border-radius:14px;background:radial-gradient(ellipse at 50% 0,rgba(102,63,30,.16),transparent 45%),rgba(3,9,12,.62);}
.ship-hold-cutaway{margin:0 auto;padding:24px 34px 26px;border-radius:42% 42% 22px 22px/16px 16px 36px 36px;}
.hold-grid{--hold-cell:46px;gap:3px;overflow:visible;}
.cargo-cell-icon{width:26px;height:26px;display:block}.cargo-cell-icon svg{width:100%;height:100%;}
.cargo-cell-label{font-size:.58rem}.damage-cell{animation:damageIn .23s ease both;}
@keyframes damageIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cargo-item.snap{animation:cargoSnap .18s ease}@keyframes cargoSnap{50%{transform:scale(1.035)}}
.upgrade-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.upgrade-card{position:relative;overflow:hidden}.upgrade-card.occult{border-color:rgba(112,113,173,.42);background:linear-gradient(145deg,rgba(75,67,106,.18),rgba(255,255,255,.015));}
.condition-pill,.magic-pill,.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;margin:2px;border-radius:999px;border:1px solid rgba(255,255,255,.09);font-size:.72rem;color:#c7cfd2;background:rgba(255,255,255,.025)}
.magic-pill{border-color:rgba(111,130,168,.35);color:#bfc9dd;background:rgba(87,89,129,.08)}

/* role */
.role-grid{grid-template-columns:250px minmax(440px,1fr) 300px;gap:12px}.role-card,.role-main,.role-side{padding:17px}.role-card{top:70px}.role-badge{background:radial-gradient(circle at 50% 40%,rgba(200,149,78,.16),transparent 60%),#0c1820;border-color:rgba(200,149,78,.38)}
.job-card{background:linear-gradient(145deg,rgba(255,255,255,.027),rgba(255,255,255,.012));border-color:rgba(255,255,255,.075);}
.job-card h3{font-weight:500}.job-tier{float:right;color:#887d6d;font-size:.65rem;letter-spacing:.07em;text-transform:uppercase}.workload-badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(200,149,78,.08);border:1px solid rgba(200,149,78,.2);font-size:.68rem;color:#cdb482}
.recipe-card{position:relative}.recipe-art{height:72px;border-radius:7px;overflow:hidden;margin-bottom:8px;background:#0b161d}.recipe-art svg,.recipe-art img{width:100%;height:100%;object-fit:cover}.recipe-cost{line-height:1.45}.recipe-output{min-height:34px}
.quick-check{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-check .span2{grid-column:1/-1}.die-stage{height:72px;display:grid;place-items:center}.d20{width:58px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,95% 27%,88% 78%,50% 100%,12% 78%,5% 27%);background:linear-gradient(145deg,#d2b16e,#71502a);color:#091015;font:700 1.25rem Georgia,serif;box-shadow:0 10px 24px rgba(0,0,0,.3)}.d20.rolling{animation:d20roll .52s cubic-bezier(.2,.7,.2,1)}@keyframes d20roll{0%{transform:rotate(-15deg) scale(.75)}35%{transform:rotate(130deg) scale(1.1)}70%{transform:rotate(250deg) scale(.94)}100%{transform:rotate(360deg)}}
.magic-section{border-left:2px solid rgba(113,124,175,.45);padding-left:12px}.secret-section{border-left:2px solid rgba(200,149,78,.38);padding-left:12px}
.runner-card{border-color:rgba(144,100,160,.35);background:rgba(105,68,118,.06)}
.dead-banner{padding:13px;border:1px solid rgba(185,91,74,.38);border-radius:10px;background:rgba(185,91,74,.08);color:#e0b0a8;}

/* popover/modal */
.popover{position:fixed;z-index:120;width:min(340px,calc(100vw - 24px));padding:14px;border:1px solid rgba(200,149,78,.38);border-radius:12px;background:rgba(7,16,22,.98);box-shadow:0 18px 60px rgba(0,0,0,.55);color:#d7d6d0;}
.popover h3{font:1.16rem Georgia,serif;color:#e7c88f;margin:0 0 7px}.popover .close-x{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#a9a19a;cursor:pointer;font-size:1.1rem}.popover dl{display:grid;grid-template-columns:82px 1fr;gap:5px 8px;margin:10px 0 0;font-size:.76rem}.popover dt{color:#8f9da2}.popover dd{margin:0;color:#c9cdca}
.modal-backdrop{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.62);backdrop-filter:blur(4px)}.modal{width:min(760px,100%);max-height:85vh;overflow:auto;padding:20px;border:1px solid rgba(200,149,78,.35);border-radius:15px;background:linear-gradient(180deg,#101f28,#071017);box-shadow:0 30px 100px rgba(0,0,0,.6)}.modal h2{font:1.6rem Georgia,serif;margin:0;color:#e7c88f}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}

/* map */
.map-panel{background:radial-gradient(ellipse at 35% 25%,#164557,#0b2836 46%,#07151f 100%)}
#hexMap{background:
 radial-gradient(circle at 20% 30%,rgba(147,193,187,.05),transparent 17%),
 radial-gradient(circle at 70% 70%,rgba(36,91,101,.1),transparent 24%);}
.hex-face{transition:fill .15s ease,stroke .15s ease;}.map-world-label{font:italic 24px Georgia,serif;fill:rgba(218,197,155,.22);letter-spacing:.08em;pointer-events:none}.map-small-label{font:700 10px Georgia,serif;fill:#ddc89c;paint-order:stroke;stroke:#061019;stroke-width:3px;pointer-events:none}.map-route{fill:none;stroke:rgba(206,181,128,.22);stroke-width:2;stroke-dasharray:7 8;pointer-events:none}.map-storm{animation:stormPulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes stormPulse{50%{opacity:.55;transform:scale(1.04)}}
.map-fog{filter:url(#fogBlur)}

/* journal */
.journal-layout{grid-template-columns:210px 1fr}.journal-main{background:linear-gradient(90deg,rgba(61,42,27,.2),transparent 4%),linear-gradient(180deg,rgba(218,196,157,.055),rgba(7,16,24,.95));}.journal-entry{position:relative;padding-left:21px}.journal-entry:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border:1px solid rgba(200,149,78,.55);transform:rotate(45deg)}.journal-entry button{margin-top:7px}.journal-filter{font-family:Georgia,serif}.journal-votes{display:grid;gap:5px;margin-top:10px}.journal-vote-row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;font-size:.78rem;color:#bbc3c6}.debug-panel{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}.validation-good{color:#91b67d}.validation-bad{color:#d9897d}

/* save utilities */
.save-tools{display:flex;gap:7px;align-items:center}.save-menu{position:absolute;right:14px;top:51px;z-index:90;min-width:185px;padding:7px;border:1px solid rgba(200,149,78,.3);border-radius:10px;background:#09151c;box-shadow:0 16px 40px rgba(0,0,0,.45)}.save-menu button{display:block;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;color:#c7c5bf;padding:8px 10px;cursor:pointer}.save-menu button:hover{background:rgba(200,149,78,.08);color:#f0d39d}.save-menu[hidden]{display:none}

/* mobile */
@media(max-width:1180px){.details-grid{grid-template-columns:250px 1fr}.role-grid{grid-template-columns:230px 1fr}.role-side{grid-column:1/-1}.overview-grid{grid-template-columns:235px 1fr}.overview-right{grid-column:1/-1}.overview-right .rosters{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}}
@media(max-width:820px){.topbar{height:auto}.nav-tab{font-size:.8rem}.overview-grid,.details-grid,.role-grid,.journal-layout{grid-template-columns:1fr}.session-banner{padding:20px}.session-banner .session-narrative{max-width:100%;}.event-art-wrap{opacity:.22;width:100%;mask-image:linear-gradient(180deg,#000,transparent)}.choice-grid{grid-template-columns:1fr}.overview-left,.overview-center,.overview-right{order:initial}.details-grid>.details-panel:last-child,.role-side{grid-column:auto}.ship-portrait{height:190px}.hold-grid{--hold-cell:36px}.ship-hold-cutaway{padding:20px 28px 22px;max-width:100%;overflow:auto}.session-strip{align-items:flex-start;flex-direction:column}.session-people{max-height:80px;overflow:auto}.journal-nav{position:static}.map-panel,#hexMap{min-height:650px}.map-layout{display:block}.map-side{display:block;margin-top:8px}.quick-check{grid-template-columns:1fr}.quick-check .span2{grid-column:auto}.save-tools{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}.opening-mark{display:none}.ship-portrait:after{animation:none}}

  
@media(max-width:820px){
  .topbar{grid-template-columns:1fr;padding:0 4px;min-width:0;}
  .nav-tabs{grid-column:1;width:100%;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;}

function recipeList(){return STORY.recipes||FALLBACK_RECIPES} function recipeById(id){return recipeList().find(r=>r.id===id)}

function consumeIngredients(ship,recipe){(recipe.ingredients||[]).forEach(ing=>{let qty=ing.qty||1;for(let i=ship.hold.items.length-1;i>=0&&qty>0;i--)if(ingredientMatches(ship.hold.items[i],ing)){ship.hold.items.splice(i,1);qty--}})}
function craftRecipe(p,ship,id){const recipe=recipeById(id);if(!recipe)return{ok:false,message:'Recipe not found.'};const status=recipeStatus(ship,recipe,p);if(!status.canCraft)return{ok:false,message:`Missing ${status.missing.join(', ')}.`};let placement=null;if(recipe.resultType==='cargo'){const temp={id:'preview',...recipe.result,x:0,y:0,rotation:0};placement=findOpenCargoSlot(ship,temp);if(!placement)return{ok:false,message:'The result will not fit in the hold.'}}
  consumeIngredients(ship,recipe);const result=clone(recipe.result||{});if(recipe.resultType==='cargo'){ship.hold.items.push({id:uid('cargo'),...result,...placement,rotation:0,tags:result.tags||[]})}else if(recipe.resultType==='equipment'){p.equipment.push(normalizeEquipment({...result,id:uid('eq')},p.id))}else if(recipe.resultType==='upgrade'){ship.upgrades.push({id:uid('up'),category:result.category||'Utility',description:result.description||'',modifiers:result.modifiers||[],...result})}else if(recipe.resultType==='relic'){const id=result.id||uid('relic');if(!p.relics.includes(id))p.relics.push(id);if(!p.equipment.some(e=>e.id===id))p.equipment.push(normalizeEquipment({...result,id,magical:true},p.id))}
  journal(recipe.resultType==='upgrade'?'upgrade':'crafting',recipe.name,`${p.name} crafted ${recipe.name} aboard ${ship.name}.`);saveState();return{ok:true,message:`Crafted ${recipe.name}.`}}

function getReputation(scope,faction,p=currentPlayer(),ship=getShip(p?.shipId)){if(scope==='player')return Number(p?.reputation?.[faction]||0);if(scope==='ship')return Number(ship?.reputation?.[faction]||0);return Number(state.reputation.fleet[faction]||0)}

function resolvePlayer(targetId,context={}){if(targetId==='currentPlayer')return getPlayer(context.playerId)||currentPlayer();return getPlayer(targetId)||getPlayer(context.playerId)||currentPlayer()}
function resolveShip(targetId,context={}){if(targetId==='currentShip')return getShip(context.shipId)||getShip(resolvePlayer(null,context)?.shipId);return getShip(targetId)||getShip(context.shipId)||getShip(resolvePlayer(null,context)?.shipId)}

function supernaturalDef(kind,id){const source=STORY.supernatural||FALLBACK_STORY.supernatural;const bucket=kind==='gifts'?'gifts':kind==='curses'?'curses':kind==='oaths'?'oaths':'relics';return source?.[bucket]?.[id]||{id,name:id,description:'A strange effect whose full rule is supplied by story data.',category:bucket.slice(0,-1)}}
function addSupernatural(p,kind,id){p[kind] ||= [];if(!p[kind].includes(id))p[kind].push(id);const def=supernaturalDef(kind,id);journal('magic',def.name,`${p.name} gained ${def.category.toLowerCase()} “${def.name}.”`);return def}
function killCharacter(p,reason='The sea takes its due.'){if(!p||p.alive===false)return;p.alive=false;p.diedAt=nowIso();p.deathReason=reason;state.session.attendance[p.id]='absent';const ship=getShip(p.shipId);p.equipment.forEach(eq=>eq.owner=null);state.graveyard.push({id:p.id,name:p.name,shipId:p.shipId,role:p.role,deathReason:reason,diedAt:p.diedAt,history:state.journal.filter(e=>e.playerId===p.id||e.text?.includes(p.name)).slice(-8)});journal('character',`${p.name} died`,reason,{playerId:p.id});if(ship?.captainId===p.id){const replacementCaptain=state.players.find(x=>x.shipId===ship.id&&x.alive&&x.id!==p.id);if(replacementCaptain)ship.captainId=replacementCaptain.id}return p}
function replaceCharacter(oldPlayerId,data){const old=getPlayer(oldPlayerId);if(!old)return null;const ship=getShip(old.shipId),power=Math.round(PLAYER_STATS.reduce((n,k)=>n+(old.stats[k]||0),0)/PLAYER_STATS.length);old.name=data.name||`${old.name} (fallen)`;const p={id:data.id||uid('player'),name:data.name||'New Sailor',shipId:old.shipId,role:'Sailor',jobs:[],influence:Math.min(3,Math.max(1,old.influence)),gold:Math.round(old.gold*.5),alive:true,stats:{Might:power,Cunning:power,Command:power,Seamanship:power},equipment:[],abilities:[],conditions:[],gifts:[],curses:[],oaths:[],relics:[],secrets:[],goal:data.goal||'Make a place aboard the ship.',reputation:{}};state.players.push(p);state.session.attendance[p.id]='present';if(ship&&!state.players.some(x=>x.id===ship.captainId&&x.alive))ship.captainId=p.id;applyCrewConfigurationToState(state,ship,ship.crewConfiguration);state.currentPlayerId=p.id;journal('character',`${p.name} joined ${ship.name}`,`${p.name} replaced a fallen character without resetting ship progression.`,{playerId:p.id});saveState();return p}

const effectHandlers = {
  adjustPlayerStat:(e,c)=>{const p=resolvePlayer(e.targetId,c),before=Number(p.stats[e.stat]||0),after=clamp(before+Number(e.amount??e.delta??0),0,5);p.stats[e.stat]=after;return{kind:'Player stat',text:`${p.name}: ${e.stat} ${before} → ${after}`}},
  adjustShipStat:(e,c)=>{const s=resolveShip(e.targetId,c),before=Number(s.stats[e.stat]||0),max=e.stat==='Morale'?10:5,after=clamp(before+Number(e.amount??e.delta??0),0,max);s.stats[e.stat]=after;return{kind:'Ship stat',text:`${s.name}: ${e.stat} ${before} → ${after}`}},
  addInfluence:(e,c)=>{const p=resolvePlayer(e.targetId,c),before=p.influence;p.influence=clamp(before+Number(e.amount||1),0,INFLUENCE_CAP);return{kind:'Influence',text:`${p.name}: ${before} → ${p.influence}`}},
  removeInfluence:(e,c)=>effectHandlers.addInfluence({...e,amount:-Math.abs(e.amount||1)},c),
  addGold:(e,c)=>{const p=resolvePlayer(e.targetId,c),before=p.gold;p.gold=Math.max(0,before+Number(e.amount||0));return{kind:'Gold',text:`${p.name}: ${before} → ${p.gold}`}},
  removeGold:(e,c)=>effectHandlers.addGold({...e,amount:-Math.abs(e.amount||0)},c),
  addItem:(e,c)=>{const p=resolvePlayer(e.targetId,c),eq=normalizeEquipment({...e.item,id:e.item?.id||uid('eq')},p.id);p.equipment.push(eq);return{kind:'Equipment',text:`${p.name} gained ${eq.name}.`}},

  removeCargo:(e,c)=>{const s=resolveShip(e.targetId,c),i=s.hold.items.findIndex(x=>x.id===e.itemId||x.name===e.name);if(i<0)return null;const [item]=s.hold.items.splice(i,1);return{kind:'Cargo',text:`${s.name} lost ${item.name}.`}},

  addUpgrade:(e,c)=>{const s=resolveShip(e.targetId,c),u={id:e.upgrade?.id||uid('up'),category:e.upgrade?.category||'Utility',description:e.upgrade?.description||'',modifiers:e.upgrade?.modifiers||[],...clone(e.upgrade||{})};s.upgrades.push(u);journal('upgrade',u.name||'Ship upgrade',`${s.name} installed ${u.name||'an upgrade'}.`);return{kind:'Upgrade',text:`${s.name}: ${u.name} installed.`}},
  removeUpgrade:(e,c)=>{const s=resolveShip(e.targetId,c),i=s.upgrades.findIndex(x=>x.id===e.upgradeId||x.name===e.name);if(i<0)return null;const [u]=s.upgrades.splice(i,1);return{kind:'Upgrade',text:`${s.name}: ${u.name} removed.`}},
  revealHex:(e)=>{if(!state.map.revealed.includes(e.key))state.map.revealed.push(e.key);if(e.name)state.map.locations[e.key]={...(state.map.locations[e.key]||{}),name:e.name,type:e.locationType||'Discovery',note:e.note||'Revealed by the current story event.',art:e.art||null};return{kind:'Map',text:`${e.name||e.key} revealed.`}},
  addReputation:(e,c)=>adjustReputation(e,c),
  addCondition:(e,c)=>{const target=e.targetType==='ship'?resolveShip(e.targetId,c):resolvePlayer(e.targetId,c),cond=addCondition(target,e.condition||{name:e.name,description:e.description,duration:e.duration,visibility:e.visibility});return{kind:'Condition',text:`${target.name}: ${cond.name}.`}},
  removeCondition:(e,c)=>{const target=e.targetType==='ship'?resolveShip(e.targetId,c):resolvePlayer(e.targetId,c),i=(target.conditions||[]).findIndex(x=>x.id===e.conditionId||x.name===e.name);if(i<0)return null;const [cond]=target.conditions.splice(i,1);return{kind:'Condition',text:`${target.name}: ${cond.name} removed.`}},

function normalizeEffect(e){if(e.type)return e;const map={stat:'adjustShipStat',item:'addCargo',damage:'addDamage',mapReveal:'revealHex'};return{...e,type:map[e.kind]||e.kind}}
function applyEffects(effects=[],context={}){const rows=[];for(const raw of effects){const e=normalizeEffect(raw);if(e.personalOnly&&context.playerId&&!playerParticipates(getPlayer(context.playerId)))continue;const h=effectHandlers[e.type];if(!h){console.warn('Unknown Tides effect',e);continue}const row=h(e,context);if(row)rows.push(row)}return rows}
function resolveCurrentEvent(){const id=currentEventId(),event=currentEvent();if(!event||state.resolvedEvents[id])return state.resolvedEvents[id]||null;if(playersLeftToVote(id).length)return null;let result;
  if(event.voteType==='ship'){
    const ships={};for(const ship of state.ships){const participants=presentPlayers().filter(p=>p.shipId===ship.id);const tally=tallyChoices(participants,event,id);if(!tally.winner)return null;ships[ship.id]={...tally,outcome:event.outcomes?.[tally.winner]||'',consequences:applyEffects(event.consequences?.[tally.winner]||[],{shipId:ship.id})}}result={type:'ship',eventId:id,ships};
  }else{const tally=tallyChoices(presentPlayers(),event,id);if(!tally.winner)return null;result={type:'fleet',eventId:id,...tally,outcome:event.outcomes?.[tally.winner]||'',consequences:applyEffects(event.consequences?.[tally.winner]||[],{})}}
  state.resolvedEvents[id]=result;recordDecision(event,result);saveState(true);return result}
function recordDecision(event,result){if(state.journal.some(e=>e.eventId===currentEventId()&&e.type==='decision'))return;const votes=clone(eventVotes());let text;if(result.type==='ship')text=state.ships.map(s=>`${s.name}: ${event.outcomes?.[result.ships[s.id].winner]||''}`).join(' ');else text=result.outcome;state.journal.push({id:uid('j'),eventId:currentEventId(),type:'decision',session:state.session.number,title:event.title,text,votes,result:clone(result),createdAt:nowIso()})}
function journal(type,title,text,extra={}){state.journal.push({id:uid('j'),type,session:state.session?.number||state.chapterProgress||1,title,text,createdAt:nowIso(),...extra})}
function continueEvent(){const p=currentPlayer(),id=currentEventId();if(!playerParticipates(p))return toast('Absent players do not need to continue.');state.continueReady[id] ||= {};state.continueReady[id][p.id]=true;const left=playersLeftToContinue(id);if(left.length){saveState();renderOverview();return toast(`Waiting for ${left.map(x=>x.name).join(', ')}.`)}
  // Build recap snippets for anyone absent during the decision.
  state.players.filter(x=>state.session.attendance[x.id]==='absent').forEach(x=>{const ev=currentEvent(),r=state.resolvedEvents[id];state.absenceRecaps[x.id]=`${ev.title}: ${r?.type==='fleet'?r.outcome:'Your shipmates resolved the decision while you were away.'}`});
  const next=nextEventId();if(next){state.currentEventId=next;ensureSession();saveState(true);renderAll();toast('Next decision ready.')}else{saveState();renderAll();toast('No further demo event is loaded. Add the next event in story.js.')}}

function checkRoll({playerId=currentPlayer().id,stat='Seamanship',equipmentBonus=0,abilityBonus=0,difficulty=12,danger='Safe',label='Check'}={}){const p=getPlayer(playerId),roll=1+Math.floor(Math.random()*20),statValue=Number(p.stats[stat]||0),total=roll+statValue+Number(equipmentBonus||0)+Number(abilityBonus||0),success=roll===20||total>=Number(difficulty),criticalFail=roll===1,death=criticalFail&&danger==='Lethal';if(death)killCharacter(p,`${p.name} died attempting a clearly lethal action: ${label}.`);const result={roll,total,success:death?false:success,natural20:roll===20,natural1:roll===1,death,playerId:p.id,stat,difficulty,danger,label,createdAt:nowIso()};journal('check',label,`${p.name} rolled ${roll} (${total} total) against ${difficulty}: ${death?'death':result.success?'success':'failure'}.`,{playerId:p.id,check:result});saveState();return result}

function renderOverview(){ensureSession();const screen=$('#screen-overview'),ev=currentEvent(),p=currentPlayer(),id=currentEventId(),resolution=state.resolvedEvents[id]||resolveCurrentEvent(),existing=eventVotes(id)[p.id],available=clamp(p.influence+Number(existing?.influence||0),0,INFLUENCE_CAP),left=resolution?playersLeftToContinue(id):playersLeftToVote(id),participates=playerParticipates(p),choices=visibleChoices(ev,p),recap=state.absenceRecaps[p.id];let pendingChoice=existing?.choiceId||choices[0]?.id||null,pendingInfluence=Number(existing?.influence||0);

function isoHexPoints(cx,cy,size=52,yScale=.60){return Array.from({length:6},(_,i)=>{const a=(Math.PI/180)*(60*i-30);return`${cx+size*Math.cos(a)},${cy+size*Math.sin(a)*yScale}`}).join(' ')}

function moveFleet(key,{force=false}={}){const from=state.map.shipPositions[state.ships[0].id]||'0,0';if(!force&&axialDistance(from,key)>1)return toast('The fleet can only move one hex at a time.');if(!state.map.revealed.includes(key))return toast('Reveal that hex before sailing into it.');state.ships.forEach(s=>state.map.shipPositions[s.id]=key);state.map.selected=key;journal('discovery',`Fleet moved to ${state.map.locations[key]?.name||key}`,`Both ships entered hex ${key}.`);saveState();renderAll();return true}
function renderMap(){const screen=$('#screen-map');screen.innerHTML=`<div class="map-layout"><div class="panel map-panel"><div class="map-toolbar"><button class="secondary-btn" id="zoomIn">＋</button><button class="secondary-btn" id="zoomOut">−</button><button class="secondary-btn" id="mapReset">Reset</button></div><div class="map-tag">Drag · wheel to zoom</div><svg id="hexMap" viewBox="${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}" aria-label="Campaign map"><defs><filter id="fogBlur"><feGaussianBlur stdDeviation="7"/></filter><radialGradient id="fog"><stop stop-color="#627987" stop-opacity=".2"/><stop offset="1" stop-color="#07131a" stop-opacity="0"/></radialGradient></defs><g id="mapWorld"></g></svg></div><aside class="panel map-side"><div id="mapInfo"></div></aside></div>`;
  const world=$('#mapWorld',screen),cx=900,cy=500,size=52,ys=.60,cells=[];for(let q=-8;q<=8;q++)for(let r=-7;r<=7;r++){if(Math.abs(q+r)>10)continue;const x=cx+Math.sqrt(3)*size*(q+r/2),y=cy+1.5*size*r*ys;cells.push({q,r,key:`${q},${r}`,x,y})}const by=Object.fromEntries(cells.map(c=>[c.key,c])),land=new Set(['-4,2','-4,3','-3,2','-3,3','-2,-2','-2,-1','-1,-2','-1,-1','-1,2','-1,3','0,0','0,1','1,0','1,1','3,-2','3,-1','4,-2']),shoal=new Set(['-5,2','-4,1','-3,-2','-2,-3','0,2','1,2','2,1','2,2','3,1','4,-1','5,-2']);let html=`<text x="420" y="280" class="map-world-label">The Morrow Sea</text><text x="1180" y="690" class="map-world-label">Tempest Reach</text>`;

  cells.forEach(c=>{const revealed=state.map.revealed.includes(c.key),loc=state.map.locations[c.key],terrain=land.has(c.key)?'land':shoal.has(c.key)?'shoal':'sea',selected=state.map.selected===c.key;let fill=revealed?(terrain==='land'?'rgba(128,116,77,.48)':terrain==='shoal'?'rgba(29,92,93,.73)':`rgba(${18+(c.q%3+3)%3*4},${58+(c.r%4+4)%4*3},${72+(c.q%4+4)%4*4},.88)`):'rgba(5,15,22,.74)';html+=`<g class="hex" data-key="${c.key}" tabindex="0"><polygon class="hex-face" points="${isoHexPoints(c.x,c.y,size,ys)}" fill="${fill}" stroke="${selected?'#e0b66d':revealed?'rgba(209,184,130,.16)':'rgba(104,129,139,.08)'}" stroke-width="${selected?3:1}"/>${revealed&&terrain==='sea'?`<path d="M${c.x-16} ${c.y+2}q8-5 16 0t16 0" fill="none" stroke="rgba(189,221,222,.16)" pointer-events="none"/>`:''}${revealed&&terrain==='land'?`<path d="M${c.x-23} ${c.y+5}q12-22 30-12q14 7 10 22q-18 13-40 0z" fill="rgba(183,162,105,.38)" stroke="rgba(232,208,145,.18)" pointer-events="none"/>`:''}${revealed&&loc?`<circle cx="${c.x}" cy="${c.y-5}" r="${loc.type==='Port'?6:4}" fill="${loc.type==='Hazard'?'#bd6655':loc.type==='Port'?'#d3ad68':'#a7bdad'}"/><text x="${c.x}" y="${c.y+18}" text-anchor="middle" class="map-small-label">${safe(loc.name)}</text>`:''}${!revealed?`<ellipse class="map-fog" cx="${c.x}" cy="${c.y}" rx="45" ry="28" fill="url(#fog)"/>`:''}</g>`});

  const renderInfo=()=>{const loc=state.map.locations[state.map.selected],revealed=state.map.revealed.includes(state.map.selected),fleetHere=state.map.selected===fleetKey;$('#mapInfo',screen).innerHTML=`<div class="eyebrow">Selected hex</div><h2 style="font:1.45rem Georgia,serif;margin:7px 0 4px;color:#e7c88f">${revealed?safe(loc?.name||'Open Water'):'Uncharted Water'}</h2><div class="muted">${safe(state.map.selected)}${fleetHere?' · Fleet here':''}</div><p style="line-height:1.5;color:#c7c6c0">${revealed?safe(loc?.note||'No notable landmark is recorded here.'):'Fog and incomplete charts hide what lies here.'}</p>${loc?.art?`<div class="art-frame" style="height:130px;border-radius:9px">${artMarkup(loc,'event',loc.name)}</div>`:''}`};
  const selectKey=k=>{state.map.selected=k;saveState();$$('.hex',screen).forEach(g=>{const poly=$('.hex-face',g),sel=g.dataset.key===k;poly.setAttribute('stroke',sel?'#e0b66d':state.map.revealed.includes(g.dataset.key)?'rgba(209,184,130,.16)':'rgba(104,129,139,.08)');poly.setAttribute('stroke-width',sel?'3':'1')});renderInfo()};$$('.hex',screen).forEach(g=>{g.onclick=()=>selectKey(g.dataset.key);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectKey(g.dataset.key)}}});renderInfo();
  const svg=$('#hexMap',screen),apply=()=>svg.setAttribute('viewBox',`${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}`),zoom=f=>{const nw=clamp(mapView.w*f,700,2800),nh=nw*1000/1800;mapView.x+=(mapView.w-nw)/2;mapView.y+=(mapView.h-nh)/2;mapView.w=nw;mapView.h=nh;apply()};svg.onwheel=e=>{e.preventDefault();zoom(e.deltaY>0?1.1:.9)};let ptr=null;svg.onpointerdown=e=>{ptr={id:e.pointerId,x:e.clientX,y:e.clientY,vx:mapView.x,vy:mapView.y,moved:false,captured:false}};svg.onpointermove=e=>{if(!ptr||ptr.id!==e.pointerId)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;if(Math.hypot(dx,dy)>5)ptr.moved=true;if(ptr.moved){if(!ptr.captured){try{svg.setPointerCapture(e.pointerId);ptr.captured=true}catch{}}svg.classList.add('dragging');mapView.x=ptr.vx-dx*mapView.w/svg.clientWidth;mapView.y=ptr.vy-dy*mapView.h/svg.clientHeight;apply()}};svg.onpointerup=e=>{if(ptr?.id===e.pointerId){if(ptr.captured&&svg.hasPointerCapture?.(e.pointerId))try{svg.releasePointerCapture(e.pointerId)}catch{}svg.classList.remove('dragging');ptr=null}};$('#zoomIn',screen).onclick=()=>zoom(.85);$('#zoomOut',screen).onclick=()=>zoom(1.18);$('#mapReset',screen).onclick=()=>{mapView={x:0,y:0,w:1800,h:1000};apply()};
}

function renderHold(ship,{editable=false,compact=false,damageMode=false}={}){const cell=compact?34:46,cells=Array.from({length:HOLD_COLS*HOLD_ROWS},(_,i)=>`<div class="hold-cell" data-hold-x="${i%HOLD_COLS}" data-hold-y="${Math.floor(i/HOLD_COLS)}" style="grid-column:${i%HOLD_COLS+1};grid-row:${Math.floor(i/HOLD_COLS)+1}"></div>`).join(''),items=ship.hold.items.flatMap(item=>itemRelativeCells(item).map(rel=>`<div class="cargo-item ${safe(item.kind||'cargo')}" draggable="${editable?'true':'false'}" data-cargo-id="${safe(item.id)}" data-rel-x="${rel.x}" data-rel-y="${rel.y}" style="grid-column:${item.x+rel.x+1};grid-row:${item.y+rel.y+1}" title="${safe(item.name)}${editable?' · right-click to rotate':''}"><span class="cargo-cell-icon">${itemSvg(item)}</span><span class="cargo-cell-label">${safe(item.name)}</span></div>`)).join(''),damage=ship.hold.damagePieces.flatMap(piece=>damageCells(piece).map((c,i)=>`<div class="damage-cell" style="grid-column:${c.x+1};grid-row:${c.y+1}" title="${safe(piece.shape)} damage">${i===0?'×':''}</div>`)).join(''),u=holdUsage(ship);return `<div class="hold-stage"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="eyebrow">Hold ${u.occupied}/${u.usable}</span><span class="muted" style="font-size:.7rem">${editable?'Drag · right-click rotates':''}</span></div>${holdFillMarkup(ship)}<div class="ship-hold-cutaway"><div class="hold-deck-label">Lower hold · ${damageMode?'choose damage origin':'8 × 5'}</div><div class="hold-grid ${editable?'editable':''}" data-editable-hold="${editable}" data-damage-mode="${damageMode}" style="--hold-cell:${cell}px;grid-template-columns:repeat(8,var(--hold-cell));grid-template-rows:repeat(5,var(--hold-cell))">${cells}${items}${damage}</div></div></div>`}
function attachHoldInteractions(ship,root){const grid=$('[data-editable-hold="true"]',root);if(!grid)return;let drag=null;const clear=()=>$$('.hold-cell',grid).forEach(c=>c.classList.remove('drop-valid','drop-invalid','drop-hover')),preview=(item,x,y,ox=0,oy=0)=>{const nx=x-ox,ny=y-oy,proposed=itemCells(item,item.rotation||0,nx,ny),valid=validCargoPlacement(ship,item,nx,ny);clear();proposed.forEach(pos=>{const c=$(`.hold-cell[data-hold-x="${pos.x}"][data-hold-y="${pos.y}"]`,grid);if(c)c.classList.add(valid?'drop-valid':'drop-invalid')});return{valid,nx,ny}};
  grid.addEventListener('contextmenu',e=>{const el=e.target.closest('.cargo-item');if(!el)return;e.preventDefault();const item=ship.hold.items.find(i=>i.id===el.dataset.cargoId),rotation=((item.rotation||0)+1)%4;if(validCargoPlacement(ship,item,item.x,item.y,rotation)){item.rotation=rotation;saveState();renderAll();toast(`${item.name} rotated.`)}else toast('Rotation blocked by the hull, cargo, or damage.')});
  grid.addEventListener('click',e=>{const cargo=e.target.closest('.cargo-item');if(cargo){const item=ship.hold.items.find(i=>i.id===cargo.dataset.cargoId);return showItemPopover(item,cargo)}if(damagePlacementMode){const cell=e.target.closest('.hold-cell');if(!cell)return;const pending=state.pendingDamage.find(x=>x.id===damagePlacementMode.pendingId);if(pending&&placePendingDamage(pending,Number(cell.dataset.holdX),Number(cell.dataset.holdY))){renderAll();toast('Damage placement recorded.')}else toast('That damage piece does not fit there.')}});
  grid.addEventListener('dragstart',e=>{const el=e.target.closest('.cargo-item');if(!el)return;drag={id:el.dataset.cargoId,ox:Number(el.dataset.relX)||0,oy:Number(el.dataset.relY)||0};e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move';$$(`.cargo-item[data-cargo-id="${drag.id}"]`,grid).forEach(x=>x.classList.add('dragging'))});grid.addEventListener('dragend',()=>{if(drag)$$(`.cargo-item[data-cargo-id="${drag.id}"]`,grid).forEach(x=>x.classList.remove('dragging'));drag=null;clear()});grid.addEventListener('dragover',e=>{e.preventDefault();const id=drag?.id||e.dataTransfer.getData('text/plain'),item=ship.hold.items.find(i=>i.id===id),cell=e.target.closest('.hold-cell');if(item&&cell)preview(item,Number(cell.dataset.holdX),Number(cell.dataset.holdY),drag?.ox||0,drag?.oy||0)});grid.addEventListener('drop',e=>{e.preventDefault();const id=drag?.id||e.dataTransfer.getData('text/plain'),item=ship.hold.items.find(i=>i.id===id),cell=e.target.closest('.hold-cell');if(!item||!cell)return clear();const pr=preview(item,Number(cell.dataset.holdX),Number(cell.dataset.holdY),drag?.ox||0,drag?.oy||0);if(!pr.valid){clear();return toast('That placement does not fit.')}item.x=pr.nx;item.y=pr.ny;saveState();renderAll();toast('Cargo snapped into place.')});
}
function showItemPopover(item,anchor){closePopover();const f=footprint(item),craft=recipeList().filter(r=>(r.ingredients||[]).some(ing=>ingredientMatches(item,ing))).map(r=>r.name).join(', ')||'None known';popoverEl=document.createElement('div');popoverEl.className='popover';popoverEl.innerHTML=`<button class="close-x" aria-label="Close">×</button><h3>${safe(item.name)}</h3><div class="muted" style="font-size:.78rem;line-height:1.45">${safe(item.description||'No description.')}</div><dl><dt>Category</dt><dd>${safe(item.category||'Cargo')}</dd><dt>Footprint</dt><dd>${f.cells} cell${f.cells===1?'':'s'} · ${f.w}×${f.h}</dd><dt>Use</dt><dd>${safe(item.use||item.tags?.join(', ')||'Story/crafting dependent')}</dd>${item.owner?`<dt>Owner</dt><dd>${safe(getPlayer(item.owner)?.name||item.owner)}</dd>`:''}<dt>Crafting</dt><dd>${safe(craft)}</dd></dl>`;document.body.appendChild(popoverEl);const r=anchor.getBoundingClientRect();popoverEl.style.left=`${clamp(r.right+8,12,window.innerWidth-350)}px`;popoverEl.style.top=`${clamp(r.top,12,window.innerHeight-260)}px`;$('.close-x',popoverEl).onclick=closePopover}
function closePopover(){popoverEl?.remove();popoverEl=null}

function upgradeMarkup(ship){return `<div class="upgrade-grid">${(ship.upgrades||[]).map(u=>`<div class="upgrade-card ${/occult|special/i.test(u.category)?'occult':''}"><div class="upgrade-slot">${safe(u.category||'Utility')}</div><div class="upgrade-name">${safe(u.name)}</div><div class="muted" style="font-size:.72rem;line-height:1.4;margin-top:5px">${safe(u.description||'')}</div></div>`).join('')||'<div class="muted">No installed upgrades.</div>'}</div>`}
function conditionMarkup(list=[]){return list.map(c=>`<span class="condition-pill" title="${safe(c.description||'')}">${safe(c.name)}</span>`).join('')}
function magicMarkup(p){const groups=[['gifts','Gifts'],['curses','Curses'],['oaths','Oaths'],['relics','Relics']].filter(([k])=>p[k]?.length);if(!groups.length)return'';return groups.map(([k,label])=>`<div style="margin-top:10px"><div class="eyebrow">${label}</div>${p[k].map(id=>{const d=supernaturalDef(k,id);return `<span class="magic-pill" title="${safe(d.description)}">${safe(d.name)}</span>`}).join('')}</div>`).join('')}
function renderDetails(){activeDetailsShipId ||= state.ships[0]?.id;const ship=getShip(activeDetailsShipId)||state.ships[0],players=state.players.filter(p=>p.shipId===ship.id),cap=getPlayer(ship.captainId);activeDetailsPlayerId ||= players[0]?.id;let selected=getPlayer(activeDetailsPlayerId);if(!selected||selected.shipId!==ship.id)selected=players[0];const screen=$('#screen-details');screen.innerHTML=`<div class="details-shell"><div class="subtabs">${state.ships.map(s=>`<button class="subtab ${s.id===ship.id?'active':''}" data-ship="${s.id}">${safe(s.name)}</button>`).join('')}</div><div class="details-grid"><aside class="panel details-panel"><div class="ship-portrait">${artMarkup(ship,'ship',ship.name)}</div><div class="ship-title-block"><h1>${safe(ship.name)}</h1><div class="captain-line">Captain ${safe(cap?.name||'Unassigned')}</div></div>${['Hull','Firepower','Speed','Morale'].map(stat=>`<div class="stat-row"><span>${stat}</span>${pips(ship.stats[stat],stat==='Morale'?10:5,ship.color==='red'?'red':'blue')}<strong>${ship.stats[stat]}</strong></div>`).join('')}<h2 class="panel-title" style="margin-top:18px">Reputation</h2>${Object.entries(ship.reputation||{}).map(([f,v])=>`<div class="reputation-row"><span>${safe(f)}</span><strong>${v>0?'+':''}${v}</strong></div>`).join('')||'<div class="muted">No ship-specific reputation.</div>'}${ship.conditions?.length?`<h2 class="panel-title" style="margin-top:18px">Conditions</h2>${conditionMarkup(ship.conditions)}`:''}</aside><section class="panel details-panel"><h2 class="panel-title">Cargo & Damage</h2>${renderHold(ship,{editable:false})}<h2 class="panel-title" style="margin-top:20px">Installed Upgrades</h2>${upgradeMarkup(ship)}</section><aside class="panel details-panel"><h2 class="panel-title">Crew</h2>${players.map(p=>`<button class="player-select-card ${selected?.id===p.id?'active':''}" data-player="${p.id}">${portraitMarkup(p)}<div><div class="player-name">${safe(p.name)}${p.alive===false?' †':''}</div><div class="player-role">${safe(p.role||'Sailor')}</div></div></button>`).join('')}<div style="border-top:1px solid rgba(255,255,255,.07);margin:14px 0"></div>${selected?playerInspectMarkup(selected):''}</aside></div></div>`;$$('[data-ship]',screen).forEach(b=>b.onclick=()=>{activeDetailsShipId=b.dataset.ship;activeDetailsPlayerId=null;renderDetails()});$$('[data-player]',screen).forEach(b=>b.onclick=()=>{activeDetailsPlayerId=b.dataset.player;renderDetails()});attachInspectionClicks(screen)}
function playerInspectMarkup(p){return `<div style="display:flex;gap:11px;align-items:center">${portraitMarkup(p,56)}<div><div style="font:1.2rem Georgia,serif;color:#e7c88f">${safe(p.name)}</div><div class="muted">${safe(p.role||'Sailor')} · ${workload(p)} workload</div></div></div><div class="job-chip-row">${(p.jobs||[]).map(j=>`<span class="job-chip">${safe(j)}</span>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0">${PLAYER_STATS.map(k=>`<div class="job-card"><span class="muted">${k}</span> <strong style="float:right">${p.stats[k]}</strong></div>`).join('')}</div><div class="resource">Influence ${p.influence} · <span class="resource gold">Gold ${p.gold}</span></div>${p.equipment?.length?`<h3 class="panel-title" style="margin-top:16px">Equipment</h3><div class="inventory-list">${p.equipment.map(eq=>`<button class="inventory-item" data-eq="${eq.id}"><span>${safe(eq.name)}</span><span class="muted">${safe(eq.category)}</span></button>`).join('')}</div>`:''}${p.conditions?.length?`<h3 class="panel-title" style="margin-top:16px">Conditions</h3>${conditionMarkup(p.conditions)}`:''}${p.abilities?.length?`<h3 class="panel-title" style="margin-top:16px">Abilities</h3>${p.abilities.map(a=>`<div class="muted" style="margin:7px 0"><strong style="color:#d7c6a5">${safe(a.name)}</strong><br>${safe(a.description)}</div>`).join('')}`:''}${magicMarkup(p)}`}
function attachInspectionClicks(screen){$$('[data-eq]',screen).forEach(btn=>btn.onclick=()=>{const p=getPlayer(activeDetailsPlayerId),eq=p?.equipment.find(e=>e.id===btn.dataset.eq);if(eq)showEquipmentModal(eq,p)})}
function showEquipmentModal(eq,p){showModal(`${eq.name}`,`<div class="art-frame" style="height:150px;border-radius:10px">${artMarkup(eq,eq.magical?'event':'generic',eq.name)}</div><p>${safe(eq.description||'')}</p><div class="job-chip-row"><span class="tag-pill">${safe(eq.category)}</span><span class="tag-pill">${safe(eq.rarity)}</span>${eq.magical?'<span class="magic-pill">strange</span>':''}${(eq.tags||[]).map(t=>`<span class="tag-pill">${safe(t)}</span>`).join('')}</div><p class="muted">Owner: ${safe(p.name)}${eq.charges!=null?` · Charges: ${eq.charges}`:''}</p>`) }

function roleJobCard(job,p,ship){const info=JOB_INFO[job],tier=['','I','II','III'][info.tier];let body='';
  if(job==='Captaincy'){const configs=CREW_CONFIGS[shipCrew(ship).length]||[];body=`<div class="config-grid">${configs.map(c=>`<button class="secondary-btn" data-config="${c.id}" ${ship.crewConfiguration===c.id?'disabled':''}>${safe(c.name)}${ship.crewConfiguration===c.id?' · active':''}</button>`).join('')}</div><div class="muted" style="margin-top:7px;font-size:.72rem">Captain remains ${safe(getPlayer(ship.captainId)?.name||'unchanged')} when the watch changes.</div>`}

lass="panel-title" style="margin-top:18px">Downtime</h2><div class="job-card"><select id="downtimeAction" style="width:100%">${downtimeOptions(p).map(a=>`<option ${state.downtime[p.id]===a?'selected':''}>${safe(a)}</option>`).join('')}</select><button class="secondary-btn" id="downtimeBtn" style="margin-top:8px">Save action</button></div>${notesMarkup(p)}`:''}</aside></div>`;attachRoleActions(p,ship,screen)}
function downtimeOptions(p){const base=['Recover','Train','Investigate','Improve a relationship','Work with the crew','Study a relic'];if(hasJob(p,'Crafting'))base.push('Craft');if(hasJob(p,'Repairs'))base.push('Repair');if(hasJob(p,'Trade'))base.push('Trade');return[...new Set(base)]}
function attachRoleActions(p,ship,screen){attachHoldInteractions(ship,screen);$$('[data-ability]',screen).forEach(b=>b.onclick=()=>{state.abilityUses[`${state.session.id}:${p.id}:${b.dataset.ability}`]=true;saveState();renderRole();toast('Ability marked used.')});$$('[data-config]',screen).forEach(b=>b.onclick=()=>applyCrewConfiguration(ship,b.dataset.config));$$('[data-craft]',screen).forEach(b=>b.onclick=()=>{const r=craftRecipe(p,ship,b.dataset.craft);toast(r.message);if(r.ok)renderAll()});
  const bind=(id,fn)=>{const el=$(`#${id}`,screen);if(el)el.onclick=fn};bind('useRumBtn',()=>{const r=consumeRum(ship);toast(r.message);if(r.ok){journal('story','Rum for the crew',`${ship.name} used one Rum to raise Morale.`);saveState();renderAll()}});bind('revealHexBtn',()=>{if(!state.map.revealed.includes(state.map.selected)){state.map.revealed.push(state.map.selected);journal('discovery',`Hex ${state.map.selected} charted`,`${p.name} revealed the selected hex.`);saveState();renderAll();toast('Selected hex revealed.')}});bind('moveFleetBtn',()=>moveFleet(state.map.selected));bind('repairDamageBtn',()=>{const id=$('#repairDamageSelect',screen).value;applyEffects([{type:'repairDamage',targetId:ship.id,damageId:id}]);journal('story',`Repairs aboard ${ship.name}`,'A section of hold damage was repaired.');saveState();renderAll();toast('Damage repaired.')});bind('placeDamageBtn',()=>{const pending=state.pendingDamage.find(d=>d.shipId===ship.id);if(!pending)return;damagePlacementMode={shipId:ship.id,pendingId:pending.id};renderRole();toast('Choose the top-left/origin cell for the damage piece.')});bind('prepareGunsBtn',()=>{state.flags[`gunsPrepared:${state.session.id}:${ship.id}`]=true;journal('session','Guns prepared',`${p.name} prepared ${ship.name} for a gunnery action.`,{playerId:p.id,shipId:ship.id});saveState();renderRole();toast(`${ship.name} is prepared for the next gunnery action.`)});bind('boardingPrepBtn',()=>{state.flags[`boardingPrepared:${state.session.id}:${ship.id}`]=true;saveState();renderRole();toast('Boarding party prepared for the next suitable encounter.')} );bind('crewDrillBtn',()=>{const key=`crewDrill:${state.session.id}:${ship.id}`;if(state.flags[key])return toast('The crew has already drilled this session.');state.flags[key]=true;if(ship.crew.unrest>0)ship.crew.unrest--;else ship.crew.quality=clamp(ship.crew.quality+1,0,5);journal('session','Crew drill',`${p.name} drilled ${ship.name}'s crew.`,{playerId:p.id,shipId:ship.id});saveState();renderAll();toast('Crew drill completed.')} );bind('toggleHiddenBtn',()=>{const id=$('#smuggleCargo',screen).value,item=ship.hold.items.find(i=>i.id===id);if(item){item.hidden=!item.hidden;saveState();renderRole();toast(`${item.name} ${item.hidden?'hidden':'returned to normal stowage'}.`)}});
  bind('loanEqBtn',()=>{const [ownerId,eqId]=($('#loanEqSelect',screen)?.value||'').split('|'),target=getPlayer($('#loanTarget',screen)?.value),owner=getPlayer(ownerId),idx=owner?.equipment.findIndex(e=>e.id===eqId);if(!owner||!target||idx<0||owner.shipId!==target.shipId)return toast('Equipment can only be loaned within the same ship.');const [eq]=owner.equipment.splice(idx,1);eq.owner=target.id;target.equipment.push(eq);saveState();renderAll();toast(`${eq.name} loaned to ${target.name}.`) });
  bind('sendNoteBtn',()=>{const text=$('#noteText',screen).value.trim(),toId=$('#noteRecipient',screen).value;if(!text)return toast('Write a note first.');state.privateNotes.push({id:uid('note'),fromId:p.id,toId,text,createdAt:nowIso()});saveState();renderRole();toast('Private note sent.')});bind('downtimeBtn',()=>{state.downtime[p.id]=$('#downtimeAction',screen).value;saveState();renderRole();toast('Downtime action saved.')});bind('rollCheckBtn',()=>{const face=$('#d20Face',screen),btn=$('#rollCheckBtn',screen);btn.disabled=true;face.classList.remove('rolling');void face.offsetWidth;face.classList.add('rolling');setTimeout(()=>{const r=checkRoll({playerId:p.id,stat:$('#checkStat',screen).value,difficulty:Number($('#checkDifficulty',screen).value),danger:$('#checkDanger',screen).value,label:$('#checkLabel',screen).value||'Story check'});face.textContent=r.roll;$('#checkResult',screen).textContent=r.death?'Natural 1 · lethal consequence':r.natural20?'Natural 20 · success':`${r.roll} + ${p.stats[r.stat]} = ${r.total} · ${r.success?'success':'failure'}`;btn.disabled=false;if(r.death)setTimeout(renderAll,450)},540)});bind('createReplacementBtn',()=>{const name=$('#replacementName',screen).value.trim();if(!name)return toast('Give the replacement a name.');replaceCharacter(p.id,{name,goal:$('#replacementGoal',screen).value.trim()});renderAll();toast(`${name} joined the crew.`)});
  $$('[data-runner]',screen).forEach(b=>b.onclick=()=>runRunnerControl(currentEvent().runnerControls[Number(b.dataset.runner)],p));
