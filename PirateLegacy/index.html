function runRunnerControl(ctrl,p){if(!ctrl)return;if(ctrl.type==='revealText')showModal(ctrl.label||'Runner reveal',`<p>${safe(ctrl.text||'')}</p>`);else if(ctrl.type==='setFlag'){state.flags[ctrl.flag]=ctrl.value??true;saveState();toast('Story condition marked.')}else if(ctrl.type==='check'){const r=checkRoll({...ctrl.check,playerId:ctrl.check?.playerId||p.id});showModal(ctrl.label||'Check',`<p>Rolled <strong>${r.roll}</strong> · ${r.success?'success':'failure'}.</p>`)}else if(ctrl.type==='effects'){applyEffects(ctrl.effects||[],{playerId:p.id,shipId:p.shipId});saveState();renderAll();toast('Configured consequence applied.')}}

function renderJournal(){const screen=$('#screen-journal'),types=['all','decision','story','discovery','character','crafting','upgrade','magic','check','session','system'];screen.innerHTML=`<div class="journal-layout"><aside class="panel journal-nav"><h2 class="panel-title">Journal</h2>${types.map((t,i)=>`<button class="journal-filter ${i===0?'active':''}" data-filter="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}<div style="border-top:1px solid rgba(255,255,255,.07);margin:16px 0"></div><div class="eyebrow">Fleet reputation</div>${Object.entries(state.reputation.fleet).map(([f,v])=>`<div class="reputation-row"><span>${safe(f)}</span><strong>${v>0?'+':''}${v}</strong></div>`).join('')}${debugEnabled()?debugMarkup():''}</aside><section class="panel journal-main"><div id="journalEntries"></div></section></div>`;const show=filter=>{const entries=state.journal.filter(e=>filter==='all'||e.type===filter).slice().reverse();$('#journalEntries',screen).innerHTML=entries.map(e=>`<article class="journal-entry"><h3>${safe(e.title)}</h3><div class="journal-meta">Session ${safe(e.session??'—')} · ${safe(e.type)}</div><p>${safe(e.text||'')}</p>${e.type==='decision'&&e.eventId?`<button class="secondary-btn" data-open-decision="${safe(e.id)}">Open decision record</button>`:''}</article>`).join('')||'<div class="empty-note">No entries.</div>';$$('[data-open-decision]',screen).forEach(b=>b.onclick=()=>openDecisionRecord(b.dataset.openDecision))};show('all');$$('[data-filter]',screen).forEach(b=>b.onclick=()=>{$$('[data-filter]',screen).forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.filter)});attachDebug(screen)}
function openDecisionRecord(id){const e=state.journal.find(x=>x.id===id),event=STORY.events?.[e?.eventId];if(!e||!event)return;const votes=e.votes||{},rows=Object.entries(votes).map(([pid,v])=>`<div class="journal-vote-row"><span>${safe(getPlayer(pid)?.name||pid)}</span><span>${safe(choiceById(event,v.choiceId)?.title||v.choiceId)}</span><strong>${Number(v.influence||0)} Influence</strong></div>`).join('');showModal(event.title,`<p>${safe(event.setup||'')}</p><div class="eyebrow">What won</div><p>${safe(e.result?.type==='fleet'?choiceById(event,e.result.winner)?.title:'Each ship resolved separately')}</p><div class="eyebrow">Votes</div><div class="journal-votes">${rows}</div><div class="eyebrow" style="margin-top:14px">Outcome</div><p>${safe(e.text)}</p>`)}
function debugEnabled(){let stored=false;try{stored=localStorage.getItem('tidesDebug')==='1'}catch{}return /(?:\?|&)debug=1(?:&|$)/.test(location.search)||stored}
function validateState(){const errors=[];state.ships.forEach(s=>{if(!getPlayer(s.captainId))errors.push(`${s.name}: missing captain ${s.captainId}`);if(s.hold.columns!==8||s.hold.rows!==5)errors.push(`${s.name}: hold is not 8×5`);const occupied=new Set;for(const item of s.hold.items){for(const c of itemCells(item)){const k=`${c.x},${c.y}`;if(c.x<0||c.y<0||c.x>=8||c.y>=5)errors.push(`${s.name}: ${item.name} out of bounds`);if(occupied.has(k))errors.push(`${s.name}: cargo overlap at ${k}`);occupied.add(k);if(damageSet(s.hold).has(k))errors.push(`${s.name}: cargo overlaps damage at ${k}`)}}});state.players.forEach(p=>{if(!getShip(p.shipId))errors.push(`${p.name}: missing ship ${p.shipId}`);(p.jobs||[]).forEach(j=>{if(!JOBS.includes(j))errors.push(`${p.name}: unknown job ${j}`)})});const pos=state.ships.map(s=>state.map.shipPositions[s.id]);if(new Set(pos).size>1)errors.push('Fleet ships are on different logical hexes');return errors}
function debugMarkup(){const errs=validateState();return `<div class="debug-panel"><div class="eyebrow">Developer</div><div class="${errs.length?'validation-bad':'validation-good'}" style="font-size:.72rem;margin:6px 0">${errs.length?`${errs.length} validation issue${errs.length===1?'':'s'}`:'State validates cleanly'}</div><button class="secondary-btn" id="debugDamage" style="width:100%;margin-top:5px">Queue random damage</button><button class="secondary-btn" id="debugKill" style="width:100%;margin-top:5px">Kill current character</button><button class="secondary-btn" id="debugSnapshot" style="width:100%;margin-top:5px">Create snapshot</button><button class="secondary-btn" id="debugValidate" style="width:100%;margin-top:5px">Show validation</button></div>`}
function attachDebug(screen){if(!debugEnabled())return;const bind=(id,fn)=>{const e=$(`#${id}`,screen);if(e)e.onclick=fn};bind('debugDamage',()=>{const ship=getShip(currentPlayer().shipId);state.pendingDamage.push({id:uid('pending-damage'),shipId:ship.id,shape:['I','O','T','L','J','S','Z'][Math.floor(Math.random()*7)],rotation:0,destroyCargo:false,style:'broken'});saveState();renderAll();toast('Damage queued for Repairs.')});bind('debugKill',()=>{killCharacter(currentPlayer(),'Developer death/replacement test.');saveState();renderAll()});bind('debugSnapshot',()=>toast(createSnapshot('debug')?'Snapshot saved.':'Snapshot failed.'));bind('debugValidate',()=>{const e=validateState();showModal('State validation',e.length?`<ul>${e.map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`:'<p class="validation-good">No broken references or hold overlaps found.</p>')})}

function showModal(title,html){closeModal();const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.id='tidesModal';wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${safe(title)}</h2><button class="utility-btn" data-close-modal>×</button></div>${html}</div>`;document.body.appendChild(wrap);wrap.onclick=e=>{if(e.target===wrap||e.target.closest('[data-close-modal]'))closeModal()};document.addEventListener('keydown',modalKey)}function modalKey(e){if(e.key==='Escape')closeModal()}function closeModal(){document.removeEventListener('keydown',modalKey);$('#tidesModal')?.remove()}
function exportSave(){createSnapshot('export');const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${state.saveId||'campaign'}-v7-save.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importStateObject(obj){createSnapshot('pre-import');const migrated=migrateState(clone(obj));const old=state;state=migrated;const errs=validateState();if(errs.length){state=old;throw new Error(`Import rejected: ${errs.slice(0,3).join('; ')}`)}saveState(true);renderAll();return true}
function setupSaveTools(){const parent=$('.player-switcher');if(!parent)return;const old=$('#exportSaveBtn');old.title='Save tools';old.textContent='☰';const menu=document.createElement('div');menu.className='save-menu';menu.hidden=true;menu.innerHTML=`<button id="menuExport">Export save</button><button id="menuImport">Import save</button><button id="menuSnapshot">Create backup snapshot</button><button id="menuRestore">Restore automatic backup</button><input type="file" id="importFile" accept="application/json,.json" hidden>`;parent.style.position='relative';parent.appendChild(menu);old.onclick=()=>menu.hidden=!menu.hidden;$('#menuExport',menu).onclick=()=>{menu.hidden=true;exportSave()};$('#menuImport',menu).onclick=()=>$('#importFile',menu).click();$('#menuSnapshot',menu).onclick=()=>toast(createSnapshot('manual')?'Snapshot created.':'Snapshot failed.');$('#menuRestore',menu).onclick=()=>toast(restoreBackup()?'Backup restored.':'No automatic backup available.');$('#importFile',menu).onchange=async e=>{const file=e.target.files[0];if(!file)return;try{importStateObject(JSON.parse(await file.text()));toast('Save imported and migrated.')}catch(err){console.error(err);toast(err.message||'Import failed.')}e.target.value=''};document.addEventListener('click',e=>{if(!parent.contains(e.target))menu.hidden=true})}

function v7PerformMagic(p,kind,id,push=false){const def=supernaturalDef(kind,id);if(!def)return{ok:false,message:'Unknown supernatural effect.'};const mode=push?'push':def.mode||'automatic';if(mode==='automatic'&&!push){state.abilityUses[`${state.session.id}:${p.id}:magic:${id}`]=true;journal('magic',def.name,`${p.name} invoked ${def.name}.`,{playerId:p.id});saveState();return{ok:true,message:def.description||'The strange effect takes hold.'}}if(!v7StatActive(p,'Attunement'))return{ok:false,message:'Attunement is untrained; this effect cannot be deliberately interpreted or pushed.'};const difficulty=Number(def.difficulty||13)+(push?4:0),r=checkRoll({playerId:p.id,stat:'Attunement',difficulty,danger:push?'Dangerous':'Safe',label:`${def.name}${push?' · Push':''}`});if(push&&!r.success){p.strain=clamp((p.strain||0)+1,0,3);p.secrets.push(`${def.name} pushed back: something noticed the attempt.`)}else if(r.success&&id==='salt-memory')p.secrets.push('Salt Memory: a private sensory fragment surfaced from the touched seawater.');saveState();return{ok:true,message:r.success?(def.success||'The strange effect answers.'):(def.failure||'The effect answers badly, incompletely, or at a cost.'),result:r}}

function v8Background(id){return V8_BACKGROUNDS.find(x=>x.id===id)||V8_BACKGROUNDS[0]}
function v8Ability(id){return V7_STARTING_ABILITIES.find(x=>x.id===id)||V7_STARTING_ABILITIES[0]}
function v8Latent(id){return V8_LATENTS.find(x=>x.id===id)||V8_LATENTS[0]}
function v8PlayerStats(p){const out={};for(const stat of p.activeStats||[]){out[stat]=clamp(1+Number(p.statPoints?.[stat]||0)+(p.backgroundStat===stat?1:0),1,3)}return out}
function v8PointsSpent(p){return Object.values(p.statPoints||{}).reduce((a,b)=>a+Number(b||0),0)}
function v8PointsRemaining(p){return 5-v8PointsSpent(p)}
function v8PlayerComplete(p){const bg=v8Background(p.background),bonusOk=bg.statOptions.includes(p.backgroundStat)&&p.activeStats.includes(p.backgroundStat);return Boolean(String(p.name||'').trim())&&p.activeStats.length===4&&bonusOk&&v8PointsRemaining(p)===0}
function v8ResetStatAllocation(p){p.statPoints=Object.fromEntries(PLAYER_STATS.map(k=>[k,0]));p.backgroundStat=null}
function v8ToggleActiveStat(p,stat){p.activeStats ||= [];if(p.activeStats.includes(stat)){if(p.activeStats.length<=4)return toast('A starting character needs exactly four active stats.');p.activeStats=p.activeStats.filter(x=>x!==stat);p.statPoints[stat]=0;if(p.backgroundStat===stat)p.backgroundStat=null}else{if(p.activeStats.length>=4){const old=p.activeStats[p.activeStats.length-1];p.activeStats=p.activeStats.filter(x=>x!==old);p.statPoints[old]=0;if(p.backgroundStat===old)p.backgroundStat=null}p.activeStats.push(stat)}}
function v8ChangeStatPoint(p,stat,delta){if(!p.activeStats.includes(stat))return;const current=Number(p.statPoints[stat]||0),bonus=p.backgroundStat===stat?1:0,maxExtra=2-bonus;if(delta>0&&v8PointsRemaining(p)<=0)return;if(delta<0&&current<=0)return;p.statPoints[stat]=clamp(current+delta,0,maxExtra)}
function v8ShipFrameStats(s){return clone((V8_FRAMES[s.appearance?.frame]||V8_FRAMES.balanced).stats)}
function v8DraftPlayer(i){return{id:`player-${i+1}`,name:`Sailor ${i+1}`,pronouns:'',art:'',goal:'Earn a name worth remembering.',shipIndex:i%2,background:V8_BACKGROUNDS[i%V8_BACKGROUNDS.length].id,ability:V7_STARTING_ABILITIES[i%V7_STARTING_ABILITIES.length].id,latent:'none',activeStats:[...LEGACY_PLAYER_STATS],statPoints:Object.fromEntries(PLAYER_STATS.map(k=>[k,0])),backgroundStat:null,appearance:v8PortraitDefaults(i)}}
function v8NewDraft(count=6){return{playerCount:count,ships:[0,1].map(i=>({id:i?'red-horizon':'blackwake',name:i?'Red Horizon':'Blackwake',motto:'',appearance:v8ShipAppearanceDefaults(i)})),players:Array.from({length:count},(_,i)=>v8DraftPlayer(i)),captains:[null,null],configs:[null,null]}}
let v8WizardStep=0,v8EditIndex=0;
function v8CrewCounts(){return[0,1].map(si=>v7SetupDraft.players.filter(p=>p.shipIndex===si).length)}
function v8Balance(){const c=v8CrewCounts();return{counts:c,ok:Math.abs(c[0]-c[1])<=1&&c.every(n=>n>=2&&n<=4)}}
function v8BalancedRandom(){const ps=[...v7SetupDraft.players].sort(()=>Math.random()-.5);ps.forEach((p,i)=>p.shipIndex=i%2);v7SetupDraft.captains=[null,null];v7SetupDraft.configs=[null,null]}
function v8EnsureShipChoices(){for(let si=0;si<2;si++){const crew=v7SetupDraft.players.filter(p=>p.shipIndex===si);if(!crew.some(p=>p.id===v7SetupDraft.captains[si]))v7SetupDraft.captains[si]=crew[0]?.id||null;const cfgs=CREW_CONFIGS[crew.length]||[];if(!cfgs.some(c=>c.id===v7SetupDraft.configs[si]))v7SetupDraft.configs[si]=cfgs[0]?.id||null}}
function v8RandomizeEverythingExceptName(p){v8RandomAppearance(p,Date.now()+v8EditIndex);p.background=v8SeededChoice(V8_BACKGROUNDS,`${Date.now()}:bg`).id;p.ability=v8SeededChoice(V7_STARTING_ABILITIES,`${Date.now()}:ab`).id;p.latent=v8SeededChoice(V8_LATENTS,`${Date.now()}:lat`).id;p.activeStats=[...PLAYER_STATS].sort(()=>Math.random()-.5).slice(0,4);v8ResetStatAllocation(p);const opts=v8Background(p.background).statOptions.filter(x=>p.activeStats.includes(x));p.backgroundStat=opts[0]||p.activeStats[0];let left=5;while(left>0){const candidates=p.activeStats.filter(st=>(p.statPoints[st]||0)<2-(p.backgroundStat===st?1:0));if(!candidates.length)break;const st=candidates[Math.floor(Math.random()*candidates.length)];p.statPoints[st]++;left--}}
function v8HumanOptions(arr,current){return arr.map(x=>{const id=typeof x==='string'?x:x.id,name=typeof x==='string'?v8Label(x):x.name;return`<option value="${safe(id)}" ${current===id?'selected':''}>${safe(name)}</option>`}).join('')}
function v8Field(label,html,help=''){return`<label class="v8-field"><span>${safe(label)}</span>${html}${help?`<small>${safe(help)}</small>`:''}</label>`}
function v8Select(attr,items,current){return`<select ${attr}>${v8HumanOptions(items,current)}</select>`}
function v8ColorSelect(attr,current,includeCustom=false){const items=Object.keys(V8_SHIP_COLORS).map(id=>({id,name:v8Label(id)}));if(includeCustom)items.push({id:'custom',name:'Custom'});return v8Select(attr,items,current)}

function v8RenderTitle(){document.querySelector('.v7-title')?.remove();document.querySelector('.v8-wizard')?.remove();$('.app-shell')?.classList.add('v7-hidden');const el=document.createElement('div');el.className='v7-title';el.innerHTML=`<div class="v7-title-inner"><div class="v7-title-crest">Tides</div><p class="v7-title-sub">A long-running campaign of two uneasy pirate crews, shared choices, strange water, and whatever survives the voyage.</p><div class="v7-title-actions">${v7HadStoredCampaign?'<button class="primary-btn" id="v8Continue">Continue Campaign</button>':''}<button class="primary-btn" id="v8New">New Campaign</button><button class="secondary-btn" id="v8Import">Import Campaign</button></div><button class="v7-demo-link" id="v8Demo">Development demo · Chapter 1</button><input type="file" id="v8ImportFile" accept=".json,application/json" hidden></div>`;document.body.appendChild(el);$('#v8New',el).onclick=()=>v8StartWizard();$('#v8Demo',el).onclick=()=>{state=v8MakeDemoState();saveState(true);v8EnterCampaign(false,true)};if($('#v8Continue',el))$('#v8Continue',el).onclick=()=>v8EnterCampaign(true);$('#v8Import',el).onclick=()=>$('#v8ImportFile',el).click();$('#v8ImportFile',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=migrateState(JSON.parse(await f.text()));saveState(true);v8EnterCampaign(true)}catch(err){toast(err.message||'Import failed.')}}}
function v8StartWizard(count=6){v7SetupDraft=v8NewDraft(count);v8WizardStep=0;v8EditIndex=0;document.querySelector('.v7-title')?.remove();$('.app-shell')?.classList.add('v7-hidden');v8RenderWizard()}
function v8RenderWizard(){let w=document.querySelector('.v8-wizard');if(!w){w=document.createElement('div');w.className='v8-wizard';document.body.appendChild(w)}const labels=['Crew','Ship One','Ship Two','Identity','Characters','Assignments','Review'];w.innerHTML=`<div class="v8-shell"><div class="v8-head"><button class="secondary-btn" id="v8TitleBack">← Title</button><div class="v8-progress">${labels.map((x,i)=>`<span class="${i<=v8WizardStep?'on':''}"></span>`).join('')}</div><div class="v8-step-label">${v8WizardStep+1} / ${labels.length} · ${labels[v8WizardStep]}</div></div><section class="v8-card" id="v8WizardBody"></section></div>`;$('#v8TitleBack',w).onclick=()=>{w.remove();v8RenderTitle()};[v8CrewStep,v8ShipStepOne,v8ShipStepTwo,v8IdentityStep,v8CharacterStep,v8AssignmentStep,v8ReviewStep][v8WizardStep](w)}
function v8CrewStep(w){const b=$('#v8WizardBody',w);b.innerHTML=`<h1 class="v8-title">How many people are sailing?</h1><p class="v8-sub">The fleet always begins with two balanced crews. Four to eight players keeps each ship between two and four characters.</p><div class="v8-number-grid">${[4,5,6,7,8].map(n=>`<button class="v8-number ${v7SetupDraft.playerCount===n?'on':''}" data-v8-count="${n}"><strong>${n}</strong><small>${Math.floor(n/2)} + ${Math.ceil(n/2)} crew</small></button>`).join('')}</div><div class="v8-foot"><span class="muted">You can still swap characters between ships before confirming.</span><button class="primary-btn" id="v8Next">Customize Ship One →</button></div>`;$$('[data-v8-count]',b).forEach(x=>x.onclick=()=>{const n=Number(x.dataset.v8Count);v7SetupDraft=v8NewDraft(n);v8RenderWizard()});$('#v8Next',b).onclick=()=>{v8WizardStep=1;v8RenderWizard()}}
function v8ShipStepOne(w){v8ShipEditorStep(w,0)}function v8ShipStepTwo(w){v8ShipEditorStep(w,1)}
function v8ShipEditorStep(w,si){const b=$('#v8WizardBody',w),s=v7SetupDraft.ships[si];s.appearance=v8NormalizeShipAppearance(s.appearance,si);const a=s.appearance,frame=V8_FRAMES[a.frame];b.innerHTML=`<h1 class="v8-title">Build ${si?'Ship Two':'Ship One'}</h1><p class="v8-sub">The ship preview is procedural SVG: silhouette, rig, sails, paint, flag, figurehead, wear, and later upgrades all layer independently.</p><div class="v8-ship-editor"><div class="v8-ship-stage"><div class="v8-ship-preview" id="v8ShipPreview">${shipSvg({...s,stats:v8ShipFrameStats(s),upgrades:[],hold:{damagePieces:[]}},301+si)}</div><div class="v8-ship-caption"><div><strong style="font:1.3rem Georgia,serif;color:#e7c88f" id="v8ShipNameLabel">${safe(s.name)}</strong><div class="muted" id="v8ShipMottoLabel">${safe(s.motto||'No motto')}</div></div><button class="secondary-btn" id="v8RandomShip">Randomize look</button></div><div class="v8-frame-card"><strong>${safe(frame.name)}</strong><div class="muted" style="margin:3px 0 7px">${safe(frame.text)}</div><div class="v8-frame-stats"><span>Hull ${frame.stats.Hull}</span><span>Firepower ${frame.stats.Firepower}</span><span>Speed ${frame.stats.Speed}</span><span>Morale ${frame.stats.Morale}</span></div></div></div><div class="v8-controls" id="v8ShipControls">${v8ShipFields(s)}</div></div><div class="v8-foot"><button class="secondary-btn" id="v8Back">← ${si?'Ship One':'Crew size'}</button><button class="primary-btn" id="v8Next">${si?'Character identities':'Ship Two'} →</button></div>`;v8AttachShipEditor(b,s,si);$('#v8Back',b).onclick=()=>{v8WizardStep=si?1:0;v8RenderWizard()};$('#v8Next',b).onclick=()=>{v8WizardStep=si?3:2;v8RenderWizard()};$('#v8RandomShip',b).onclick=()=>{const r=v8ShipAppearanceDefaults(Math.floor(Math.random()*2));r.hullType=v8SeededChoice(Object.keys(V8_HULLS),Date.now());r.rig=v8SeededChoice(Object.keys(V8_RIGS),Date.now()+1);r.figurehead=v8SeededChoice(V8_FIGUREHEADS,Date.now()+2);r.sailPattern=v8SeededChoice(V8_SAIL_PATTERN,Date.now()+3);r.sailCondition=v8SeededChoice(V8_SAIL_CONDITION,Date.now()+4);s.appearance=r;v8RenderWizard()}}
function v8ShipFields(s){const a=s.appearance;return`${v8Field('Ship Name',`<input data-v8-ship="name" value="${safe(s.name)}">`)}${v8Field('Motto',`<input data-v8-ship="motto" value="${safe(s.motto||'')}" placeholder="Optional">`)}<div class="v8-section-title">Hull</div>${v8Field('Mechanical Frame',v8Select('data-v8-app="frame"',Object.entries(V8_FRAMES).map(([id,v])=>({id,name:v.name})),a.frame),'Mechanical tradeoff is explicit and separate from appearance.')}${v8Field('Hull Form',v8Select('data-v8-app="hullType"',Object.entries(V8_HULLS).map(([id,v])=>({id,name:v.name})),a.hullType))}${v8Field('Stern',v8Select('data-v8-app="stern"',['high','low','squared','rounded'],a.stern))}${v8Field('Bow',v8Select('data-v8-app="bow"',['clipper','aggressive','broad-merchant'],a.bow))}${v8Field('Wood / Material',v8Select('data-v8-app="hullMaterial"',Object.keys(V8_WOOD),a.hullMaterial))}${v8Field('Painted Upper Hull',v8ColorSelect('data-v8-app="upperPaint"',a.upperPaint,true))}${v8Field('Accent Stripe',v8ColorSelect('data-v8-app="accentStripe"',a.accentStripe,true))}${v8Field('Gunport Color',v8ColorSelect('data-v8-app="gunportColor"',a.gunportColor,true))}<div class="v8-section-title">Rig and Sails</div>${v8Field('Rig',v8Select('data-v8-app="rig"',Object.entries(V8_RIGS).map(([id,v])=>({id,name:v.name})),a.rig),'Changes mast count, sail geometry, yards, and rope layout.')}${v8Field('Sail Material / Color',v8Select('data-v8-app="sailMaterial"',Object.entries(V8_SAIL_MATERIAL).map(([id,v])=>({id,name:v.name})),a.sailMaterial))}${v8Field('Sail Condition',v8Select('data-v8-app="sailCondition"',V8_SAIL_CONDITION,a.sailCondition))}${v8Field('Sail Pattern',v8Select('data-v8-app="sailPattern"',V8_SAIL_PATTERN,a.sailPattern))}<div class="v8-section-title">Identity</div>${v8Field('Figurehead',v8Select('data-v8-app="figurehead"',V8_FIGUREHEADS,a.figurehead))}${v8Field('Ship Wear',v8Select('data-v8-app="wear"',[{id:'0',name:'Fresh'},{id:'1',name:'Used'},{id:'2',name:'Weathered'},{id:'3',name:'Hard Worn'}],String(a.wear)))}${v8Field('Flag Layout',v8Select('data-v8-app="flagLayout"',V8_FLAG_LAYOUTS,a.flagLayout))}${v8Field('Flag Primary',v8ColorSelect('data-v8-app="flagPrimary"',a.flagPrimary))}${v8Field('Flag Secondary',v8ColorSelect('data-v8-app="flagSecondary"',a.flagSecondary))}${v8Field('Flag Symbol',v8Select('data-v8-app="flagSymbol"',V8_FLAG_SYMBOLS,a.flagSymbol))}`}
function v8AttachShipEditor(root,s,si){const preview=()=>{$('#v8ShipPreview',root).innerHTML=shipSvg({...s,stats:v8ShipFrameStats(s),upgrades:[],hold:{damagePieces:[]}},301+si);$('#v8ShipNameLabel',root).textContent=s.name;$('#v8ShipMottoLabel',root).textContent=s.motto||'No motto';const f=V8_FRAMES[s.appearance.frame];$('.v8-frame-card',root).innerHTML=`<strong>${safe(f.name)}</strong><div class="muted" style="margin:3px 0 7px">${safe(f.text)}</div><div class="v8-frame-stats"><span>Hull ${f.stats.Hull}</span><span>Firepower ${f.stats.Firepower}</span><span>Speed ${f.stats.Speed}</span><span>Morale ${f.stats.Morale}</span></div>`};$$('[data-v8-ship]',root).forEach(el=>el.addEventListener('input',()=>{s[el.dataset.v8Ship]=el.value;preview()}));$$('[data-v8-app]',root).forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.v8App;s.appearance[k]=k==='wear'?Number(el.value):el.value;preview()}))}
function v8IdentityStep(w){const b=$('#v8WizardBody',w);b.innerHTML=`<h1 class="v8-title">Name the crew</h1><p class="v8-sub">Start with identity and goals. Full appearance, Background, Ability, strange inclination, and stats come next one character at a time.</p><div class="v8-identities">${v7SetupDraft.players.map((p,i)=>`<div class="v8-identity"><div class="portrait" id="v8IdPortrait${i}">${p.art?`<img src="${safe(p.art)}" alt="">`:v8PortraitSvg(p)}</div><div class="v8-identity-fields">${v8Field('Character Name',`<input data-v8-id="name" data-i="${i}" value="${safe(p.name)}">`)}${v8Field('Pronouns',`<input data-v8-id="pronouns" data-i="${i}" value="${safe(p.pronouns)}" placeholder="Optional">`)}${v8Field('Portrait Art URL',`<input data-v8-id="art" data-i="${i}" value="${safe(p.art||'')}" placeholder="Optional override">`)}${v8Field('Personal Goal',`<input data-v8-id="goal" data-i="${i}" value="${safe(p.goal)}">`)}</div></div>`).join('')}</div><div class="v8-foot"><button class="secondary-btn" id="v8Back">← Ship Two</button><button class="primary-btn" id="v8Next">Customize Characters →</button></div>`;$$('[data-v8-id]',b).forEach(el=>el.addEventListener('input',()=>{const p=v7SetupDraft.players[Number(el.dataset.i)];p[el.dataset.v8Id]=el.value;if(el.dataset.v8Id==='name'){}if(el.dataset.v8Id==='art'){const box=$(`#v8IdPortrait${el.dataset.i}`,b);box.innerHTML=el.value?`<img src="${safe(el.value)}" alt="">`:v8PortraitSvg(p)}}));$('#v8Back',b).onclick=()=>{v8WizardStep=2;v8RenderWizard()};$('#v8Next',b).onclick=()=>{v8WizardStep=4;v8EditIndex=0;v8RenderWizard()}}
function v8CharacterStep(w){const b=$('#v8WizardBody',w),p=v7SetupDraft.players[v8EditIndex];p.appearance=v8NormalizeAppearance(p.appearance,v8EditIndex);b.innerHTML=`<h1 class="v8-title">Build the characters</h1><p class="v8-sub">Edit one sailor at a time. The portrait stays large and every appearance control is visible—nothing important is hidden behind an Appearance dropdown.</p><div class="v8-character-editor"><aside class="v8-crew-list">${v7SetupDraft.players.map((x,i)=>`<button class="v8-crew-button ${i===v8EditIndex?'on':''}" data-v8-edit="${i}"><span class="mini">${x.art?`<img src="${safe(x.art)}" style="width:100%;height:100%;object-fit:cover">`:v8PortraitSvg(x)}</span><span>${safe(x.name)}</span><strong class="${v8PlayerComplete(x)?'v8-status-ok':'v8-status-bad'}">${i===v8EditIndex?'●':v8PlayerComplete(x)?'✓':'!'}</strong></button>`).join('')}</aside><section class="v8-char-stage"><div class="v8-big-portrait" id="v8BigPortrait">${p.art?`<img src="${safe(p.art)}" alt="Portrait of ${safe(p.name)}">`:v8PortraitSvg(p)}</div><div class="v8-random-row"><button class="secondary-btn" id="v8RandomAppearance">Randomize Appearance</button><button class="secondary-btn" id="v8RandomAll">Randomize Everything Except Name</button></div></section><section class="v8-char-controls" id="v8CharControls">${v8CharacterFields(p)}</section></div><div class="v8-foot"><button class="secondary-btn" id="v8Back">← Identities</button><div class="v8-foot-right"><span class="${v7SetupDraft.players.every(v8PlayerComplete)?'v8-status-ok':'v8-status-bad'}" id="v8CrewComplete">${v7SetupDraft.players.filter(v8PlayerComplete).length}/${v7SetupDraft.playerCount} complete</span><button class="primary-btn" id="v8Next">Assignments →</button></div></div>`;$$('[data-v8-edit]',b).forEach(btn=>btn.onclick=()=>{v8EditIndex=Number(btn.dataset.v8Edit);v8RenderWizard()});v8AttachCharacterEditor(b,p);$('#v8RandomAppearance',b).onclick=()=>{if(!p.art)v8RandomAppearance(p);else v8RandomAppearance(p);v8UpdateCharacterEditor(b,p)};$('#v8RandomAll',b).onclick=()=>{v8RandomizeEverythingExceptName(p);v8UpdateCharacterEditor(b,p,true)};$('#v8Back',b).onclick=()=>{v8WizardStep=3;v8RenderWizard()};$('#v8Next',b).onclick=()=>{if(!v7SetupDraft.players.every(v8PlayerComplete))return toast('Finish each character by choosing exactly four active stats. Unspent Training Points are allowed.');v8BalancedRandom();v8EnsureShipChoices();v8WizardStep=5;v8RenderWizard()}}
function v8CharacterFields(p){const bg=v8Background(p.background),ab=v8Ability(p.ability),lat=v8Latent(p.latent),stats=v8PlayerStats(p);return`${v8Field('Background',v8Select('data-v8-char="background"',V8_BACKGROUNDS,p.background),'Background gives flavor, one modest feature/item, and a choice of starting strength.')}${v8Field('Personal Ability',v8Select('data-v8-char="ability"',V7_STARTING_ABILITIES,p.ability),'Separate from ship jobs.')}${v8Field('Strange Inclination',v8Select('data-v8-char="latent"',V8_LATENTS,p.latent),'A tiny quirk or latent seed—not a starting spell list.')}${v8Field('Portrait Art URL',`<input data-v8-char="art" value="${safe(p.art||'')}" placeholder="Optional override">`)}<div class="v8-desc-card"><strong>${safe(bg.name)}</strong> — ${safe(bg.flavor)}<div class="mechanic">${safe(bg.feature||bg.item?bg.item?`Starts with ${bg.item.name}.`:bg.feature:'Modest background feature.')}</div><div class="v8-bg-bonus"><span class="muted" style="align-self:center">Choose +1:</span>${bg.statOptions.filter(st=>p.activeStats.includes(st)).map(st=>`<button class="${p.backgroundStat===st?'on':''}" data-v8-bgstat="${st}">${st}</button>`).join('')||'<span class="v8-status-bad">Activate one of this Background’s suggested stats.</span>'}</div></div><div class="v8-desc-card"><strong>${safe(ab.name)}</strong> — ${safe(V8_ABILITY_FLAVOR[ab.id]||'A situational personal edge.')}<div class="mechanic">${safe(ab.description)}</div></div><div class="v8-desc-card"><strong>${safe(lat.name)}</strong> — ${safe(lat.description)}<div class="mechanic">${safe(lat.effect)}</div></div><div class="v8-stat-box"><div class="v8-stat-head"><div><strong style="color:#e2c58d">Starting Stats</strong><div class="muted" style="font-size:.69rem">Choose exactly four. Each begins at 1; Background adds +1; then spend 5 flexible points. Starting max 3.</div></div><span class="v8-points">${v8PointsRemaining(p)} points remaining</span></div><div class="v8-stats">${PLAYER_STATS.map(st=>{const on=p.activeStats.includes(st),v=stats[st];return`<div class="v8-stat ${on?'':'off'}"><div><div class="v8-stat-name">${st}</div><button class="v8-active-toggle" data-v8-active="${st}">${on?'Active':'Untrained'}</button></div><div class="v8-stat-desc">${safe(V8_STAT_INFO[st])}</div><div class="v8-stat-controls">${on?`<button data-v8-minus="${st}" aria-label="Decrease ${st}">−</button><span class="v8-stat-value">${v}</span><button data-v8-plus="${st}" aria-label="Increase ${st}">+</button>`:'<span class="muted">—</span>'}</div></div>`}).join('')}</div></div><div class="v8-appearance-panel"><div class="v8-section-title" style="border:0;padding-top:0">Appearance</div><div class="v8-appearance-grid">${v8AppearanceFields(p)}</div></div>`}

const V8_DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function v8Key(q,r){return`${q},${r}`}function v8ParseKey(key){return key.split(',').map(Number)}
function v8Neighbors(key){const[q,r]=v8ParseKey(key);return V8_DIRS.map(([dq,dr])=>v8Key(q+dq,r+dr))}
function v8Terrain(key){const t=v7Terrain(key),loc=state.map.locations?.[key];if(/lighthouse/i.test(loc?.type||''))return{...t,type:'island',feature:'lighthouse'};if(/wreck/i.test(loc?.type||''))return{...t,feature:'wreck'};if(/port/i.test(loc?.type||''))return{...t,type:'land',feature:'port'};if(/shoal/i.test(loc?.type||''))return{...t,type:'shoal'};if(/hazard/i.test(loc?.type||'')){if(/reef/i.test(loc?.name||''))return{...t,type:'shoal',feature:'reef'};if(/storm/i.test(loc?.name||'')||key==='4,-2')return{...t,type:'sea',feature:'storm'};return{...t,type:'sea',feature:'hazard'}}return t}
function v8IsLand(key){const t=v8Terrain(key);return t.type==='land'||t.type==='island'}
function v8WaterColor(key,t){const h=v7Hash(key),sets={sea:['#164b58','#124651','#174f5a','#10424e','#1a505b','#134852','#174954','#0f404c'],deep:['#092b3c','#082737','#0a3040','#072534','#0b2d3d','#082a39','#0a2938','#062332'],shoal:['#397c79','#438782','#34736f','#4a8a82','#3c817b','#4d8d86','#357873','#42847f']};const arr=sets[t.type]||sets.sea;return arr[h%arr.length]}
function v8LandPoints(c,key){const ns=v8Neighbors(key),candidates=[];for(let i=0;i<6;i++){const nk=ns[i],center=v7HexCenter(...v8ParseKey(nk)),dx=center.x-c.x,dy=center.y-c.y,dist=Math.hypot(dx,dy)||1,land=v8IsLand(nk),r=(land?.57:.34+(v7Hash(`${key}:${i}`)%9)/100)*dist;candidates.push([c.x+dx/dist*r,c.y+dy/dist*r-10]);const nk2=ns[(i+1)%6],center2=v7HexCenter(...v8ParseKey(nk2)),dx2=center2.x-c.x,dy2=center2.y-c.y,dist2=Math.hypot(dx2,dy2)||1,ux=dx/dist+dx2/dist2,uy=dy/dist+dy2/dist2,norm=Math.hypot(ux,uy)||1,near=land||v8IsLand(nk2),rr=(near?.52:.30+(v7Hash(`${key}:m${i}`)%10)/100)*((dist+dist2)/2);candidates.push([c.x+ux/norm*rr,c.y+uy/norm*rr-10])}return candidates.sort((a,b)=>Math.atan2(a[1]-c.y,a[0]-c.x)-Math.atan2(b[1]-c.y,b[0]-c.x))}
function v8PtsString(pts,dy=0){return pts.map(([x,y])=>`${x.toFixed(1)},${(y+dy).toFixed(1)}`).join(' ')}
function v8CoastEdges(c,key,pts){let out='';for(let i=0;i<pts.length;i+=2){const side=i/2,nk=v8Neighbors(key)[side];if(v8IsLand(nk))continue;const a=pts[(i+pts.length-1)%pts.length],b=pts[(i+1)%pts.length];out+=`<path class="v8-foam" d="M${a[0]} ${a[1]}Q${pts[i][0]} ${pts[i][1]+3} ${b[0]} ${b[1]}"/>`}return out}
function v8WaterDetail(c,key,t){const h=v7Hash(key),v=h%8,x=c.x,y=c.y;let d='';if(t.type==='shoal')d+=`<path d="M${x-33} ${y+7}q17-15 34-2t30-8" fill="none" stroke="#d0c387" stroke-width="5" opacity=".25"/><path d="M${x-25} ${y+12}q21-9 42-1" class="v8-wave"/>`;else{const y1=y-14+(h%19),x1=x-28+(h%13);d+=`<path class="v8-wave" d="M${x1} ${y1}q9-${3+v%4} 18 0t18 0"/>`;if(v%2===0)d+=`<path class="v8-wave" d="M${x-8} ${y+14}q7-4 14 0t15 0"/>`;if(v===2||v===6)d+=`<path class="v8-current" d="M${x-36} ${y-5}q38 18 72 1"/>`;if(v===5)d+=`<path d="M${x+15} ${y-18}l7-2m-22 5l8-2" stroke="#d8eeea" stroke-width="2" opacity=".34"/>`}return d}
function v8TerrainProps(c,key,t,loc){const h=v7Hash(key),x=c.x,y=c.y-18,land=t.type==='land'||t.type==='island';let out='';if(land){const flavor=h%5;if(flavor===0||/palm|cay/i.test(loc?.name||''))out+=`<g class="v8-tree" stroke="#57452d" stroke-width="2" fill="#466f4e">${[-18,2,21].map((dx,i)=>`<path d="M${x+dx} ${y+13}v-17"/><path d="M${x+dx} ${y-4}l-9-5m9 5l10-6m-10 6l-2-10"/>`).join('')}</g>`;if(flavor===1||flavor===4)out+=`<g class="v8-tree" fill="#355d42">${[-24,-7,12,27].map((dx,i)=>`<path d="M${x+dx} ${y+12-i%2*2}l8-18 8 18z"/>`).join('')}</g>`;if(flavor===2||key==='-3,2')out+=`<g fill="#696955" stroke="#3e4036" stroke-width="1"><path d="M${x-27} ${y+14}l18-33 15 29 12-24 20 32z"/></g>`;if(flavor===3)out+=`<path d="M${x-28} ${y+14}q11-24 23-2t18-3t22 5" fill="#8d7852" opacity=".55"/>`}

const fogCells=cells.filter(c=>!(state.map.devRevealAll||state.map.revealed.includes(c.key)));if(fogCells.length){html+=`<g class="v8-fog-veil">${fogCells.map(c=>`<circle cx="${c.x}" cy="${c.y}" r="69"/>`).join('')}</g><g>${fogCells.map((c,i)=>i%2===0?`<circle class="v8-fog-blob" cx="${c.x+(v7Hash(c.key)%23)-11}" cy="${c.y+(v7Hash(c.key+'y')%15)-7}" r="78"/>`:'').join('')}</g>`}$('#mapWorld',screen).innerHTML=html;$('#mapInfo',screen).innerHTML=v8MapInfo(state.map.selected);$$('[data-v8-layer]',screen).forEach(b=>b.onclick=()=>{state.map.layers[b.dataset.v8Layer]=!state.map.layers[b.dataset.v8Layer];saveState();renderMap()});const svg=$('#hexMap',screen);let start=null,drag=false;const apply=()=>{v8ClampMapView();svg.setAttribute('viewBox',`${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}`)};svg.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,vx:mapView.x,vy:mapView.y,id:e.pointerId};drag=false});svg.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!drag&&Math.hypot(dx,dy)>4){drag=true;svg.setPointerCapture?.(start.id)}if(drag){mapView.x=start.vx-dx*(mapView.w/svg.clientWidth);mapView.y=start.vy-dy*(mapView.h/svg.clientHeight);apply()}});svg.addEventListener('pointerup',e=>{if(start&&!drag){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('[data-hex]');if(target){state.map.selected=target.dataset.hex;saveState();renderMap()}}start=null;drag=false});svg.addEventListener('wheel',e=>{e.preventDefault();const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width,py=(e.clientY-rect.top)/rect.height,worldX=mapView.x+px*mapView.w,worldY=mapView.y+py*mapView.h,f=e.deltaY>0?1.13:.885,newW=clamp(mapView.w*f,500,2600),newH=newW*1000/1800;mapView.x=worldX-px*newW;mapView.y=worldY-py*newH;mapView.w=newW;mapView.h=newH;apply()},{passive:false});$('#zoomIn',screen).onclick=()=>{const cx=mapView.x+mapView.w/2,cy=mapView.y+mapView.h/2;mapView.w=clamp(mapView.w*.82,500,2600 const v8BaseRoleJobCard=roleJobCard;

function v10CustomPortraitField(p){const info='Optional. Paste a direct image URL or a path to an image included with the website. Direct PNG, JPG/JPEG, WebP, GIF and SVG image links work in modern browsers. A direct i.imgur.com image link works; a normal Imgur page/gallery URL usually does not. Relative paths such as images/characters/my-pirate.png and data URLs are also supported. Leave blank to use the built-in character creator.';return `<label class="v8-field"><span>Custom Portrait Image ${v10Info(info,'Custom Portrait Image')}</span><input data-v10-char="art" value="${safe(p.art||'')}" placeholder="Optional direct image URL or relative path"><small>Leave blank to use the built-in portrait.</small></label>`}
function v10CharacterChoiceFields(p){const bg=v8Background(p.background),ab=v8Ability(p.ability),lat=v8Latent(p.latent),bgStat=V9_BACKGROUND_STAT[p.background],abStat=V9_ABILITY_STAT[p.ability];return `${v8Field('Background',v8Select('data-v10-char="background"',V8_BACKGROUNDS,p.background),'Your past provides one modest feature/item and one automatic base-stat point.')}${v8Field('Personal Ability',v8Select('data-v10-char="ability"',V7_STARTING_ABILITIES,p.ability),'A situational personal edge, separate from ship jobs.')}${v8Field('Strange Inclination',v8Select('data-v10-char="latent"',V8_LATENTS,p.latent),'A tiny supernatural tendency or future Gift seed. It gives no raw stat point.')}${v8Field('Personal Goal',`<input data-v10-char="goal" value="${safe(p.goal||'')}" placeholder="What does this character want?">`)}${v10CustomPortraitField(p)}<div class="v8-desc-card"><strong>${safe(bg.name)}</strong> — ${safe(bg.flavor)}<div class="mechanic">${safe(bg.item?`Starts with ${bg.item.name}.`:bg.feature||'Modest background feature.')}</div><div class="v9-base-badge">Base: +1 ${safe(bgStat)}</div></div><div class="v8-desc-card"><strong>${safe(ab.name)}</strong> — ${safe(V8_ABILITY_FLAVOR[ab.id]||'A situational personal edge.')}<div class="mechanic">${safe(ab.description)}</div><div class="v9-base-badge">Base: +1 ${safe(abStat)}</div></div><div class="v8-desc-card"><strong>${safe(lat.name)}</strong> — ${safe(lat.description)}<div class="mechanic">${safe(lat.effect)}</div></div><div class="v8-appearance-panel"><div class="v8-section-title" style="border:0;padding-top:0">Appearance</div><div class="v8-appearance-grid">${v8AppearanceFields(p)}</div></div>`}

).join('')}</div>${remaining?`<div class="v9-unspent-warning">${remaining} Training Point${remaining===1?'':'s'} unspent. You may continue anyway.</div>`:''}</section></div><div class="v8-foot"><button class="secondary-btn" id="v10BackChoices">← Edit Character Choices</button><div class="v8-foot-right"><button class="primary-btn" id="v10NextCharacter">${v8EditIndex<v7SetupDraft.players.length-1?'Save & Next Character →':'Save Character →'}</button></div></div>`;
  $$('[data-v10-edit]',b).forEach(x=>x.onclick=()=>{v8EditIndex=Number(x.dataset.v10Edit);v8WizardStep=4;v8RenderWizard()});$$('[data-v10-untrained]',b).forEach(x=>x.onclick=()=>{v10SelectUntrainedCard(p,x.dataset.v10Untrained);v8RenderWizard()});$$('[data-v10-train]',b).forEach(x=>x.onclick=()=>{v9Train(p,x.dataset.v10Train,1);v10DraftStatus(p).statsDone=false;v8RenderWizard()});$$('[data-v10-refund]',b).forEach(x=>x.onclick=()=>{v9Train(p,x.dataset.v10Refund,-1);v10DraftStatus(p).statsDone=false;v8RenderWizard()});$('#v10BackChoices',b).onclick=()=>{v8WizardStep=4;v8RenderWizard()};$('#v10NextCharacter',b).onclick=()=>{if(!v10PlayerStatsComplete(p))return toast('Choose one Untrained Skill first.');v10DraftStatus(p).statsDone=true;if(v8EditIndex<v7SetupDraft.players.length-1){v8EditIndex++;v8WizardStep=4}else if(v7SetupDraft.players.every(v8PlayerComplete)){v8BalancedRandom();v8WizardStep=6}else{const next=v7SetupDraft.players.findIndex(x=>!v8PlayerComplete(x));v8EditIndex=next<0?0:next;v8WizardStep=4}v8RenderWizard()};v10BindInfo(b)

function v10KnownItemRows(showUndiscovered=false){const seen=new Map(V10_GENERIC_ITEMS.map(x=>[x[0],{name:x[0],category:x[1],description:x[2],footprint:x[3],known:true}]));for(const ship of state.ships||[]){for(const i of ship.hold?.items||[])seen.set(i.name,{name:i.name,category:i.category||kindCategory(i.kind),description:i.description||'Cargo currently known to the campaign.',footprint:itemRelativeCells(i).length+' cell'+(itemRelativeCells(i).length===1?'':'s'),known:true});for(const u of ship.upgrades||[])seen.set(u.name,{name:u.name,category:'Ship Upgrade',description:u.description||'Installed ship upgrade.',footprint:'Upgrade',known:true})}for(const p of state.players||[]){for(const i of p.equipment||[])seen.set(i.name,{name:i.name,category:i.category||'Equipment',description:i.description||'Personal equipment.',footprint:'Personal',known:true});for(const r of p.relics||[])seen.set(r.name||r,{name:r.name||r,category:'Relic',description:r.description||'Known supernatural relic.',footprint:'Personal',known:true})}const storyItems=[...(STORY.appendixItems||[]),...(window.STORY_DATA?.appendixItems||[])];for(const i of storyItems){if(i.known||showUndiscovered)seen.set(i.name,{...i,known:!!i.known})}return [...seen.values()]}
function v10OpenAppendix(tab='items'){const dev=debugEnabled()||state.flags?.v9DevelopmentDemo||state.flags?.v10DevelopmentDemo;showModal('Appendix',`<div class="v10-appendix"><div class="v10-appendix-tabs"><button class="${tab==='items'?'on':''}" data-v10-apptab="items">Items</button><button class="${tab==='roles'?'on':''}" data-v10-apptab="roles">Roles & Abilities</button></div><div id="v10AppendixBody"></div></div>`);const modal=$('#tidesModal'),body=$('#v10AppendixBody',modal),draw=t=>{if(t==='items'){body.innerHTML=`<div class="v10-appendix-tools"><input id="v10ItemSearch" placeholder="Search items…"><select id="v10ItemFilter"><option>All</option><option>Cargo</option><option>Equipment</option><option>Material</option><option>Consumable</option><option>Ship Upgrade</option><option>Relic</option></select>${dev?'<label><input type="checkbox" id="v10ShowUndiscovered"> Show Undiscovered</label>':''}</div><div id="v10ItemRows"></div>`;const render=()=>{const q=($('#v10ItemSearch',body).value||'').toLowerCase(),f=$('#v10ItemFilter',body).value,show=Boolean($('#v10ShowUndiscovered',body)?.checked);const rows=v10KnownItemRows(show).filter(i=>(f==='All'||i.category===f||f==='Cargo'&&/cargo|supply/i.test(i.category))&&`${i.name} ${i.category} ${i.description}`.toLowerCase().includes(q));$('#v10ItemRows',body).innerHTML=rows.map(i=>`<article class="v10-app-card"><div class="v10-app-art">${itemArtSvg({name:i.name,kind:i.category?.toLowerCase(),category:i.category},'')}</div><div><h3>${safe(i.name)}${i.known===false?' <small>Undiscovered</small>':''}</h3><span>${safe(i.category||'Item')} · ${safe(i.footprint||'—')}</span><p>${safe(i.description||'No description.')}</p></div></article>`).join('')||'<div class="empty-note">No matching entries.</div>'};$('#v10ItemSearch',body).oninput=render;$('#v10ItemFilter',body).onchange=render;if($('#v10ShowUndiscovered',body))$('#v10ShowUndiscovered',body).onchange=render;render()}else{body.innerHTML=`<h2 class="v10-app-heading">Ship Res function v10RenderTitle(){document.querySelector('.v7-title')?.remove();document.querySelector('.v8-wizard')?.remove();$('.app-shell')?.classList.add('v7-hidden');const draft=v10LoadDraft(),hasCampaign=Boolean(v7HadStoredCampaign||v7ProvidedCampaign||v10SafeLSGet(SAVE_KEY));const el=document.createElement('div');el.className='v7-title';el.innerHTML=`<div class="v7-title-inner"><div class="v7-title-crest">Tides</div><p class="v7-title-sub">Two uneasy ships. Shared choices. Strange water. A campaign engine built to remember years without writing the story for you.</p><div class="v7-title-actions">${hasCampaign?'<button class="primary-btn" id="v10Continue">Continue Campaign</button>':''}${draft?'<button class="primary-btn" id="v10Resume">Resume Campaign Setup</button>':''}<button class="primary-btn" id="v10New">New Campaign</button><button class="secondary-btn" id="v10Import">Import Campaign</button></div><button class="v7-demo-link" id="v10Demo">Development Demo · Chapter 1 / Session 1</button><input type="file" id="v10ImportFile" accept=".json,application/json" hidden></div>`;document.body.appendChild(el);if($('#v10Continue',el))$('#v10Continue',el).onclick=()=>v8EnterCampaign(true);if($('#v10Resume',el))$('#v10Resume',el).onclick=()=>v8StartWizard(6,true);$('#v10New',el).onclick=()=>{if(draft&&!confirm('Start another setup and replace the saved setup draft? Your active campaign will remain untouched.'))return;v10DiscardDraft();v8StartWizard()};$('#v10Demo',el).onclick=()=>{state=v10MakeDemoState();saveState(true);v8EnterCampaign(false,true)};$('#v10Import',el).onclick=()=>$('#v10ImportFile',el).click();$('#v10ImportFile',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=migrateState(JSON.parse(await f.text()));saveState(true);v8EnterCampaign(true)}catch(err){toast(err.message||'Import failed.')}}}

setupSaveTools=function(){const parent=$('.player-switcher');if(!parent)return;parent.querySelector('.save-menu')?.remove();const trigger=$('#exportSaveBtn');trigger.title='Save & campaign tools';trigger.textContent='☰';const menu=document.createElement('div');menu.className='save-menu';menu.hidden=true;menu.innerHTML=`<button id="menuNewCampaign">New Campaign…</button><button id="menuReturnTitle">Return to Title</button><div class="v9-menu-sep"></div><button id="menuAppendixItems">Appendix · Items</button><button id="menuAppendixRoles">Appendix · Roles & Abilities</button><div class="v9-menu-sep"></div><button id="menuExport">Export save</button><button id="menuImport">Import save</button><button id="menuSnapshot">Create backup snapshot</button><button id="menuRestore">Restore automatic backup</button><input type="file" id="importFile" accept="application/json,.json" hidden>`;parent.style.position='relative';parent.appendChild(menu);trigger.onclick=()=>menu.hidden=!menu.hidden;$('#menuNewCampaign',menu).onclick=()=>{menu.hidden=true;createSnapshot('before-new-campaign');showModal('Start a new campaign?',`<p class="muted">Your active campaign remains untouched while setup is in progress. A backup snapshot has been created.</p><div class="modal-actions"><button class="secondary-btn" data-close-modal>Cancel</button><button class="primary-btn" id="v10StartNew">Open New Campaign Setup</button></div>`);$('#v10StartNew').onclick=()=>{closeModal();v10DiscardDraft();v8StartWizard()}};$('#menuReturnTitle',menu).onclick=()=>{menu.hidden=true;v8RenderTitle()};$('#menuAppendixItems',menu).onclick=()=>{menu.hidden=true;v10OpenAppendix('items')};$('#menuAppendixRoles',menu).onclick=()=>{menu.hidden=true;v10OpenAppendix('roles')};$('#menuExport',menu).onclick=()=>{menu.hidden=true;exportSave()};$('#menuImport',menu).onclick=()=>$('#importFile',menu).click();$('#menuSnapshot',menu).onclick=()=>toast(createSnapshot('manual')?'Snapshot created.':'Snapshot failed.');$('#menuRestore',m
