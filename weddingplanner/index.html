// A proper chair is ~18 inches wide with a 17-inch seat height. The old chair was
// only ~8 inches wide despite being 3 feet tall, and was facing away from tables.
v9ModelChair=function(mesh,x,z,angle=0,col=v9C.ivory,style='banquet',r=.96){
 const c=Math.cos(angle),s=Math.sin(angle);
 const world=(u,v)=>[x+u*c-v*s,z+u*s+v*c];
 const put=(u,v,w,d,h,y,color,mat=2)=>{let p=world(u,v);mesh.box(p[0],p[1],w,d,h,y,color,mat,angle)};
 const isGold=style==='chiavari',isFolding=style==='folding';
 const frame=isGold?v9C.gold:isFolding?v9C.steel:v9C.woodLight;
 const uphol=style==='chiavari'?v9C.ivory:col;
 const scale=r;
 mesh.shadow(x,z,.86*scale,.82*scale,.14);
 // Slim legs, tapered visual profile, and upholstered seat with contrast piping.
 for(let sx of[-1,1])for(let sz of[-1,1]){
  put(sx*.54*scale,sz*.45*scale,.092*scale,.10*scale,1.41,0,frame,isGold?3:1);
  put(sx*.54*scale,sz*.45*scale,.15*scale,.15*scale,.075,0,v9Tint(frame,.82),1);
 }
 put(0,-.02*scale,1.41*scale,1.25*scale,.14,1.39,v9Tint(frame,.91),isGold?3:1);
 put(0,-.02*scale,1.32*scale,1.18*scale,.23,1.50,v9Tint(uphol,1.06),2);
 put(0,-.06*scale,1.20*scale,.91*scale,.055,1.70,v9Tint(uphol,1.12),2);
 // Small back uprights, a gently pitched chair back, and human-sized upholstery.
 for(let sx of[-1,1])put(sx*.57*scale,.51*scale,.083*scale,.13*scale,1.31,1.53,frame,isGold?3:1);
 if(isGold){
  put(0,.55*scale,1.28*scale,.12*scale,.14,2.67,frame,3);
  for(let i=-2;i<=2;i++)put(i*.22*scale,.54*scale,.055*scale,.082*scale,.82,1.79,frame,3);
  put(0,.54*scale,1.10*scale,.14*scale,.13,1.78,frame,3);
 }else if(isFolding){
  put(0,.55*scale,1.29*scale,.15*scale,.79,2.00,v9Tint(uphol,.9),2);
  put(0,.56*scale,1.32*scale,.17*scale,.16,2.80,frame,1);
 }else{
  // Three gently stepped panels create a gently curved upholstered back.
  put(0,.53*scale,1.25*scale,.17*scale,.29,1.92,v9Tint(uphol,.95),2);
  put(0,.58*scale,1.27*scale,.18*scale,.35,2.18,v9Tint(uphol,1.01),2);
  put(0,.63*scale,1.19*scale,.17*scale,.30,2.50,v9Tint(uphol,1.07),2);
  put(0,.64*scale,1.29*scale,.13*scale,.10,2.78,frame,1);
 }
};

// Detailed modeling for objects that were previously only a generic block.
const v11ModelPrev=v9GLObject;
v9GLObject=function(mesh,o,sp){

 const put=(u,v,bw,bd,bh,y,color,mat=2)=>{let p=world(u,v);mesh.box(p[0],p[1],bw,bd,bh,y,color,mat,rot)};
 if(k==='dance'){
  // Physically flat modular dance-floor tiles; avoids a giant diagonal triangular face.
  mesh.shadow(c[0],c[1],w*.56,d*.56,.09);
  const nx=Math.min(20,Math.max(2,Math.round(w/2.15))), nz=Math.min(20,Math.max(2,Math.round(d/2.15)));
  for(let x=0;x<nx;x++)for(let z=0;z<nz;z++){
   const tileW=w/nx,tileD=d/nz;
   const tone=(x+z)%2?v9C.ivory:v9C.woodLight;
   put(-w/2+(x+.5)*tileW,-d/2+(z+.5)*tileD,tileW-.055,tileD-.055,.20,0,tone,2);
  }

 }
 if(k==='sofa'){
  const fabric=o.color?v9Hex(o.color):v9C.pale;
  mesh.shadow(c[0],c[1],w*.56,d*.61,.14);
  for(let x of[-w*.40,w*.40])for(let z of[-d*.35,d*.35])put(x,z,.19,.20,.30,0,v9C.wood,1);
  // Separate volumes with clear geometry, avoiding overlapping software-rendered faces.
  put(0,0,w-.20,d-.18,.88,.38,v9Tint(fabric,.78),2);
  put(0,-d*.37,w-.16,d*.22,1.18,.59,v9Tint(fabric,.84),2);
  put(-w*.45,d*.10,w*.09,d*.73,1.03,.60,v9Tint(fabric,.81),2);
  put(w*.45,d*.10,w*.09,d*.73,1.03,.60,v9Tint(fabric,.81),2);
  const n=o.type==='loungeChair'?1:o.type==='loveseat'?2:Math.max(2,Math.min(4,Math.round(w/2.3)));
  for(let i=0;i<n;i++){

   put(u,d*.20,bw,d*.46,.15,1.26,v9Tint(fabric,1.10),2);
   // Narrow inset back cushion; not an intersecting second wall.
   put(u,-d*.205,bw*.94,d*.09,.35,1.76,v9Tint(fabric,1.02),2);
  }
  if(w>4.5){put(-w*.29,d*.16,Math.min(.64,w*.13),d*.27,.13,1.41,v9C.ivory,2);put(w*.27,d*.07,Math.min(.62,w*.13),d*.24,.13,1.41,v9C.rose,2)}
  heightScale(3);return;
 }
 if(k==='booth'||o.type==='photobooth'){
  const H=Math.min(8.7,sp.height||9);

  for(let i=0;i<11;i++)put(-w*.40+(i+.5)*w*.80/11,-d*.43,.07,.09,H*.60,H*.14,i%3?v9C.gold:v9C.rose,i%3?3:2);
  for(let u of[-w*.43,w*.43]){
   put(u,0,.13,d*.94,H*.81,0,v9C.gold,3);
   put(u,-d*.42,.20,.18,H*.83,0,v9C.woodLight,1);
  }
  put(0,-d*.43,w*.88,.12,.20,H*.83,v9C.gold,3);
  put(0,d*.38,w*.86,.12,.15,H*.79,v9C.wood,1);
  for(let i=0;i<7;i++){let p=world(-w*.37+i*w*.74/6,-d*.43);mesh.sphere(p[0],H*.82,p[1],.12,i%2?v9C.rose:v9C.ivory,4,6)}
  // Camera, ring light, and small display at the guest side.
  put(w*.13,d*.10,.22,.23,3.35,0,v9C.dark,3);
  put(w*.13,d*.10,.85,.60,.48,3.20,v9C.dark,3);
  mesh.cylinder(...world(w*.13,d*.15),.23,.23,3.45,.12,v9C.glass,4,12);
  let ring=world(-w*.16,d*.14);
  for(let i=0;i<14;i++){let a=i*Math.PI*2/14,p=world(-w*.16+Math.cos(a)*.57,d*.14+Math.sin(a)*.11);mesh.sphere(p[0],3.62+Math.sin(a)*.57,p[1],.09,v9C.ivory,4,5)}
  put(-w*.16,d*.14,.10,.10,3.2,0,v9C.steel,3);
  return;
 }
 if(k==='chandelier'){
  const ceil=Math.max(7,sp.height||9),height=Math.min(ceil-.6,7.2),rx=Math.min(w*.40,1.85),rz=Math.min(d*.40,1.85);
  mesh.shadow(c[0],c[1],w*.43,d*.43,.05);

  for(let ring of[1,.56]){

   }
   for(let i=0;i<(ring===1?12:8);i++){
    let a=i*2*Math.PI/(ring===1?12:8),p=world(Math.cos(a)*rx*ring,Math.sin(a)*rz*ring);

    mesh.sphere(p[0],height-.62-(1-ring)*.42,p[1],.15,v9C.ivory,4,5,1.38);
   }
  }
  return;
 }
 if(k==='piano'){
  mesh.shadow(c[0],c[1],w*.57,d*.56,.14);
  for(let dx of[-w*.30,w*.29])for(let dz of[-d*.23,d*.26])put(dx,dz,.18,.18,2.36,0,v9C.dark,3);
  // Grand-piano-style lid and visible keyboard.
  put(0,0,w,d,.34,2.30,v9C.black,3);
  put(0,-d*.20,w*.92,d*.40,.08,2.65,v9Tint(v9C.black,1.14),3);
  put(0,d*.32,w*.74,d*.23,.05,2.68,v9C.ivory,7);
  for(let i=0;i<11;i++)put(-w*.33+(i+.5)*w*.66/11,d*.32,w*.66/11*.57,d*.15,.075,2.72,v9C.black,3);
  put(w*.15,-d*.13,.09,.08,.77,2.67,v9C.gold,3);
  return;
 }

function attachRealModel(group,key,w,d,h){
 if(group.userData.realAsset)return true;
 const src=assetTemplates.get(key);
 if(!src){assetPending.push({group,key,w,d,h});return false;}
 for(const child of group.children)child.visible=false;
 const inst=src.clone(true);
 inst.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true}});
 const bbox=new THREE.Box3().setFromObject(inst),size=bbox.getSize(new THREE.Vector3());
 inst.scale.set(w/Math.max(.01,size.x),h/Math.max(.01,size.y),d/Math.max(.01,size.z));
 if(key==='banquet')inst.rotation.y=Math.PI;
 inst.updateMatrixWorld(true);
 const corrected=new THREE.Box3().setFromObject(inst),centre=corrected.getCenter(new THREE.Vector3());
 inst.position.x-=centre.x;inst.position.z-=centre.z;inst.position.y-=corrected.min.y;
 group.add(inst);group.userData.realAsset=key;return true;
}
async function loadPhotographicAssets(){
 try{
  const {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/loaders/GLTFLoader.js');
  const loader=new GLTFLoader();
  for(const [key,url] of Object.entries(assetUrls)){
   try{const gltf=await loader.loadAsync(url);const model=gltf.scene;
    model.traverse(node=>{if(node.isMesh){assetGeo.add(node.geometry);const material=Array.isArray(node.material)?node.material:[node.material];for(const m of material)assetMats.add(m)}});
    assetTemplates.set(key,model);
    for(const pending of assetPending.filter(p=>p.key===key)){
      let node=pending.group;while(node&&node!==roomGroup)node=node.parent;
      if(node===roomGroup)attachRealModel(pending.group,pending.key,pending.w,pending.d,pending.h);
    }
    renderer.shadowMap.needsUpdate=true;queueDraw();
   }catch(e){console.info('Using modeled furniture fallback for',key)}
  }
 }catch(e){console.info('Using self-contained furniture models; optional CC0 asset loader unavailable')}
}
