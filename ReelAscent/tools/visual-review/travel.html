<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel layout review</title><link rel="stylesheet" href="../../src/styles.css"></head><body style="background:#294e58"><script type="module">
import { BoatTravelMenu } from '../../src/ui/boat-travel.js';
const markup = new DOMParser().parseFromString(await (await fetch('/index.html')).text(), 'text/html');
document.body.append(markup.querySelector('#boat-travel'));
const known = new Set(['main-mountain', 'home-island', 'shop-island', 'aquarium-island']);
const menu = new BoatTravelMenu(() => {}, { getDestinationAccess(id) {
  if (known.has(id)) return { playable: true, revealed: true, state: 'available' };
  if (id === 'bluewater-reach') return { playable: false, revealed: true, state: 'locked-purchase', reason: 'Buy the Bluewater Boat' };
  if (id === 'skyreach-foundation') return { playable: false, revealed: true, state: 'known-unavailable', reason: 'Under construction' };
  return { playable: false, revealed: false, state: 'locked-cloud', reason: 'Discover 5 Trail Badges or catch 25 unique species.' };
} }); menu.open('home-island');
</script></body></html>
